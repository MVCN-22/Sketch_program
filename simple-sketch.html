      if (pts.length && near(pts[pts.length - 1], c.model)) { return; }
      pts.push(cp(c.model));
    },
    enter: finishOutline,
    dbl: finishOutline,
    draft: function () {
      if (!drawing || !cur || !cur.model) { return null; }
      const pts = drawing.pts.concat([cur.model]);
      if (pts.length < 3) { return { viewId: drawing.viewId, entity: newEnt("line", { id: "__draft__", pts: pts.length < 2 ? [pts[0], pts[0]] : pts, pen: "outline" }) }; }
      return { viewId: drawing.viewId, entity: newEnt("outline", { id: "__draft__", pts: pts }) };
    }
  };

  function rectPts(a, b) {
    const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]), y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
    return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  }
  IMPL.rect = {
    click: function (c) {
      if (!c.model) { return; }
      if (!drawing) { drawing = { viewId: c.viewId, pts: [cp(c.model)], a: cp(c.model) }; return; }
      const a = drawing.a, b = c.model;
      if (Math.abs(a[0] - b[0]) < 1 || Math.abs(a[1] - b[1]) < 1) { warn("The rectangle is too small."); return; }
      const vid = drawing.viewId;
      drawing = null;
      commitEntity(vid, newEnt("outline", { pts: rectPts(a, b) }), "Add rectangle");
    },
    draft: function () {
      if (!drawing || !cur || !cur.model) { return null; }
      const a = drawing.a, b = cur.model;
      if (Math.abs(a[0] - b[0]) < 1e-6 || Math.abs(a[1] - b[1]) < 1e-6) { return null; }
      return { viewId: drawing.viewId, entity: newEnt("outline", { id: "__draft__", pts: rectPts(a, b) }) };
    }
  };

  function finishBar() {
    if (!drawing || !drawing.pts) { return; }
    const pts = dedupe(drawing.pts);
    const vid = drawing.viewId;
    if (pts.length < 2) { warn("A bar needs at least 2 points."); return; }
    drawing = null;
    commitEntity(vid, newEnt("bar", barProps(pts)), "Add bar");
  }
  IMPL.bar = {
    click: function (c) {
      if (!c.model) { return; }
      const d = drawing || (drawing = { viewId: c.viewId, pts: [] });
      if (d.pts.length && near(d.pts[d.pts.length - 1], c.model)) { return; }
      d.pts.push(cp(c.model));
    },
    enter: finishBar,
    dbl: finishBar,
    draft: function () {
      if (!drawing || !cur || !cur.model || !drawing.pts.length) { return null; }
      const pts = drawing.pts.concat([cur.model]);
      const pr = barProps(pts);
      pr.id = "__draft__"; pr.closed = false; pr.hooks = false;
      return { viewId: drawing.viewId, entity: newEnt("bar", pr) };
    }
  };

  IMPL.stirrup = {
    click: function (c) {
      const v = viewObj(c.viewId);
      const o = v && c.rawModel ? outlineUnder(v, c.rawModel) : null;
      if (!o) { warn("Click inside a concrete outline."); return; }
      commitEntity(v.id, stirrupEntity(o), "Add stirrup");
    },
    draft: function () {
      if (!cur || !cur.rawModel) { return null; }
      const v = viewObj(cur.viewId);
      const o = v ? outlineUnder(v, cur.rawModel) : null;
      return o ? { viewId: v.id, entity: stirrupEntity(o, "__draft__") } : null;
    }
  };

  function chainExtend(ch, o, edge) {
    const n = o.pts.length, e = ch.edges;
    if (e.length >= n - 1) { return null; }
    if (e.indexOf(edge) >= 0) { return null; }
    if (edge === (e[e.length - 1] + 1) % n) { return e.concat([edge]); }
    if (edge === (e[0] - 1 + n) % n) { return [edge].concat(e); }
    return null;
  }

  IMPL.edgebar = {
    click: function (c, e) {
      const pick = edgePick(c);
      const v = viewObj(c.viewId);
      if (!pick || !v) { chain = null; if (!pick) { warn("Click on an outline edge."); } return; }
      if (e.shiftKey && chain && chain.outlineId === pick.o.id) {
        const ext = chainExtend(chain, pick.o, pick.i);
        const f = RS.model.find(doc(), chain.barId);
        if (ext && f) {
          const ent = edgeBarEntity(pick.o, ext);
          RS.store.edit(function (d) {
            const g = RS.model.find(d, chain.barId);
            if (g) { g.entity.pts = ent.pts; g.entity.kind = ent.kind; }
          }, "Extend edge bar");
          chain.edges = ext;
          RS.store.setSel([chain.barId]);
          return;
        }
      }
      const ent = edgeBarEntity(pick.o, [pick.i]);
      commitEntity(v.id, ent, "Add edge bar");
      chain = { barId: ent.id, outlineId: pick.o.id, edges: [pick.i] };
    },
    enter: function () { chain = null; },
    dbl: function () { chain = null; },
    draft: function () {
      if (!cur || !cur.rawModel) { return null; }
      const v = viewObj(cur.viewId);
      const pick = v ? edgePick(cur) : null;
      if (!pick) { return null; }
      let edges = [pick.i];
      if (lastEvt && lastEvt.shiftKey && chain && chain.outlineId === pick.o.id) { edges = chainExtend(chain, pick.o, pick.i) || edges; }
      if (chain && chain.outlineId === pick.o.id && !(lastEvt && lastEvt.shiftKey) && chain.edges.indexOf(pick.i) >= 0) { return null; }
      return { viewId: v.id, entity: edgeBarEntity(pick.o, edges, "__draft__") };
    }
  };

  IMPL.edgedots = {
    click: function (c) {
      const pick = edgePick(c);
      if (!pick) { warn("Click on an outline edge."); return; }
      commitEntity(c.viewId, edgeDotsEntity(pick.o, pick.i), "Add dots on edge");
    },
    draft: function () {
      if (!cur || !cur.rawModel) { return null; }
      const pick = edgePick(cur);
      return pick ? { viewId: cur.viewId, entity: edgeDotsEntity(pick.o, pick.i, "__draft__") } : null;
    }
  };

  function dotsEntity(a, b, id) {
    const o = RS.toolOpts;
    const props = { mode: "count", a: cp(a), b: cp(b), n: Math.max(1, Math.round(pos(o.n, 2))), d: pos(o.d, 16), face: faceOf(o.face) };
    if (id) { props.id = id; }
    return newEnt("dots", props);
  }
  IMPL.dots = {
    click: function (c) {
      if (!c.model) { return; }
      if (!drawing) { drawing = { viewId: c.viewId, pts: [], a: cp(c.model) }; return; }
      if (near(drawing.a, c.model, 1e-6)) { warn("Pick a second point for the row."); return; }
      const vid = drawing.viewId, a = drawing.a;
      drawing = null;
      commitEntity(vid, dotsEntity(a, c.model), "Add dots");
    },
    draft: function () {
      if (!drawing || !cur || !cur.model) { return null; }
      return { viewId: drawing.viewId, entity: dotsEntity(drawing.a, cur.model, "__draft__") };
    }
  };

  function labelEntity(d, at, id) {
    const props = { ref: d.ref, text: "", at: cp(at), tip: cp(d.tip), dist: null, align: at[0] < d.tip[0] ? "right" : "left" };
    if (id) { props.id = id; }
    return newEnt("label", props);
  }
  IMPL.label = {
    click: function (c) {
      if (!drawing) {
        const h = hitTest(c.paper, { filter: function (e) { return e.type === "bar" || e.type === "dots"; }, tolPx: 8 });
        const f = h ? RS.model.find(doc(), h.id) : null;
        if (!f || !f.view) { warn("Click on a bar or a dot row first."); return; }
        const model = toModel(f.view, c.paper);
        const tip = dotsLabelTip(f.entity, model);
        if (!tip) { warn("This bar has no usable geometry."); return; }
        if (RS.store.activeView() !== f.view.id) { RS.store.setActiveView(f.view.id); }
        drawing = { viewId: f.view.id, pts: [], ref: f.entity.id, tip: tip };
        return;
      }
      if (!c.model) { return; }
      if (!RS.model.find(doc(), drawing.ref)) { drawing = null; warn("The bar was removed."); return; }
      const vid = drawing.viewId, ent = labelEntity(drawing, c.model);
      drawing = null;
      commitEntity(vid, ent, "Add label");
    },
    draft: function () {
      if (!drawing || !drawing.ref || !cur || !cur.model) { return null; }
      return { viewId: drawing.viewId, entity: labelEntity(drawing, cur.model, "__draft__") };
    }
  };

  function dimOffset(a, b, p) {
    const u = G.unit(G.sub(b, a));
    return U.round(G.dot(G.sub(p, a), G.perp(u)), 1);
  }
  IMPL.dim = {
    click: function (c) {
      if (!c.model) { return; }
      if (!drawing) { drawing = { viewId: c.viewId, pts: [], a: cp(c.model) }; return; }
      if (!drawing.b) {
        if (near(drawing.a, c.model, 0.5)) { warn("Pick a second point."); return; }
        drawing.b = cp(c.model);
        return;
      }
      const vid = drawing.viewId, a = drawing.a, b = drawing.b;
      drawing = null;
      commitEntity(vid, newEnt("dim", { a: a, b: b, off: dimOffset(a, b, c.model) }), "Add dimension");
    },
    draft: function () {
      if (!drawing || !cur || !cur.model) { return null; }
      if (!drawing.b) { return { viewId: drawing.viewId, entity: newEnt("dim", { id: "__draft__", a: drawing.a, b: cur.model, off: 0 }) }; }
      return { viewId: drawing.viewId, entity: newEnt("dim", { id: "__draft__", a: drawing.a, b: drawing.b, off: dimOffset(drawing.a, drawing.b, cur.model) }) };
    }
  };

  IMPL.cut = {
    click: function (c) {
      if (!c.model) { return; }
      if (!drawing) { drawing = { viewId: c.viewId, pts: [], a: cp(c.model) }; return; }
      if (near(drawing.a, c.model, 0.5)) { warn("Pick a second point."); return; }
      const vid = drawing.viewId, a = drawing.a;
      drawing = null;
      commitEntity(vid, newEnt("cut", { a: a, b: cp(c.model), name: nextCutName(sheet()) }), "Add section cut");
    },
    draft: function () {
      if (!drawing || !cur || !cur.model || near(drawing.a, cur.model, 1e-6)) { return null; }
      return { viewId: drawing.viewId, entity: newEnt("cut", { id: "__draft__", a: drawing.a, b: cur.model, name: nextCutName(sheet()) }) };
    }
  };

  IMPL.joint = {
    click: function (c) {
      if (!c.model) { return; }
      const v = viewObj(c.viewId);
      let dir = [1, 0], best = null;
      const tol = 14 / T.z * pos(v && v.scale, 1);
      entList(v).forEach(function (e) {
        if ((e.type !== "outline" && e.type !== "line" && e.type !== "bar") || !Array.isArray(e.pts)) { return; }
        const pts = e.pts.filter(isPt), closed = e.type === "outline" || !!e.closed, n = pts.length;
        const cnt = closed ? n : n - 1;
        for (let i = 0; i < cnt; i++) {
          const r = G.closestOnSeg(c.model, pts[i], pts[(i + 1) % n]);
          if (!best || r.d < best.d) { best = { d: r.d, a: pts[i], b: pts[(i + 1) % n] }; }
        }
      });
      if (best && best.d <= tol && G.dist(best.a, best.b) > 1e-9) { dir = G.unit(G.sub(best.b, best.a)); }
      commitEntity(c.viewId, newEnt("joint", { at: cp(c.model), dir: [U.round(dir[0], 4), U.round(dir[1], 4)] }), "Add joint mark");
    },
    draft: function () {
      if (!cur || !cur.model) { return null; }
      return { viewId: cur.viewId, entity: newEnt("joint", { id: "__draft__", at: cur.model }) };
    }
  };

  IMPL.text = {
    click: function (c) {
      if (!c.model) { return; }
      openEditor({ viewId: c.viewId, model: cp(c.model), text: "", entityId: null });
    }
  };

  IMPL.view = {
    click: function (c) {
      const sh = sheet();
      if (!sh) { warn("There is no sheet."); return; }
      const v = RS.model.newView({
        name: nextViewName(sh), kind: "section", scale: pos(RS.toolOpts.scale, 20),
        x: U.round(c.paper[0], 0), y: U.round(c.paper[1], 0)
      });
      RS.store.edit(function (d) {
        const s = RS.model.activeSheet(d);
        s.views.push(v);
      }, "Add view");
      RS.store.setActiveView(v.id);
      RS.store.setTool("select");
    }
  };

  function buildDraft() {
    try {
      const t = RS.store.tool();
      const impl = IMPL[t];
      return impl && impl.draft ? impl.draft() : null;
    } catch (err) { return null; }
  }

  // ------------------------------------------------------------------ inline text editor
  function openEditor(opt) {
    closeEditor(false);
    const v = viewObj(opt.viewId);
    const q = v ? toScreen(toPaperPt(v, opt.model)) : [20, 20];
    const el = document.createElement("input");
    el.type = "text";
    el.value = opt.text || "";
    el.setAttribute("aria-label", "Text");
    el.style.cssText = "position:absolute;z-index:5;min-width:160px;font:14px Arial,sans-serif;padding:2px 4px;border:1.5px solid " +
      SEL_COLOR + ";background:#fff;color:#000;outline:none;left:" + Math.max(0, q[0]) + "px;top:" + Math.max(0, q[1] - 12) + "px";
    host.appendChild(el);
    editor = { el: el, opt: opt, done: false };
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); closeEditor(true); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeEditor(false); }
      else { e.stopPropagation(); }
    });
    el.addEventListener("blur", function () { closeEditor(true); });
    setTimeout(function () { if (editor && editor.el === el) { el.focus(); el.select(); } }, 0);
  }

  function closeEditor(commit) {
    if (!editor || editor.done) { return; }
    const ed = editor;
    ed.done = true;
    editor = null;
    const text = ed.el.value;
    if (ed.el.parentNode) { ed.el.parentNode.removeChild(ed.el); }
    if (!commit || text.trim() === "") { return; }
    try {
      if (ed.opt.entityId) {
        RS.store.edit(function (d) {
          const f = RS.model.find(d, ed.opt.entityId);
          if (f && f.entity.type === "text") { f.entity.text = text; }
        }, "Edit text");
      } else if (viewObj(ed.opt.viewId)) {
        commitEntity(ed.opt.viewId, newEnt("text", { at: ed.opt.model, text: text, h: RS.config.textHeights.note }), "Add text");
      }
    } catch (err) { warn(String(err && err.message ? err.message : err)); }
  }

  // ------------------------------------------------------------------ select tool
  function startPan(e, p) {
    panning = { x: p[0], y: p[1], ox: T.ox, oy: T.oy };
    host.style.cursor = "grabbing";
  }

  function selectDown(e, c) {
    if (e.altKey && tryInsertVertex(c)) { return; }
    const h = hitTest(c.paper);
    if (h && h.kind === "handle") {
      const f = RS.model.find(doc(), h.id);
      if (!f) { return; }
      drag = {
        type: "handle", id: h.id, hk: h.hk, hi: h.hi, viewId: f.view ? f.view.id : null,
        orig: U.clone(f.entity), startPx: c.px, moved: false, point: null
      };
      return;
    }
    if (h && h.kind === "entity") {
      const f = RS.model.find(doc(), h.id);
      if (f && f.view && RS.store.activeView() !== f.view.id) { RS.store.setActiveView(f.view.id); }
      let sel = RS.store.sel();
      let wasMulti = false;
      if (e.shiftKey) {
        sel = sel.indexOf(h.id) >= 0 ? sel.filter(function (x) { return x !== h.id; }) : sel.concat([h.id]);
        RS.store.setSel(sel);
      } else if (sel.indexOf(h.id) < 0) {
        RS.store.setSel([h.id]);
      } else if (sel.length > 1) { wasMulti = true; }
      sel = RS.store.sel();
      if (sel.indexOf(h.id) >= 0 && f) {
        const ids = [], orig = {};
        sel.forEach(function (id) {
          const g = RS.model.find(doc(), id);
          if (g) { ids.push(id); orig[id] = U.clone(g.entity); }
        });
        drag = {
          type: "move", id: h.id, ids: ids, orig: orig, viewId: f.view ? f.view.id : null, scale: f.view ? pos(f.view.scale, 1) : 1,
          startPaper: c.paper, startRaw: c.rawModel, startPx: c.px, moved: false, dp: [0, 0], shift: !!e.shiftKey, collapse: wasMulti && !e.shiftKey
        };
      }
      return;
    }
    if (h && h.kind === "viewtitle") {
      if (RS.store.activeView() !== h.vid) { RS.store.setActiveView(h.vid); }
      if (!e.shiftKey && RS.store.sel().length) { RS.store.setSel([]); }
      startViewDrag(h.vid, c);
      return;
    }
    if (e.altKey && !h) {                                    // Alt + drag on empty paper inside the active view's frame
      const av = viewObj(RS.store.activeView());
      const bb = av ? viewBoxes().filter(function (o) { return o.v.id === av.id; })[0] : null;
      const b = bb && bb.bb;
      if (b && c.paper[0] >= b[0] - 5 && c.paper[0] <= b[2] + 5 && c.paper[1] >= b[1] - 5 && c.paper[1] <= b[3] + 12) {
        if (!e.shiftKey && RS.store.sel().length) { RS.store.setSel([]); }
        startViewDrag(av.id, c);
        return;
      }
    }
    const v = viewAt(c.paper);
    if (v && RS.store.activeView() !== v.id) { RS.store.setActiveView(v.id); }
    if (!e.shiftKey && RS.store.sel().length) { RS.store.setSel([]); }
  }

  function startViewDrag(vid, c) {
    const v = viewObj(vid);
    if (!v) { return; }
    drag = {
      type: "view", id: vid, viewId: vid, orig: { x: v.x, y: v.y },
      startPaper: c.paper, startPx: c.px, moved: false, dp: [0, 0]
    };
    host.style.cursor = "move";
  }

  function tryInsertVertex(c) {
    const d = doc();
    const sel = RS.store.sel();
    for (let k = 0; k < sel.length; k++) {
      const f = RS.model.find(d, sel[k]);
      if (!f || !f.view) { continue; }
      const t = f.entity.type;
      if ((t !== "outline" && t !== "line" && t !== "bar") || !Array.isArray(f.entity.pts) || !f.entity.pts.every(isPt)) { continue; }
      const model = toModel(f.view, c.paper);
      const closed = t === "outline" || !!f.entity.closed;
      const r = G.closestOnPath(model, f.entity.pts, closed);
      const tol = 8 / T.z * pos(f.view.scale, 1);
      if (r && r.d <= tol) {
        const id = f.entity.id, idx = r.i + 1, p = r2(r.p);
        RS.store.edit(function (doc2) {
          const g = RS.model.find(doc2, id);

    return false;
  }

  function removeVertexAt(c) {
    const h = hitTest(c.paper);
    if (!h || h.kind !== "handle" || h.hi < 0) { return false; }
    const f = RS.model.find(doc(), h.id);
    if (!f) { return false; }
    const e = f.entity, t = e.type;
    if (t !== "outline" && t !== "line" && t !== "bar") { return false; }
    let ring = null, min = 2;
    if (h.hk === "pts") { ring = e.pts; min = (t === "outline" || e.closed) ? 3 : 2; }
    else if (h.hk.indexOf("holes.") === 0) { ring = (e.holes || [])[parseInt(h.hk.slice(6), 10)]; min = 3; }
    if (!Array.isArray(ring) || ring.length <= min) { warn("A " + t + " needs at least " + min + " points."); return true; }
    const id = h.id, hk = h.hk, hi = h.hi;
    RS.store.edit(function (d) {
      const g = RS.model.find(d, id);

    }, "Remove vertex");
    return true;
  }

  function restoreDrag() {
    if (!drag) { return; }
    const d = doc();
    if (drag.type === "view") {
      const v = RS.model.viewById(d, drag.id);
      if (v) { v.x = drag.orig.x; v.y = drag.orig.y; }
    } else if (drag.type === "move") {
      drag.ids.forEach(function (id) {
        const f = RS.model.find(d, id);
        if (f) { Object.keys(f.entity).forEach(function (k) { delete f.entity[k]; }); Object.assign(f.entity, U.clone(drag.orig[id])); }
      });
    } else {
      const f = RS.model.find(d, drag.id);

    }

    if (drag.type === "view") {
      // paper mm, on a 5 mm step (Shift = free)
      const g = e.shiftKey ? 0 : 5;
      const sn = function (n) { return g ? Math.round(n / g) * g : U.round(n, 2); };
      drag.dp = [sn(c.paper[0] - drag.startPaper[0]), sn(c.paper[1] - drag.startPaper[1])];
      const v = viewObj(drag.id);
      if (v) { v.x = U.round(drag.orig.x + drag.dp[0], 2); v.y = U.round(drag.orig.y + drag.dp[1], 2); }
    } else if (drag.type === "handle") {
      if (!c.model) { return; }
      drag.point = drag.viewId === null ? [U.round(c.paper[0], 2), U.round(c.paper[1], 2)] : cp(c.model);
      const f = RS.model.find(doc(), drag.id);
      if (f) { applyHandle(f.entity, drag.hk, drag.hi, drag.point); }
    } else {
      // delta in the model of the clicked entity's view, on the grid; Shift locks to one axis
      const sc = drag.scale, g = sc >= 50 ? 10 : 5;

      dm = [Math.round(dm[0] / g) * g, Math.round(dm[1] / g) * g];

      drag.dp = drag.viewId === null ? [dm[0], dm[1]] : [dm[0] / sc, -dm[1] / sc];
      drag.ids.forEach(function (id) {
        const f = RS.model.find(doc(), id);
        if (!f) { return; }
        const o = U.clone(drag.orig[id]);
        const dd = deltaForEntity(f, drag.dp);
        translateEntity(o, dd[0], dd[1]);

        const v = RS.model.viewById(d, dr.id);
        if (v) { v.x = U.round(dr.orig.x + dr.dp[0], 2); v.y = U.round(dr.orig.y + dr.dp[1], 2); }
      }, "Move view");
    } else if (dr.type === "move") {
      if (dr.dp[0] === 0 && dr.dp[1] === 0) { schedule(); return; }

        case "rect": return "Click the opposite corner.";
        case "bar": return d.pts.length < 2 ? "Click the next point of the bar." : "Click the next point. Enter or double-click ends the bar.";
        case "dots": return "Click the last dot of the row.";
        case "label": return "Click where the label text goes.";

/* --- src/ui/panels.js --- */
/* ui/panels.js: the right-hand properties panel (selected entity form, view, sheet and document settings) */

      o = o[parts[i]];

  const T = {
    ent: (id) => (d) => { const f = RS.model.find(d, id); return f ? f.entity : null; },
    view: (id) => (d) => RS.model.viewById(d, id),
    sheet: () => (d) => RS.model.activeSheet(d),
    title: () => (d) => { const s = RS.model.activeSheet(d); return s ? s.title : null; },
    notes: () => (d) => { const s = RS.model.activeSheet(d); return s ? s.notes : null; },

    spec: { type: "text"|"textarea"|"num"|"int"|"select"|"check"|"lines", target, path, label (undo label),

    } else if (spec.type === "check") {
      el = h("input", { type: "checkbox" });
      el.checked = !!cur();
      el.addEventListener("change", function () { writeVal(spec, el.checked); });
      syncers.push(function () { el.checked = !!cur(); });
    } else if (spec.type === "num" || spec.type === "int") {
      el = h("input", { type: "number", step: spec.type === "int" ? "1" : (spec.step || "any") });
      if (spec.min !== undefined) { el.setAttribute("min", spec.min); }
      if (spec.max !== undefined) { el.setAttribute("max", spec.max); }
      const show = function () { const v = cur(); el.value = typeof v === "number" ? String(RS.util.round(v, 3)) : ""; };
      show();
      el.addEventListener("change", function () {
        let v = parseFloat(String(el.value).replace(",", "."));
        if (!isFinite(v)) { show(); return; }
        if (spec.type === "int") { v = Math.round(v); }
        if (spec.min !== undefined && v < spec.min) { v = spec.min; }
        if (v !== cur()) { writeVal(spec, v); }
        show();
      });
      syncers.push(function () { if (document.activeElement !== el) { show(); } });
    } else if (spec.type === "lines") {
      el = h("textarea", { rows: spec.rows || 3, spellcheck: "false" });
      const show = function () { const v = cur(); el.value = Array.isArray(v) ? v.join("\n") : ""; };
      show();
      attachText(el, function () { return (cur() || []).join("\n"); }, function (txt) {
        writeVal(spec, txt === "" ? [] : txt.split("\n"));
      });
      syncers.push(function () { if (document.activeElement !== el) { show(); } });
    } else {
      el = spec.type === "textarea" ? h("textarea", { rows: spec.rows || 2, spellcheck: "false" }) : h("input", { type: "text" });
      if (spec.ph) { el.setAttribute("placeholder", spec.ph); }
      if (spec.list) { el.setAttribute("list", spec.list); }
      const show = function () { const v = cur(); el.value = v === undefined || v === null ? "" : String(v); };
      show();
      attachText(el, function () { const v = cur(); return v === undefined || v === null ? "" : String(v); }, function (txt) {
        writeVal(spec, txt);
      });
      syncers.push(function () { if (document.activeElement !== el) { show(); } });
    }
    if (spec.disabled) { el.disabled = true; }
    return el;
  }

  /** Text field commit: on change (blur / Enter) or 600 ms after the last keystroke, as ONE edit per commit. */
  function attachText(el, current, write) {
    let timer = null;
    const commit = function () {
      if (timer !== null) { clearTimeout(timer); timer = null; }
      if (el.value !== current()) { write(el.value); }
    };
    el.addEventListener("input", function () {
      if (timer !== null) { clearTimeout(timer); }
      timer = setTimeout(commit, 600);
    });
    el.addEventListener("change", commit);
    el.addEventListener("blur", commit);
  }

  function row(label, ctl, cls) {
    return h("div", { class: "row" + (cls ? " " + cls : "") }, h("label", { text: label }), ctl);
  }

  function fld(label, spec) { return row(label, control(spec)); }

  /** Point (x, y) editor: two number inputs. */
  function ptControl(target, path, undoLabel) {
    const read = function () { const o = target(doc()); const p = o ? pget(o, path) : null; return Array.isArray(p) ? p : null; };
    const mk = function (i) {
      const el = h("input", { type: "number", step: "any" });
      const show = function () { const p = read(); el.value = p ? String(RS.util.round(p[i], 3)) : ""; };
      show();
      el.addEventListener("change", function () {
        const v = parseFloat(String(el.value).replace(",", "."));
        const p = read();
        if (!isFinite(v) || !p) { show(); return; }
        if (v !== p[i]) {
          edit(function (d) {
            const o = target(d);
            const q = pget(o, path).slice();
            q[i] = v;
            pset(o, path, q);
          }, undoLabel || "Edit point");
        }
        show();
      });
      syncers.push(function () { if (document.activeElement !== el) { show(); } });
      return el;
    };
    return h("span", { class: "pt" }, h("span", { class: "ax", text: "x" }), mk(0), h("span", { class: "ax", text: "y" }), mk(1));
  }

  function ptRow(label, target, path, undoLabel) { return row(label, ptControl(target, path, undoLabel)); }

  /** Editable list of points with add and remove. min = fewest points allowed. */
  function ptsTable(target, path, min, undoLabel) {
    const o = target(doc());
    const list = o ? pget(o, path) : null;
    const wrap = h("div", { class: "ptstable" });
    if (!Array.isArray(list)) { return wrap; }
    const tbl = h("table");
    list.forEach(function (p, i) {
      tbl.appendChild(h("tr", null,
        h("td", { class: "idx", text: String(i + 1) }),
        h("td", null, ptControl(target, path + "." + i, undoLabel)),
        h("td", null, h("button", {
          type: "button", class: "mini", title: "Remove point", text: "x", disabled: list.length <= min,
          on: { click: function () {
            edit(function (d) { const q = target(d); if (q) { pget(q, path).splice(i, 1); } }, "Remove point");
          } }
        }))));
    });
    wrap.appendChild(tbl);
    wrap.appendChild(h("button", {
      type: "button", class: "mini wide", text: "Add point",
      on: { click: function () {
        edit(function (d) {
          const q = target(d);
          if (!q) { return; }
          const l = pget(q, path);
          let np;
          if (l.length >= 2) { const a = l[l.length - 2], b = l[l.length - 1]; np = [b[0] + (b[0] - a[0]), b[1] + (b[1] - a[1])]; }
          else if (l.length === 1) { np = [l[0][0] + 100, l[0][1]]; }
          else { np = [0, 0]; }
          l.push(np);
        }, "Add point");
      } }
    }));
    return wrap;
  }

  /** Call every RS.panelHooks function as fn(container, ctx); a hook that fails never breaks the panel. */
  function runHooks(container, ctx) {
    (Array.isArray(RS.panelHooks) ? RS.panelHooks : []).slice().forEach(function (fn) {
      try { fn(container, ctx); } catch (err) { if (typeof console !== "undefined") { console.warn("Panel hook failed:", err); } }
    });
  }

  function button(text, fn, cls) {
    return h("button", { type: "button", class: cls || "", text: text, on: { click: guard(fn) } });
  }

  function section(key, title, ...kids) {
    const d = h("details", { class: "sect" }, h("summary", { text: title }));
    if (openState[key] !== false) { d.setAttribute("open", ""); }
    d.addEventListener("toggle", function () { openState[key] = d.open; });
    kids.forEach(function (k) { if (k) { d.appendChild(k); } });
    return d;
  }

  // ------------------------------------------------------------------ deleting
  function deleteIds(ids) {
    edit(function (d) {
      const gone = {};
      ids.forEach(function (id) { gone[id] = true; });
      d.sheets.forEach(function (sh) {
        sh.views.forEach(function (v) {
          v.entities = v.entities.filter(function (e) { return !gone[e.id]; });
          // labels that pointed at a deleted bar / dot row go with it
          v.entities = v.entities.filter(function (e) { return !(e.type === "label" && e.ref && gone[e.ref]); });
        });
        sh.items = sh.items.filter(function (e) { return !gone[e.id]; });
      });
    }, ids.length > 1 ? "Delete" : "Delete");
    RS.store.setSel([]);
  }

  // ------------------------------------------------------------------ entity forms
  const TYPE_NAMES = {
    outline: "Concrete outline", line: "Line", bar: "Bar", dots: "Dot row (cut bars)", label: "Label",
    dim: "Dimension", text: "Text", cut: "Section cut", joint: "Construction joint"
  };

  function diaOptions() { return RS.config.diameters.map((d) => [d, String(d)]); }
  function faceOptions() { return RS.config.faces.map((f) => [f, f === "" ? "none" : f]); }

  function entityForm(id) {
    const d = doc();
    const hit = RS.model.find(d, id);
    const frag = h("div", { class: "form" });
    if (!hit) { return frag; }
    const e = hit.entity;
    const tg = T.ent(id);
    const spec = function (type, path, extra) {
      return Object.assign({ type: type, target: tg, path: path, label: "Edit " + (TYPE_NAMES[e.type] || e.type).toLowerCase() }, extra || {});
    };

    frag.appendChild(h("div", { class: "entity-head" },
      h("strong", { text: TYPE_NAMES[e.type] || e.type }),
      h("span", { class: "muted", text: " " + where })));

    switch (e.type) {
      case "outline":
        frag.appendChild(fld("Edges", spec("select", "line", { options: [["visible", "visible"], ["hidden", "hidden (dashed)"]] })));
        frag.appendChild(h("h4", { text: "Points (mm)" }));
        frag.appendChild(ptsTable(tg, "pts", 3, "Edit outline point"));
        (e.holes || []).forEach(function (ring, j) {
          frag.appendChild(h("h4", null, "Hole " + (j + 1) + " ",
            h("button", {
              type: "button", class: "mini", text: "remove",

            })));
          frag.appendChild(ptsTable(tg, "holes." + j, 3, "Edit hole point"));
        });
        frag.appendChild(button("Add hole", function () {
          edit(function (dd) {
            const q = tg(dd);
            const bb = RS.geom.bbox(q.pts);
            const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2, r = Math.min(bb[2] - bb[0], bb[3] - bb[1]) / 6;
            q.holes.push([[cx - r, cy - r], [cx + r, cy - r], [cx + r, cy + r], [cx - r, cy + r]]);
          }, "Add hole");
        }, "mini wide"));
        break;

      case "line":
        frag.appendChild(fld("Pen", spec("select", "pen", { options: Object.keys(RS.config.pens).map((k) => [k, k + " (" + RS.config.pens[k] + " mm)"]) })));
        frag.appendChild(fld("Dash", spec("select", "dash", { options: Object.keys(RS.config.dashes).map((k) => [k, k]) })));
        frag.appendChild(fld("Closed", spec("check", "closed")));
        frag.appendChild(h("h4", { text: "Points" }));
        frag.appendChild(ptsTable(tg, "pts", 2, "Edit line point"));
        break;

      case "bar": {
        const lenLive = h("span", { class: "live" });
        const upd = function () {

          if (!q) { return; }

          try { t = RS.bars.barLength(q) + " mm"; } catch (err) { t = ""; }
          lenLive.textContent = t;
        };
        upd(); syncers.push(upd);
        frag.appendChild(h("div", { class: "livebox" }, h("span", { class: "muted", text: "Text on drawing: " }), liveText(function (dd) {
          const q = tg(dd); return q ? RS.labels.textOf(q, dd.settings) : "";
        })));
        frag.appendChild(fld("Kind", spec("select", "kind", { options: [["straight", "straight"], ["stirrup", "closed stirrup"], ["U", "U-bar"], ["L", "L-bar"], ["free", "free shape"]] })));
        frag.appendChild(fld("Diameter", spec("select", "d", { options: diaOptions(), numeric: true })));
        frag.appendChild(fld("Count n", spec("text", "n", { ph: "e.g. 13 or 3x2" })));
        frag.appendChild(fld("Spacing s", spec("text", "s", { ph: "mm, e.g. 150" })));
        frag.appendChild(fld("Face", spec("select", "face", { options: faceOptions() })));
        const lc = control(spec("text", "L", { ph: "auto, var or mm", list: "rs-l-list" }));
        frag.appendChild(row("Length L", lc));
        frag.appendChild(h("datalist", { id: "rs-l-list" }, h("option", { value: "auto" }), h("option", { value: "var" })));
        frag.appendChild(row("Computed length", lenLive));
        frag.appendChild(fld("Closed", spec("check", "closed")));
        frag.appendChild(fld("Hooks", spec("check", "hooks")));
        frag.appendChild(h("h4", { text: "Centreline points (mm)" }));
        frag.appendChild(ptsTable(tg, "pts", 2, "Edit bar point"));
        break;
      }

      case "dots":
        frag.appendChild(h("div", { class: "livebox" }, h("span", { class: "muted", text: "Text on drawing: " }), liveText(function (dd) {
          const q = tg(dd); return q ? RS.labels.textOf(q, dd.settings) : "";
        })));
        frag.appendChild(fld("Mode", spec("select", "mode", { options: [["count", "count between a and b"], ["spacing", "spacing from a to b"], ["points", "single points"]] })));
        frag.appendChild(fld("Diameter", spec("select", "d", { options: diaOptions(), numeric: true })));
        frag.appendChild(fld("Face", spec("select", "face", { options: faceOptions() })));
        if (e.mode === "count") { frag.appendChild(fld("Count n", spec("int", "n", { min: 1 }))); }
        if (e.mode === "spacing") { frag.appendChild(fld("Spacing s (mm)", spec("num", "s", { min: 1 }))); }
        if (e.mode === "points") {
          frag.appendChild(h("h4", { text: "Points (mm)" }));
          frag.appendChild(ptsTable(tg, "pts", 0, "Edit dot point"));
        } else {
          frag.appendChild(ptRow("Row start a", tg, "a", "Edit dot row"));
          frag.appendChild(ptRow("Row end b", tg, "b", "Edit dot row"));
        }
        break;

      case "label":
        labelForm(frag, id, e, tg, spec, hit);
        break;

      case "dim":
        frag.appendChild(h("div", { class: "livebox" }, h("span", { class: "muted", text: "Measured: " }), liveText(function (dd) {
          const q = tg(dd); return q ? Math.round(Math.hypot(q.b[0] - q.a[0], q.b[1] - q.a[1])) + " mm" : "";
        })));
        frag.appendChild(ptRow("From a", tg, "a", "Edit dimension"));
        frag.appendChild(ptRow("To b", tg, "b", "Edit dimension"));

        frag.appendChild(fld("Text override", spec("text", "text", { ph: "empty = measured length" })));

      case "text":
        frag.appendChild(fld("Text", spec("textarea", "text", { rows: 3 })));

        frag.appendChild(ptRow("To b", tg, "b", "Edit section cut"));

    frag.appendChild(h("div", { class: "actions" }, button("Delete", function () { deleteIds([id]); }, "danger")));
    runHooks(frag, { entity: e, view: hit.view || null, doc: d });
    return frag;
  }

  /** A span whose text is recomputed from the live document by fn(doc). */
  function liveText(fn) {
    const sp = h("span", { class: "live" });
    const upd = function () { let t = ""; try { t = fn(doc()); } catch (err) { t = ""; } sp.textContent = t; };
    upd();
    syncers.push(upd);
    return sp;
  }

  function labelForm(frag, id, e, tg, spec, hit) {
    const view = hit.view;
    frag.appendChild(h("div", { class: "livebox big" }, h("span", { class: "muted", text: "Text on drawing: " }), liveText(function (dd) {
      const q = tg(dd); return q ? RS.labels.text(q, dd) : "";
    })));

    // reference: bars and dot rows of the same view
    const refs = [["", "(free text, no reference)"]];
    (view ? view.entities : []).forEach(function (q) {
      if (q.type === "bar" || q.type === "dots") {
        let t = "";
        try { t = RS.labels.textOf(q, doc().settings); } catch (err) { t = ""; }
        refs.push([q.id, (q.type === "bar" ? "bar " : "dots ") + t]);
      }
    });
    frag.appendChild(fld("Refers to", spec("select", "ref", { options: refs })));
    frag.appendChild(fld("Custom text", spec("text", "text", { ph: "empty = automatic text" })));
    frag.appendChild(fld("Text side", spec("select", "align", { options: [["left", "right of anchor"], ["right", "left of anchor"]] })));
    frag.appendChild(ptRow("Text anchor", tg, "at", "Move label"));

    // leader
    frag.appendChild(row("Leader", h("label", { class: "inline" },
      (function () {
        const c = h("input", { type: "checkbox" });
        c.checked = !!e.tip;
        c.addEventListener("change", function () {
          edit(function (dd) {
            const q = tg(dd);
            if (!q) { return; }
            if (c.checked) { const k = (view ? view.scale : 1) * 10; q.tip = [q.at[0] - k, q.at[1] - k]; }
            else { q.tip = null; q.dist = null; }
          }, c.checked ? "Add leader" : "Remove leader");
        });
        return c;
      })(), " with arrow")));
    if (e.tip) { frag.appendChild(ptRow("Leader tip", tg, "tip", "Move leader tip")); }

    // distribution line
    if (e.dist) {
      frag.appendChild(h("h4", { text: "Distribution line" }));
      frag.appendChild(ptRow("From a", tg, "dist.a", "Edit distribution line"));
      frag.appendChild(ptRow("To b", tg, "dist.b", "Edit distribution line"));
      frag.appendChild(h("div", { class: "actions" }, button("Remove distribution line", function () {
        edit(function (dd) { const q = tg(dd); if (q) { q.dist = null; } }, "Remove distribution line");
      })));
    } else {
      frag.appendChild(h("div", { class: "actions" }, button("Add distribution line", function () {
        edit(function (dd) {
          const q = tg(dd);
          if (!q) { return; }
          const vw = RS.model.find(dd, id).view;
          const s = vw ? vw.scale : 1;
          if (!q.tip) { q.tip = [q.at[0] - 10 * s, q.at[1] - 10 * s]; }
          let ux = q.tip[0] - q.at[0], uy = q.tip[1] - q.at[1];
          const l = Math.hypot(ux, uy) || 1;
          ux /= l; uy /= l;
          const px = -uy * 20 * s, py = ux * 20 * s;          // 40 mm on paper, perpendicular to the leader
          q.dist = { a: [q.tip[0] + px, q.tip[1] + py], b: [q.tip[0] - px, q.tip[1] - py] };
        }, "Add distribution line");
      })));
    }
  }

  // ------------------------------------------------------------------ nothing selected: view, sheet, document
  function viewForm(v) {
    const tg = T.view(v.id);
    const s = function (type, path, extra) { return Object.assign({ type: type, target: tg, path: path, label: "Edit view" }, extra || {}); };
    const titleCtl = control(s("text", "title", { ph: "auto: " + RS.render.viewTitle(v, doc()) }));
    syncers.push(function () {
      const q = tg(doc());
      if (q) { titleCtl.setAttribute("placeholder", "auto: " + RS.render.viewTitle(q, doc())); }
    });
    const sh = RS.model.activeSheet(doc());
    const addBtn = button("Add view", function () {
      edit(function (dd) {
        const sheet = RS.model.activeSheet(dd);
        const names = sheet.views.map((q) => q.name);
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let n = "A-A";
        for (let i = 0; i < letters.length; i++) { const c = letters[i] + "-" + letters[i]; if (names.indexOf(c) < 0) { n = c; break; } }
        const nv = RS.model.newView({
          name: n, kind: "section", x: 150, y: 300,
          scale: RS.toolOpts && RS.toolOpts.scale ? RS.toolOpts.scale : RS.config.defaults.scale
        });

    });
