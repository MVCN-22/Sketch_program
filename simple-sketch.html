<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebar Drawing Studio</title>
<style>
/* styles/app.css: layout and look of Rebar Drawing Studio (light, compact engineering tool; no external fonts or images) */
:root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --line: #d0d4da;
  --line-strong: #aeb4bd;
  --text: #1f2933;
  --muted: #6b7480;
  --accent: #1565c0;
  --accent-bg: #e3effb;
  --danger: #b3261e;
  --canvas-bg: #d5d9de;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.35 var(--font);
  overflow: hidden;
}

#app {
  display: grid;
  height: 100vh;
  grid-template-columns: 150px minmax(0, 1fr) 320px;
  grid-template-rows: 38px 34px minmax(0, 1fr) 24px;
  grid-template-areas:
    "top top top"
    "tools opt panel"
    "tools canvas panel"
    "status status status";
}

.hidden { display: none !important; }

/* ---------------------------------------------------------------- top bar */
#topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 8px;
  background: #1f2d3d;
  color: #fff;
  min-width: 0;
}
#topbar .brand { font-weight: 600; margin-right: 10px; white-space: nowrap; letter-spacing: 0.2px; }
#topbar .sep { width: 1px; height: 18px; background: #4a5a6c; margin: 0 6px; }
#topbar .grow { flex: 1; }
#topbar .sheetname { color: #c8d2dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
button.tb {
  font: inherit;
  color: #fff;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 4px 9px;
  cursor: pointer;
  white-space: nowrap;
}
button.tb:hover:not(:disabled) { background: #33465b; border-color: #4a5a6c; }
button.tb:disabled { opacity: 0.4; cursor: default; }

/* ---------------------------------------------------------------- tool strip */
#tools {
  grid-area: tools;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 6px 6px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
button.tool {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: center;
  gap: 4px;
  font: inherit;
  text-align: left;
  color: var(--text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 4px 6px;
  cursor: pointer;
}
button.tool:hover { background: #eef1f5; }
button.tool.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.tool .ic { text-align: center; font-size: 14px; line-height: 1; }
button.tool .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
kbd {
  font: 11px/1 ui-monospace, Consolas, monospace;
  background: #eceff3;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 4px;
  color: #455060;
}
button.tool.on kbd { background: #fff; border-color: #9fc1e6; color: var(--accent); }

/* ---------------------------------------------------------------- options bar */
#optbar {
  grid-area: opt;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 10px;
  background: #fafbfc;
  border-bottom: 1px solid var(--line);
  min-width: 0;
  overflow: hidden;
}
#optbar .opt { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#optbar .opt span { color: var(--muted); }
#optbar input[type="number"] { width: 64px; }
#optbar .optnote { white-space: nowrap; }

/* ---------------------------------------------------------------- canvas */
#canvas {
  grid-area: canvas;
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--canvas-bg);
}
#canvas svg { display: block; width: 100%; height: 100%; }

/* ---------------------------------------------------------------- right panel */
#panel {
  grid-area: panel;
  background: var(--panel);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 24px;
}
.panel-title {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #f1f3f6;
  border-bottom: 1px solid var(--line);
  padding: 7px 10px;
  font-weight: 600;
}
.muted { color: var(--muted); }
.pad { padding: 0 10px; margin: 8px 0; }
.form { padding: 6px 10px 10px; }
.entity-head { margin: 6px 0 8px; }
.livebox {
  background: #f6f8fa;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 5px 8px;
  margin: 4px 0 8px;
}
.livebox .live { font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
.livebox.big .live { font-size: 15px; }

details.sect { border-bottom: 1px solid var(--line); }
details.sect > summary {
  cursor: pointer;
  padding: 7px 10px;
  font-weight: 600;
  background: #fafbfc;
  user-select: none;
}
details.sect[open] > summary { border-bottom: 1px solid var(--line); }
details.sect > .row, details.sect > .actions, details.sect > label.block, details.sect > textarea, details.sect > .tabs {
  margin-left: 10px;
  margin-right: 10px;
}
details.sect > .tabs { margin-top: 8px; }
details.sect > .row:first-of-type { margin-top: 8px; }
details.sect > :last-child { margin-bottom: 10px; }

.row {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  align-items: center;
  gap: 6px;
  margin: 4px 0;
}
.row > label { color: var(--muted); }
.row > .live { font-family: ui-monospace, Consolas, monospace; }
label.inline { display: flex; align-items: center; gap: 6px; color: var(--text); }
label.block { display: block; margin: 8px 0 3px; color: var(--muted); }
h4 { margin: 10px 0 4px; font-size: 12px; color: #455060; text-transform: none; }

.pt { display: flex; align-items: center; gap: 4px; }
.pt .ax { color: var(--muted); font-size: 11px; }
.pt input { width: 100%; min-width: 0; }

.ptstable table { width: 100%; border-collapse: collapse; }
.ptstable td { padding: 1px 2px; vertical-align: middle; }
.ptstable td.idx { width: 18px; color: var(--muted); font-size: 11px; text-align: right; padding-right: 4px; }
.ptstable td:last-child { width: 26px; }

.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.tabs { display: flex; flex-wrap: wrap; gap: 3px; }
button.tab {
  font: inherit;
  padding: 3px 9px;
  border: 1px solid var(--line-strong);
  background: #f3f5f8;
  border-radius: 4px 4px 0 0;
  cursor: pointer;
}
button.tab.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.tab.add { font-weight: 700; }

/* ---------------------------------------------------------------- form controls */
input[type="text"], input[type="number"], select, textarea {
  font: inherit;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  padding: 3px 5px;
  min-width: 0;
}
input[type="text"], select, textarea { width: 100%; }
textarea { resize: vertical; font-family: inherit; }
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid #8cb7e8;
  outline-offset: 0;
  border-color: var(--accent);
}
input[type="checkbox"] { width: 15px; height: 15px; margin: 0; }
input:disabled, select:disabled { background: #f0f2f4; color: var(--muted); }

button {
  font: inherit;
  color: var(--text);
  background: #f3f5f8;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
}
button:hover:not(:disabled) { background: #e8edf3; }
button:disabled { opacity: 0.5; cursor: default; }
button.danger { color: var(--danger); border-color: #d9a29e; }
button.danger:hover:not(:disabled) { background: #fbeceb; }
button.mini { padding: 0 6px; line-height: 20px; font-size: 12px; }
button.mini.wide { margin-top: 4px; padding: 2px 10px; }

/* ---------------------------------------------------------------- status bar */
#status {
  grid-area: status;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 10px;
  background: #e9ecf0;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: #3b4654;
  white-space: nowrap;
  overflow: hidden;
}
#status .xy { min-width: 150px; font-family: ui-monospace, Consolas, monospace; }
#status .view { min-width: 90px; }
#status .snap { min-width: 90px; color: var(--accent); }
#status .hint { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }

/* ---------------------------------------------------------------- toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%) translateY(10px);
  max-width: min(90vw, 640px);
  background: #1f2d3d;
  color: #fff;
  padding: 8px 16px;
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 50;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------------------------------------------------------- dialog */
dialog#dialog {
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 0;
  width: min(720px, 94vw);
  max-height: 86vh;
  color: var(--text);
  background: #fff;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}
dialog#dialog[open] { display: flex; flex-direction: column; }
dialog#dialog::backdrop { background: rgba(20, 30, 40, 0.45); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #f6f8fa; }
.dlg-head h2 { margin: 0; font-size: 16px; }
.dlg-x { border: none; background: transparent; font-size: 16px; padding: 2px 8px; }
.dlg-body { padding: 10px 16px; overflow-y: auto; flex: 1; }
.dlg-body h3 { margin: 14px 0 6px; font-size: 14px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: #f6f8fa; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
button.card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  text-align: left;
  padding: 10px 12px;
  background: #fff;
  border-color: var(--line-strong);
  border-radius: 6px;
}
button.card:hover { border-color: var(--accent); background: var(--accent-bg); }
button.card span { color: var(--muted); font-size: 12px; }
table.help { width: 100%; border-collapse: collapse; }
table.help td { padding: 3px 6px; border-bottom: 1px solid #eceff3; vertical-align: top; }
table.help td.k { width: 34px; }
table.help td.n { white-space: nowrap; font-weight: 600; width: 110px; }
table.help td.n.wide { width: 40%; white-space: normal; }
ol { padding-left: 20px; margin: 6px 0; }
ol li { margin: 4px 0; }

@media (max-width: 900px) {
  #app { grid-template-columns: 120px minmax(0, 1fr) 260px; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <nav id="tools" aria-label="Tools"></nav>
  <div id="optbar"></div>
  <main id="canvas"></main>
  <aside id="panel" aria-label="Properties"></aside>
  <footer id="status"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<script>
/* --- src/core/namespace.js --- */
/* core/namespace.js: creates the one global object window.RS and the small helper set RS.util */
(function (win) {
  "use strict";

  const RS = win.RS = { version: "1.0.0" };

  /** Functions fn(container, ctx) called at the end of the entity panel (ctx = { entity, view, doc }) and of the view panel (ctx = { view, doc }). */
  RS.panelHooks = RS.panelHooks || [];

  let seq = 0;

  RS.util = {
    /** Unique id string, e.g. uid("e") -> "e1k7f2a". Unique within a session (counter) and across sessions (random part). */
    uid: function (prefix) {
      seq += 1;
      const rnd = Math.random().toString(36).slice(2, 6).padEnd(4, "0");
      return (prefix === undefined || prefix === null ? "" : String(prefix)) + seq.toString(36) + rnd;
    },

    /** Deep copy of plain JSON data. */
    clone: function (obj) {
      return obj === undefined ? undefined : JSON.parse(JSON.stringify(obj));
    },

    /** Round x to n decimals (n = 0 gives an integer). */
    round: function (x, n) {
      const f = Math.pow(10, n === undefined ? 0 : n);
      const r = Math.round(x * f) / f;
      return r === 0 ? 0 : r; // never -0
    },

    clamp: function (x, a, b) {
      return x < a ? a : (x > b ? b : x);
    },

    /** Number as text without trailing zeros, at most 2 decimals: 12 -> "12", 12.5 -> "12.5", 1.256 -> "1.26". */
    fmt: function (x) {
      if (typeof x !== "number" || !isFinite(x)) { return String(x); }
      const r = Math.round(x * 100) / 100;
      return String(r === 0 ? 0 : r);
    },

    /** Escape text for use in XML/SVG. */
    esc: function (str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
    },

    /** Radians to degrees. */
    deg: function (rad) {
      return rad * 180 / Math.PI;
    },

    /** Degrees to radians. */
    rad: function (deg) {
      return deg * Math.PI / 180;
    }
  };
})(window);
</script>
<script>
/* --- src/config/settings.js --- */
/* config/settings.js: all adjustable settings of the program in one place (paper sizes, pen widths, texts, ...) */
/*
  HOW TO EDIT THIS FILE (no programming knowledge needed)
  - Only change the values (numbers and text between "quotes"). Keep the commas, brackets and colons as they are.
  - Lengths on the paper are in millimetres (mm) on the printed sheet. Lengths in the model (concrete, bars)
    are real millimetres.
  - After editing, rebuild the program (python build.py) or reload dev.html in the browser.
*/
(function (RS) {
  "use strict";

  RS.config = {

    // Paper sizes: [width, height] in mm, landscape. Add your own, e.g. B1: [1000, 707].
    papers: { A0: [1189, 841], A1: [841, 594], A2: [594, 420], A3: [420, 297], A4: [297, 210] },

    // Drawing scales offered in the lists. 20 means 1:20 (1 mm on paper = 20 mm in reality).
    scales: [1, 2, 5, 10, 20, 25, 50, 100, 200],

    // Pen widths (line thickness on paper, mm):
    //   thin    = thin helper lines, distribution lines, joint marks
    //   dim     = dimension lines and leaders
    //   text    = text strokes in exported drawings
    //   hidden  = hidden (dashed) concrete edges
    //   outline = visible concrete edges
    //   bar     = reinforcement bars (thick)
    //   heavy   = extra heavy lines, e.g. section cut markers
    //   frame   = border of the drawing frame and title block
    pens: { thin: 0.13, dim: 0.18, text: 0.25, hidden: 0.25, outline: 0.35, bar: 0.6, heavy: 0.7, frame: 0.5 },

    // Line patterns, in paper mm: [dash length, gap length, ...]. null = continuous line.
    //   dashed = long dash, short gap     center = dash, gap, dot, gap
    dashes: { solid: null, dashed: [3, 1.5], center: [6, 1.5, 1, 1.5] },

    // Bar diameters (mm) offered in the lists.
    diameters: [6, 8, 10, 12, 14, 16, 20, 25, 32, 40],

    // Minimum mandrel (bending roller) diameter for a bar of diameter d, in mm.
    // Eurocode 2 (EN 1992-1-1, 8.3): 4*d for bars up to and including 16 mm, 7*d for larger bars.
    // Bar bends in the drawing are drawn with the radius that follows from this value.
    mandrel: function (d) { return d <= 16 ? 4 * d : 7 * d; },

    // Text heights on paper (mm):
    //   label = bar labels such as "16 Y25"          dim = dimension figures
    //   note = notes column                        viewTitle = underlined title below each view
    //   sheetTitle = drawing title in the title block   cut = letter at a section-cut marker
    textHeights: { label: 2.5, dim: 2.5, note: 2.5, viewTitle: 3.5, sheetTitle: 5, cut: 5 },

    // Size of the arrowhead at the end of a label leader, paper mm: length and width.
    arrow: { len: 2.5, wid: 0.9 },

    // Smallest diameter (paper mm) of the dot that shows a cut bar, so thin bars at large scales stay visible.
    dotMin: 0.6,

    // Values used for new documents.
    //   lang      = language of the drawing texts: "da" (Danish) or "en" (English)
    //   prefix    = letter in front of the bar diameter: "Y" gives "Y16"
    //   cover     = concrete cover in mm
    //   kindStyle = "upper" gives BJL / U-BJL / L-BJL, "title" gives Bjl. / U-Bjl. / L-Bjl. (Danish only)
    //   paper     = paper size of a new sheet (must be a key of "papers" above)
    //   scale     = scale of a new view (the N of 1:N)
    defaults: { lang: "da", prefix: "Y", cover: 35, kindStyle: "upper", paper: "A1", scale: 20 },

    // Words printed on the drawing, per language. Change the text between the quotes to taste.
    words: {
      da: {
        stirrup: "BJL", U: "U-BJL", L: "L-BJL",          // bar kinds in labels
        section: "Snit", detail: "Detalje", plan: "Plan", elevation: "Opstalt",   // view titles
        note: "NOTE:", refs: "HENVISNINGER:", symbols: "SIGNATURER:",             // headings of the notes column
        variable: "Var.", length: "L=",                  // used in labels: "L=Var." / "L=12000"
        title: {                                         // captions of the title block fields
          client: "Bygherre", project: "Projekt", title: "Titel", number: "Tegningsnr.", rev: "Rev.",
          scale: "Mål", date: "Dato", drawn: "Tegnet", checked: "Kontrol", approved: "Godk."
        }
      },
      en: {
        stirrup: "Stirrup", U: "U-bar", L: "L-bar",
        section: "Section", detail: "Detail", plan: "Plan", elevation: "Elevation",
        note: "NOTES:", refs: "REFERENCES:", symbols: "LEGEND:",
        variable: "var.", length: "L=",
        title: {
          client: "Client", project: "Project", title: "Title", number: "Drawing no.", rev: "Rev.",
          scale: "Scale", date: "Date", drawn: "Drawn", checked: "Checked", approved: "Approved"
        }
      }
    },

    // Face codes that can be added to a bar label: none, over-, under-, inder-, yder-, bagside (Danish).
    faces: ["", "OS", "US", "IS", "YS", "BS"],

    // Snapping: how close (in screen pixels) the cursor must be to a point or line to snap to it.
    snap: { px: 10 }
  };
})(window.RS);
</script>
<script>
/* --- src/core/geom.js --- */
/* core/geom.js: 2D geometry helpers (vectors, polygons, intersections, offset, fillet paths) */
(function (RS) {
  "use strict";

  const EPS = 1e-9;

  // ---- vectors: points and vectors are [x, y] arrays; no function changes its arguments ----
  function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function mul(a, k) { return [a[0] * k, a[1] * k]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function cross(a, b) { return a[0] * b[1] - a[1] * b[0]; }
  function len(a) { return Math.hypot(a[0], a[1]); }
  function unit(a) {
    const l = Math.hypot(a[0], a[1]);
    return l < EPS ? [0, 0] : [a[0] / l, a[1] / l];
  }
  function perp(a) { return [-a[1], a[0]]; }                    // left normal
  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  function angle(a) { return Math.atan2(a[1], a[0]); }
  function rot(a, rad) {
    const c = Math.cos(rad), s = Math.sin(rad);
    return [a[0] * c - a[1] * s, a[0] * s + a[1] * c];
  }

  // ---- polygons ----
  /** Signed area; positive for counter-clockwise polygons in y-up coordinates. */
  function area(poly) {
    let s = 0;
    for (let i = 0, n = poly.length; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n];
      s += p[0] * q[1] - q[0] * p[1];
    }
    return s / 2;
  }

  function centroid(poly) {
    const n = poly.length;
    if (n === 0) { return [0, 0]; }
    const A = area(poly);
    if (Math.abs(A) < EPS) {                                    // degenerate: average of the points
      let sx = 0, sy = 0;
      poly.forEach(function (p) { sx += p[0]; sy += p[1]; });
      return [sx / n, sy / n];
    }
    let cx = 0, cy = 0;
    for (let i = 0; i < n; i++) {
      const p = poly[i], q = poly[(i + 1) % n];
      const f = p[0] * q[1] - q[0] * p[1];
      cx += (p[0] + q[0]) * f;
      cy += (p[1] + q[1]) * f;
    }
    return [cx / (6 * A), cy / (6 * A)];
  }

  /** Bounding box [x0, y0, x1, y1] of a list of points (null for an empty list). */
  function bbox(pts) {
    if (!pts || !pts.length) { return null; }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (p[0] < x0) { x0 = p[0]; }
      if (p[0] > x1) { x1 = p[0]; }
      if (p[1] < y0) { y0 = p[1]; }
      if (p[1] > y1) { y1 = p[1]; }
    }
    return [x0, y0, x1, y1];
  }

  /** Even-odd ray casting test. */
  function pointInPoly(p, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > p[1]) !== (b[1] > p[1]) &&
          p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) {
        inside = !inside;
      }

    const out = [];
    for (let i = 0; i < n; i++) {

      const turn = cross(unit(sub(p[i], p[(i - 1 + n) % n])), unit(sub(p[(i + 1) % n], p[i])));

  /**
   * Replace corners of a polyline/polygon by tangent arcs of radius r.
   * Returns path items in order: { t: "L", a, b } and { t: "A", c, r, a0, a1, ccw }.
   * Arc angles are in radians and "unwrapped": the sweep is a1 - a0 (positive when ccw, negative when cw).
   * If a leg is too short, the largest radius that fits is used (a corner may use at most half of a leg that is
   * shared with another rounded corner, or the whole leg when its other end is an open end of the polyline).

  function fillet(pts, r, closed) {

      const none = { s: p[i], e: p[i], arc: null };
      if ((!closed && (i === 0 || i === n - 1)) || !(r > EPS)) { corners.push(none); continue; }

      if (theta < 1e-6 || theta > Math.PI - 1e-6) { corners.push(none); continue; }
      const th = Math.tan(theta / 2);
      const prevOtherIsRound = closed || prev !== 0;
      const nextOtherIsRound = closed || i + 1 !== n - 1;
      const availPrev = Ls[prev] * (prevOtherIsRound ? 0.5 : 1);
      const availNext = Ls[i] * (nextOtherIsRound ? 0.5 : 1);
      const t = Math.min(r * th, availPrev, availNext);
      if (t < EPS) { corners.push(none); continue; }
      const rr = t / th;
      const s = sub(p[i], mul(u0, t));
      const e = add(p[i], mul(u1, t));
      const ccw = cr > 0;
      const c = ccw ? add(s, mul(perp(u0), rr)) : sub(s, mul(perp(u0), rr));
      const a0 = angle(sub(s, c));
      const a1 = ccw ? a0 + theta : a0 - theta;
      corners.push({ s: s, e: e, arc: { t: "A", c: c, r: rr, a0: a0, a1: a1, ccw: ccw } });
    }
    const path = [];
    function pushL(a, b) { if (dist(a, b) > EPS) { path.push({ t: "L", a: [a[0], a[1]], b: [b[0], b[1]] }); } }
    let cur;
    if (closed) {
      if (corners[0].arc) { path.push(corners[0].arc); }
      cur = corners[0].e;
    } else {
      cur = p[0];
    }
    for (let i = 1; i < n; i++) {
      pushL(cur, corners[i].s);
      if (corners[i].arc) { path.push(corners[i].arc); }
      cur = corners[i].e;
    }
    if (closed) { pushL(cur, corners[0].s); }
    return path;
  }

  /** Points on the arc of a path item (without the start point), chord error <= tol. */
  function arcSteps(it, tol) {
    const sweep = it.a1 - it.a0;
    let da = it.r > tol ? 2 * Math.acos(Math.max(-1, 1 - tol / it.r)) : Math.PI / 2;
    da = Math.min(Math.max(da, 1e-3), Math.PI / 2);

   * A path that returns to its start (closed path) keeps the repeated last point; give it to a closed poly as is.
   */

        const nSeg = arcSteps(it, tol);

  }

  }

          else { seen[v.id] = true; }
          if (typeof v.name !== "string") { problems.push(vw + ": name must be text"); }
          if (VIEW_KINDS.indexOf(v.kind) < 0) { problems.push(vw + ": invalid kind " + v.kind); }
          if (typeof v.title !== "string") { problems.push(vw + ": title must be text"); }
          if (!isNum(v.scale) || v.scale <= 0) { problems.push(vw + ": scale must be a positive number"); }
          if (!isNum(v.x) || !isNum(v.y)) { problems.push(vw + ": x and y must be numbers"); }
          if (v.link !== undefined && !linkOk(v.link)) { problems.push(vw + ": link must be { source, model, section, imported, keys, removed }"); }
          if (!Array.isArray(v.entities)) { problems.push(vw + ": entities must be a list"); }
          else { v.entities.forEach(function (e, ei) { validateEntity(e, vw + " entity " + (ei + 1), problems, seen, false); }); }
        });
      }
      if (!Array.isArray(sh.items)) { problems.push(sw + ": items must be a list"); }
      else { sh.items.forEach(function (e, ei) { validateEntity(e, sw + " item " + (ei + 1), problems, seen, true); }); }

  // ---------------------------------------------------------------- migration
  function fillFrom(target, defaults) {

      const dv = defaults[k];
      let v = target[k];
      if (v === undefined) { target[k] = U.clone(dv); return; }
      if (typeof dv === "string" && typeof v === "number") { target[k] = String(v); return; }
      if (Array.isArray(dv) && !Array.isArray(v)) { target[k] = U.clone(dv); return; }
      if (typeof dv === "number" && !isNum(v)) { target[k] = dv; return; }
      if (typeof dv === "boolean" && typeof v !== "boolean") { target[k] = dv; return; }

  function migrateSrc(e) {

    const l = v.link;
    if (!isObj(l) || typeof l.section !== "string" || typeof l.source !== "string") { delete v.link; return; }
    if (typeof l.model !== "string") { l.model = ""; }
    if (typeof l.imported !== "string") { l.imported = ""; }
    l.keys = Array.isArray(l.keys) ? l.keys.filter(function (k) { return typeof k === "string"; }) : [];

    migrateSrc(e);
    if (sheetItem && SHEET_ITEM_TYPES.indexOf(e.type) < 0) { return null; }
    const def = DEFAULTS[e.type];
    fillFrom(e, def);
    // point fields must hold valid points, otherwise fall back to the default
    ["a", "b", "at", "dir"].forEach(function (k) {
      if (k in def && !isPt(e[k])) { e[k] = U.clone(def[k]); }
    });
    if (e.type === "label") { ["tip"].forEach(function (k) { if (e[k] !== null && !isPt(e[k])) { e[k] = null; } }); }
    if (e.type === "label" && e.dist !== null && !(isObj(e.dist) && isPt(e.dist.a) && isPt(e.dist.b))) { e.dist = null; }
    if ("pts" in def && !isPtList(e.pts)) { e.pts = U.clone(def.pts); }
    if (e.type === "outline" && !(Array.isArray(e.holes) && e.holes.every(isPtList))) { e.holes = []; }

    const c = cfg();
    const enums = {
      bar: [["kind", BAR_KINDS], ["face", c.faces]],
      dots: [["mode", DOT_MODES], ["face", c.faces]],
      label: [["align", ALIGN2]],
      text: [["align", ALIGN3]]
    };
    (enums[e.type] || []).forEach(function (pair) {
      if (pair[1] && pair[1].indexOf(e[pair[0]]) < 0) { e[pair[0]] = U.clone(def[pair[0]]); }
    });
    if (e.type === "outline" && ["visible", "hidden"].indexOf(e.line) < 0) { e.line = "visible"; }
    if (e.type === "line") {
      if (c.pens && !(e.pen in c.pens)) { e.pen = def.pen; }
      if (c.dashes && !(e.dash in c.dashes)) { e.dash = def.dash; }
    }
    if ((e.type === "bar" || e.type === "dots") && !(e.d > 0)) { e.d = def.d; }
    if (e.type === "text" && !(e.h > 0)) { e.h = def.h; }

  }

  /**
   * Bring a document up to the current format, filling every missing field with its default (changes the document
   * in place and returns it). Entities of unknown type are dropped. Throws an Error for non-documents and newer formats.
   */
  function migrate(doc) {
    if (!isObj(doc)) { throw new Error("This is not a Rebar Drawing Studio document."); }
    if (doc.format !== undefined && isNum(doc.format) && doc.format > 1) {
      throw new Error("This file was made by a newer version of the program (format " + doc.format + ").");
    }
    const base = newDocument();
    if (doc.app === undefined) { doc.app = base.app; }
    doc.format = 1;
    if (!isObj(doc.settings)) { doc.settings = {}; }
    fillFrom(doc.settings, base.settings);
    if (["da", "en"].indexOf(doc.settings.lang) < 0) { doc.settings.lang = base.settings.lang; }
    if (["upper", "title"].indexOf(doc.settings.kindStyle) < 0) { doc.settings.kindStyle = base.settings.kindStyle; }
    if (!Array.isArray(doc.sheets)) { doc.sheets = []; }
    if (doc.sheets.length === 0) { doc.sheets.push(base.sheets[0]); }
    const seen = {};
    const papers = cfg().papers;
    doc.sheets = doc.sheets.filter(isObj);
    if (doc.sheets.length === 0) { doc.sheets.push(base.sheets[0]); }
    doc.sheets.forEach(function (sh, si) {
      const ref = newSheet(sh.paper, "Sheet " + (si + 1));
      if (typeof sh.id !== "string" || !sh.id || seen[sh.id]) { sh.id = ref.id; }
      seen[sh.id] = true;
      if (typeof sh.name !== "string") { sh.name = ref.name; }
      if (typeof sh.paper !== "string" || (papers && !(sh.paper in papers))) { sh.paper = (cfg().defaults && cfg().defaults.paper) || "A1"; }
      if (!isObj(sh.title)) { sh.title = {}; }
      fillFrom(sh.title, ref.title);
      if (!isObj(sh.notes)) { sh.notes = {}; }
      ["note", "refs", "symbols"].forEach(function (f) {
        if (typeof sh.notes[f] === "string") { sh.notes[f] = sh.notes[f].split("\n"); }
        if (!Array.isArray(sh.notes[f])) { sh.notes[f] = f === "note" && sh.notes.note === undefined ? U.clone(ref.notes.note) : []; }
        sh.notes[f] = sh.notes[f].map(String);
      });
      if (!Array.isArray(sh.views)) { sh.views = []; }
      sh.views = sh.views.filter(isObj);
      sh.views.forEach(function (v) {
        const vref = newView({});
        if (typeof v.id !== "string" || !v.id || seen[v.id]) { v.id = vref.id; }
        seen[v.id] = true;
        fillFrom(v, { name: vref.name, kind: vref.kind, title: "", scale: vref.scale, x: vref.x, y: vref.y, entities: [] });
        if (VIEW_KINDS.indexOf(v.kind) < 0) { v.kind = "section"; }
        if (v.scale <= 0) { v.scale = vref.scale; }
        migrateLink(v);
        v.entities = v.entities.map(function (e) { return migrateEntity(e, seen, false); }).filter(Boolean);
      });
      if (!Array.isArray(sh.items)) { sh.items = []; }
      sh.items = sh.items.map(function (e) { return migrateEntity(e, seen, true); }).filter(Boolean);
    });

    return doc;
  }

  RS.model = {
    newDocument: newDocument, newSheet: newSheet, newView: newView, newEntity: newEntity,
    TYPES: TYPES, DEFAULTS: DEFAULTS,
    find: find, activeSheet: activeSheet, viewById: viewById,
    validate: validate, migrate: migrate
  };
})(window.RS);
</script>
<script>
/* --- src/core/store.js --- */
/* core/store.js: the one shared state (document, selection, tool, active view), undo/redo, autosave, file save/open */
(function (RS) {
  "use strict";

  const AUTOSAVE_KEY = "rebar-drawing/doc";
  const UNDO_DEPTH = 200;
  const AUTOSAVE_DELAY = 500;

  let docState = null;          // the live document
  let selIds = [];
  let toolName = "select";
  let viewId = null;
  let undoStack = [];           // JSON snapshots, oldest first
  let redoStack = [];
  let saveTimer = null;
  const listeners = { change: [], select: [], tool: [], view: [] };

  // ---------------------------------------------------------------- events
  function on(event, fn) {
    if (!listeners[event]) { throw new Error("Unknown store event: " + event); }
    listeners[event].push(fn);
    return function off() {
      const i = listeners[event].indexOf(fn);
      if (i >= 0) { listeners[event].splice(i, 1); }
    };
  }

  function emit(event, payload) {
    listeners[event].slice().forEach(function (fn) {
      try { fn(payload); } catch (err) { if (typeof console !== "undefined") { console.error(err); } }
    });
  }

  // ---------------------------------------------------------------- autosave
  function storage() {
    try { return window.localStorage || null; } catch (err) { return null; }
  }

  function writeAutosave() {
    saveTimer = null;
    if (!docState) { return; }
    try {
      const ls = storage();
      if (ls) { ls.setItem(AUTOSAVE_KEY, JSON.stringify(docState)); }
    } catch (err) { /* storage full or blocked: ignore */ }
  }

  function scheduleAutosave() {
    if (saveTimer !== null) { clearTimeout(saveTimer); }
    saveTimer = setTimeout(writeAutosave, AUTOSAVE_DELAY);
  }

  /** Write the autosave right now (normally it is written 500 ms after the last change). */
  function flushAutosave() {
    if (saveTimer !== null) { clearTimeout(saveTimer); }
    writeAutosave();
  }

  /** The autosaved document (migrated) or null when there is none or it cannot be read. */
  function loadAutosave() {
    try {
      const ls = storage();
      if (!ls) { return null; }
      const text = ls.getItem(AUTOSAVE_KEY);
      if (!text) { return null; }
      const d = JSON.parse(text);
      if (!d || d.app !== "rebar-drawing") { return null; }
      return RS.model.migrate(d);
    } catch (err) {
      return null;
    }
  }

  // ---------------------------------------------------------------- state
  function firstViewId() {
    const sh = docState ? RS.model.activeSheet(docState) : null;
    return sh && sh.views.length ? sh.views[0].id : null;
  }

  /** After the document was replaced: drop selected ids that no longer exist and repair the active view. */
  function repairState() {
    const oldSel = selIds.join("|");
    selIds = selIds.filter(function (id) { return !!RS.model.find(docState, id); });
    const selChanged = oldSel !== selIds.join("|");
    const oldView = viewId;
    if (viewId === null || !RS.model.viewById(docState, viewId)) { viewId = firstViewId(); }
    return { sel: selChanged, view: oldView !== viewId };
  }

  function init(doc) {
    docState = RS.model.migrate(doc);
    undoStack = [];
    redoStack = [];
    selIds = [];
    viewId = firstViewId();
    scheduleAutosave();
    emit("change", docState);
    emit("select", selIds.slice());
    emit("view", viewId);
  }

  function doc() { return docState; }

  function sel() { return selIds.slice(); }

  function setSel(ids) {
    if (ids === null || ids === undefined) { ids = []; }
    if (!Array.isArray(ids)) { ids = [ids]; }
    const seen = {};
    selIds = ids.filter(function (id) {
      if (seen[id]) { return false; }
      seen[id] = true;
      return true;
    });
    emit("select", selIds.slice());
  }

  function tool() { return toolName; }

  function setTool(name) {
    toolName = name;
    emit("tool", toolName);
  }

  /** Id of the active view (always a view of the document, or null if the document has no view). */
  function activeView() {
    if (docState && (viewId === null || !RS.model.viewById(docState, viewId))) { viewId = firstViewId(); }
    return viewId;
  }

  /** The active view object (or null). */
  function activeViewObject() {
    const id = activeView();
    return id === null ? null : RS.model.viewById(docState, id);
  }

  function setActiveView(id) {
    viewId = id;
    emit("view", viewId);
  }

  // ---------------------------------------------------------------- editing and undo
  function afterReplace() {
    const changed = repairState();
    scheduleAutosave();
    emit("change", docState);
    if (changed.sel) { emit("select", selIds.slice()); }
    if (changed.view) { emit("view", viewId); }
  }

  /** Change the document: fn(doc) works on the live document; one undo step per call. */
  function edit(fn, label) {
    const snapshot = JSON.stringify(docState);
    undoStack.push(snapshot);
    if (undoStack.length > UNDO_DEPTH) { undoStack.shift(); }
    redoStack = [];
    try {
      fn(docState);
    } catch (err) {
      // the change failed half way: go back to the state before it
      undoStack.pop();
      docState = JSON.parse(snapshot);
      afterReplace();
      throw err;
    }
    afterReplace();
  }

  function canUndo() { return undoStack.length > 0; }
  function canRedo() { return redoStack.length > 0; }

  function undo() {
    if (!undoStack.length) { return false; }
    redoStack.push(JSON.stringify(docState));
    docState = JSON.parse(undoStack.pop());
    afterReplace();
    return true;
  }

  function redo() {
    if (!redoStack.length) { return false; }
    undoStack.push(JSON.stringify(docState));
    docState = JSON.parse(redoStack.pop());
    afterReplace();
    return true;
  }

  // ---------------------------------------------------------------- files
  function safeFileName(text) {
    const s = String(text || "").replace(/[\\\/:*?"<>|\u0000-\u001f]/g, "_").replace(/\s+/g, " ").trim().replace(/^\.+/, "");
    return s || "drawing";
  }

  /** Download the document as "<sheet title or 'drawing'>.rdraw.json". Returns the file name. */
  function saveFile() {
    const sheet = RS.model.activeSheet(docState);
    const name = safeFileName(sheet && sheet.title && sheet.title.title) + ".rdraw.json";
    const blob = new Blob([JSON.stringify(docState, null, 1)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) { a.parentNode.removeChild(a); }
      URL.revokeObjectURL(url);
    }, 1000);
    return name;
  }

  function readText(file) {
    if (file && typeof file.text === "function") { return file.text(); }
    return new Promise(function (resolve, reject) {
      const fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(new Error("The file could not be read.")); };
      fr.readAsText(file);
    });
  }

  /** Read a File: resolves to the migrated document (after init(doc)); rejects with an Error with a plain message. */
  function openFile(file) {
    return readText(file).then(function (text) {
      let parsed;
      try { parsed = JSON.parse(text); }
      catch (err) { throw new Error("This file is not valid JSON, so it cannot be opened."); }
      if (!parsed || typeof parsed !== "object" || parsed.app !== "rebar-drawing") {
        throw new Error("This is not a Rebar Drawing Studio file.");
      }
      const d = RS.model.migrate(parsed);
      const problems = RS.model.validate(d);
      if (problems.length) { throw new Error("The file contains errors: " + problems[0]); }
      init(d);
      return docState;
    });
  }

  RS.store = {
    init: init, doc: doc, sel: sel, setSel: setSel, tool: tool, setTool: setTool,
    activeView: activeView, activeViewObject: activeViewObject, setActiveView: setActiveView,
    edit: edit, undo: undo, redo: redo, canUndo: canUndo, canRedo: canRedo,
    on: on, loadAutosave: loadAutosave, flushAutosave: flushAutosave,
    saveFile: saveFile, openFile: openFile
  };
})(window.RS);
</script>
<script>
/* --- src/core/layout.js --- */
/* core/layout.js: where views sit on the sheet: free spots for new views, "Arrange views" (all boxes are paper mm [x0,y0,x1,y1], y down) */
(function (RS) {
  "use strict";
  const STEP = 5;                                  // scan step (mm)
  const EDGE = 20;                                 // first position: 10 mm sheet border + 10 mm clearance
  const GAP = 10;                                  // clearance to other views and to the title block / notes column
  const ARRANGE_GAP = 15;                          // gap between views in "Arrange views"

  function fin(n) { return typeof n === "number" && isFinite(n); }
  function cfg() { return RS.config; }

  function paperOf(sheet) {
    const c = cfg();
    const pp = (sheet && c.papers[sheet.paper]) || c.papers[c.defaults.paper] || c.papers.A1;
    return [pp[0], pp[1]];
  }

  /** Paper box of a view including its title under it (the title may be wider than the drawing). */
  function footprint(view, doc) {
    const bb = RS.render.viewBBox(view, doc);
    const h = cfg().textHeights.viewTitle;
    const tw = 0.6 * h * String(RS.render.viewTitle(view, doc)).length;
    return [bb[0], bb[1], Math.max(bb[2], bb[0] + tw), bb[3] + 8 + 0.3 * h];
  }

  function hit(a, b, gap) {
    return a[0] < b[2] + gap && a[2] > b[0] - gap && a[1] < b[3] + gap && a[3] > b[1] - gap;
  }

  /** Scan rows from the top left (first row from startX) for the first w x h box that clears every obstacle { box, gap }; null if none. */
  function scan(paper, w, h, obstacles, startX, startY) {
    const xMax = paper[0] - EDGE - w, yMax = paper[1] - EDGE - h;
    for (let y = startY; y <= yMax + 1e-9; y += STEP) {
      for (let x = (y === startY ? startX : EDGE); x <= xMax + 1e-9; x += STEP) {
        const b = [x, y, x + w, y + h];
        let free = true;
        for (let i = 0; i < obstacles.length; i++) {
          if (hit(b, obstacles[i].box, obstacles[i].gap)) { free = false; break; }
        }
        if (free) { return [x, y]; }
      }
    }
    return null;
  }

  function furniture(sheet, doc, gap) {
    return RS.render.furnitureBoxes(sheet, doc).map(function (b) { return { box: b, gap: gap }; });
  }

  function viewsOf(sheet) { return (sheet && Array.isArray(sheet.views) ? sheet.views : []).filter(Boolean); }

  function below(obstacles, gap) {
    let bottom = EDGE - gap;
    obstacles.forEach(function (o) { if (o.box[3] > bottom && !o.furniture) { bottom = o.box[3]; } });
    return bottom + gap;
  }

  /**
   * Top-left paper position [x, y] of a free w x h box (mm): clear of the other views (+10 mm), the sheet border (10 mm),
   * the title block and the notes column. opt.skip = a view id (or list of ids) that is ignored.
   */
  function freeSpot(sheet, w, h, doc, opt) {
    const skip = opt && opt.skip !== undefined ? [].concat(opt.skip) : [];
    w = fin(+w) && +w > 0 ? +w : 0;
    h = fin(+h) && +h > 0 ? +h : 0;
    const views = viewsOf(sheet).filter(function (v) { return skip.indexOf(v.id) < 0; });
    const obs = views.map(function (v) { return { box: footprint(v, doc), gap: GAP }; });
    const spot = scan(paperOf(sheet), w, h, obs.concat(furniture(sheet, doc, GAP)), EDGE, EDGE);
    if (spot) { return spot; }
    return views.length ? [EDGE, below(obs, GAP)] : [EDGE, EDGE];
  }

  /** Move the view (its x, y) so that its box lands at the free spot. Works on the live doc inside RS.store.edit. */
  function placeView(view, sheet, doc) {
    const fp = footprint(view, doc);
    const spot = freeSpot(sheet, fp[2] - fp[0], fp[3] - fp[1], doc, { skip: view.id });
    shift(view, spot[0] - fp[0], spot[1] - fp[1]);
    return [view.x, view.y];
  }

  function shift(view, dx, dy) {
    const x = fin(+view.x) ? +view.x : 0, y = fin(+view.y) ? +view.y : 0;
    view.x = RS.util.round(x + dx, 2);
    view.y = RS.util.round(y + dy, 2);
  }

  /** Place all views of the sheet in their current order, left to right and top to bottom, 15 mm apart, clear of the title block and notes. */
  function arrange(sheet, doc) {
    const paper = paperOf(sheet);
    const fur = furniture(sheet, doc, GAP);
    const placed = [];
    let sx = EDGE, sy = EDGE;
    viewsOf(sheet).forEach(function (v) {
      const fp = footprint(v, doc);
      const w = fp[2] - fp[0], h = fp[3] - fp[1];
      const obs = placed.map(function (b) { return { box: b, gap: ARRANGE_GAP }; });
      const spot = scan(paper, w, h, obs.concat(fur), sx, sy) || [EDGE, below(obs, ARRANGE_GAP)];
      shift(v, spot[0] - fp[0], spot[1] - fp[1]);
      placed.push([spot[0], spot[1], spot[0] + w, spot[1] + h]);
      sx = spot[0] + w + ARRANGE_GAP;                 // the next view starts to the right of this one, in the same row
      sy = spot[1];
    });
  }

  RS.layout = { freeSpot: freeSpot, placeView: placeView, arrange: arrange, footprint: footprint };
})(window.RS);
</script>
<script>
/* --- src/core/merge.js --- */
/* core/merge.js: merge one imported SOFiSTiK section into a view without touching what the engineer made.
   Linked entities carry src = { key, hash, pending?, meta?, edited?, orphan? }; views carry
   link = { source, model, section, imported, keys, removed }. Only the "model fields" of an entity are hashed
   and ever updated; everything else belongs to the engineer. */
(function (RS) {
  "use strict";

  const U = RS.util;

  // the fields the model owns, per entity type
  const FIELDS = {
    outline: ["pts", "holes"],
    dots: ["mode", "pts", "d", "s", "face"],
    bar: ["pts", "closed", "d", "s", "face", "kind"],
    label: ["ref"]
  };
  const LABEL_PREFIX = "label:";
  const NEW_GAP_MM = 15;     // paper mm beside the outline (on the side nearer to the bar)
  const STACK_MM = 6;        // paper mm between stacked labels

  // ---------------------------------------------------------------- hash
  function norm(v) {
    if (typeof v === "number") { const r = Math.round(v * 10) / 10; return r === 0 ? 0 : r; }
    if (typeof v === "string") {
      if (v.trim() !== "" && isFinite(Number(v))) { return norm(Number(v)); }
      return v;
    }
    if (Array.isArray(v)) { return v.map(norm); }
    if (v === undefined) { return null; }
    return v;
  }

  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {

      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return ("00000000" + (h >>> 0).toString(16)).slice(-8);
  }

  /** The model fields of an entity (copies). */
  function modelFields(type, e) {
    const out = {};
    (FIELDS[type] || []).forEach(function (k) { if (e[k] !== undefined) { out[k] = U.clone(e[k]); } });
    return out;
  }

  /** Hash of a model-fields object: FNV-1a of a stable JSON, numbers rounded to 0.1. */
  function hashFields(type, f) {
    const arr = (FIELDS[type] || []).map(function (k) { return norm(f[k]); });
    return fnv1a(JSON.stringify([type, arr]));
  }

  function hashOf(entity) { return hashFields(entity.type, entity); }

  // ---------------------------------------------------------------- incoming item -> entity model fields
  const posNum = function (x) { const n = typeof x === "number" ? x : parseFloat(x); return isFinite(n) && n > 0 ? n : 0; };

  function toFields(item) {
    if (item.type === "outline") {
      return { pts: U.clone(item.pts), holes: U.clone(item.holes || []) };
    }
    const face = typeof item.face === "string" ? item.face : "";
    if (item.type === "dots") {
      return { mode: "points", pts: U.clone(item.pts), d: item.d, s: posNum(item.s), face: face };
    }
    let kind = item.kind;
    if (["straight", "stirrup", "U", "L", "free"].indexOf(kind) < 0) {
      kind = item.closed ? "stirrup" : (item.pts.length > 2 ? "free" : "straight");
    }
    const s = posNum(item.s);
    return { pts: U.clone(item.pts), closed: !!item.closed, d: item.d, s: s ? String(s) : "", face: face, kind: kind };
  }

  // ---------------------------------------------------------------- readable differences
  function fmtDS(f) {
    let t = "";
    if (f.d !== undefined) { t += "Ø" + f.d; }
    const s = posNum(f.s);
    if (s) { t += "/" + s; }
    if (f.face) { t += " " + f.face; }
    return t;
  }

  /** A short text of what differs between two model-field objects of one type. */
  function describe(type, from, to) {
    if (type === "label") { return "label reference changed"; }
    const parts = [];
    if (type !== "outline") {
      const a = fmtDS(from), b = fmtDS(to);
      if (a !== b) { parts.push(a + " → " + b); }
      if (type === "bar" && from.kind !== to.kind) { parts.push("kind " + from.kind + " → " + to.kind); }
    }
    if (JSON.stringify(norm(from.pts)) !== JSON.stringify(norm(to.pts))) {
      const na = (from.pts || []).length, nb = (to.pts || []).length;
      parts.push(na !== nb ? "points " + na + " → " + nb : "points moved");
    }
    if (type === "outline" && JSON.stringify(norm(from.holes)) !== JSON.stringify(norm(to.holes))) { parts.push("holes changed"); }
    if (type === "bar" && from.closed !== to.closed) { parts.push(to.closed ? "now closed" : "now open"); }
    return parts.join("; ") || "values changed";
  }

  /** What the model's pending values look like, for the panel: "Ø20/150 OS, 7 points". */
  function describePending(entity) {
    const p = entity && entity.src && entity.src.pending;
    if (!p) { return ""; }
    if (entity.type === "outline") { return "a new outline"; }
    const bits = [];
    const ds = fmtDS(p);
    if (ds) { bits.push(ds); }
    if (Array.isArray(p.pts)) { bits.push(p.pts.length + (p.pts.length === 1 ? " point" : " points")); }
    return bits.join(", ");
  }

  // ---------------------------------------------------------------- helpers on a view
  function isLabelKey(k) { return typeof k === "string" && k.indexOf(LABEL_PREFIX) === 0; }

  function extend(bb, p) {
    return bb ? [Math.min(bb[0], p[0]), Math.min(bb[1], p[1]), Math.max(bb[2], p[0]), Math.max(bb[3], p[1])] : [p[0], p[1], p[0], p[1]];
  }

  function bboxOfOutlines(view) {
    let bb = null;
    view.entities.forEach(function (e) {
      if (e.type === "outline" && Array.isArray(e.pts)) { e.pts.forEach(function (p) { bb = extend(bb, p); }); }
    });
    return bb;
  }

  function freeLabelY(view, x0, y, gap) {             // a free level in the column of labels at x0 (one column each side)
    const ys = view.entities.filter(function (e) {
      return e.type === "label" && Array.isArray(e.at) && Math.abs(e.at[0] - x0) < 1;
    }).map(function (e) { return e.at[1]; });
    let cand = y, moved = true, guard = 0;
    while (moved && guard++ < 1000) {
      moved = false;
      for (let i = 0; i < ys.length; i++) {
        if (Math.abs(ys[i] - cand) < gap - 1e-6) { cand = ys[i] + gap; moved = true; }
      }
    }
    return cand;
  }

  function unique(list) {
    const seen = {};
    return list.filter(function (k) { if (seen[k]) { return false; } seen[k] = true; return true; });
  }

  // ---------------------------------------------------------------- leaders of the generated labels
  function d2(a, b) { return (a[0] - b[0]) * (a[0] - b[0]) + (a[1] - b[1]) * (a[1] - b[1]); }

  function nearestOnPoly(pts, closed, q) {
    let best = null, bd = Infinity;
    const n = pts.length;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
      let t = L > 0 ? ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / L : 0;
      t = Math.max(0, Math.min(1, t));
      const p = [a[0] + dx * t, a[1] + dy * t], dd = d2(p, q);
      if (dd < bd) { bd = dd; best = p; }
    }
    return best || (n ? [pts[0][0], pts[0][1]] : null);
  }

  /** { tip, dist } the import sets for a label of this item: dots rows get their distribution line, bars the nearest point. */
  function leaderFor(item, f, at) {
    const pts = f.pts || [];
    if (!pts.length) { return { tip: null, dist: null }; }
    const r = function (p) { return [U.round(p[0], 1), U.round(p[1], 1)]; };
    if (item.type === "dots") {
      if (pts.length === 1) { return { tip: r(pts[0]), dist: null }; }
      let far = pts[0];
      pts.forEach(function (p) { if (d2(p, pts[0]) > d2(far, pts[0])) { far = p; } });
      const ux = far[0] - pts[0][0], uy = far[1] - pts[0][1];
      const sorted = pts.slice().sort(function (p, q) { return (p[0] * ux + p[1] * uy) - (q[0] * ux + q[1] * uy); });
      const a = sorted[0], b = sorted[sorted.length - 1];
      return { tip: r([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]), dist: { a: r(a), b: r(b) } };
    }
    return { tip: r(nearestOnPoly(pts, !!f.closed, Array.isArray(at) ? at : pts[0])), dist: null };
  }

  function sameLeader(label, auto) {
    return JSON.stringify(norm(label.tip === undefined ? null : label.tip)) === JSON.stringify(norm(auto.tip === undefined ? null : auto.tip)) &&
      JSON.stringify(norm(label.dist === undefined ? null : label.dist)) === JSON.stringify(norm(auto.dist === undefined ? null : auto.dist));
  }

  function setLeader(lab, ld) {
    lab.tip = ld.tip ? U.clone(ld.tip) : null;
    lab.dist = ld.dist ? U.clone(ld.dist) : null;
    lab.src.auto = { tip: lab.tip ? U.clone(lab.tip) : null, dist: ld.dist ? U.clone(ld.dist) : null };
  }

  /** Re-import: an untouched leader follows the model, one the engineer changed stays. */
  function followLeader(lab, item, f) {
    if (!lab || lab.type !== "label" || !lab.src) { return; }
    const auto = lab.src.auto || ((lab.tip === null || lab.tip === undefined) && !lab.dist ? { tip: null, dist: null } : null);
    if (!auto || !sameLeader(lab, auto)) { return; }
    setLeader(lab, leaderFor(item, f, lab.at));
  }

  // ---------------------------------------------------------------- the merge
  /**
   * Merge one incoming section (as read by RS.exchange.parse) into the view. Changes the view in place (the caller
   * wraps it in RS.store.edit) and returns the report
   * { section, view, added, labels, updated, unchanged, kept: [{key, what}], removed, orphan, skipped }.
   * settings: { model: "<model file name>", now: "<iso time>" } (both optional).
   */
  function importSection(view, section, settings) {
    settings = settings || {};
    const now = settings.now || new Date().toISOString();
    if (!Array.isArray(view.entities)) { view.entities = []; }
    const link = (view.link && typeof view.link === "object") ? view.link : (view.link = {});
    if (link.source === undefined) { link.source = "sofistik"; }
    if (settings.model !== undefined) { link.model = settings.model; }
    if (typeof link.model !== "string") { link.model = ""; }
    link.section = section.key;
    if (!Array.isArray(link.keys)) { link.keys = []; }
    if (!Array.isArray(link.removed)) { link.removed = []; }
    const oldKeys = link.keys.slice();

    const rep = {
      section: section.key, view: view.name, added: 0, labels: 0, updated: 0, unchanged: 0,
      kept: [], removed: 0, orphan: 0, skipped: 0
    };
    const incoming = {};
    // outlines first: the labels of new bars are placed next to the outline
    const items = (section.items || []).slice().sort(function (a, b) {
      return (a.type === "outline" ? 0 : 1) - (b.type === "outline" ? 0 : 1);
    });
    items.forEach(function (it) { incoming[it.key] = true; });

    const byKey = {};
    view.entities.forEach(function (e) { if (e.src && typeof e.src.key === "string") { byKey[e.src.key] = e; } });

    items.forEach(function (item) {
      const f = toFields(item);
      const newHash = hashFields(item.type, f);
      const cur = byKey[item.key];
      if (cur && cur.type === item.type) {
        const curHash = hashOf(cur);
        const src = cur.src;
        delete src.orphan;
        if (item.meta !== undefined) { src.meta = U.clone(item.meta); }
        if (curHash === src.hash) {                            // untouched: follow the model
          if (newHash === curHash) { rep.unchanged++; }
          else {
            Object.keys(f).forEach(function (k) { cur[k] = U.clone(f[k]); });
            rep.updated++;
          }
          src.hash = newHash;
          delete src.pending;
          delete src.edited;
        } else if (newHash === curHash) {                      // the engineer's version equals the model now
          src.hash = newHash;
          delete src.pending;
          delete src.edited;
          rep.unchanged++;
        } else if (newHash === src.hash) {                     // edited, and the model did not change since
          src.edited = true;
          delete src.pending;
          rep.unchanged++;
        } else {                                               // edited and the model changed: keep, remember
          src.edited = true;
          src.pending = f;
          rep.kept.push({ key: item.key, what: describe(item.type, modelFields(cur.type, cur), f) });
        }
        if (item.type !== "outline") { followLeader(byKey[LABEL_PREFIX + item.key], item, f); }
        return;
      }
      if (cur) { return; }                                     // same key, other type: leave it alone
      if (oldKeys.indexOf(item.key) >= 0) {                    // the engineer deleted it
        if (link.removed.indexOf(item.key) < 0) { link.removed.push(item.key); }
        rep.skipped++;
        return;
      }
      if (link.removed.indexOf(item.key) >= 0) { rep.skipped++; return; }
      // new item
      const ent = RS.model.newEntity(item.type, Object.assign({}, f));
      if (item.type === "dots" && f.pts.length) { ent.a = U.clone(f.pts[0]); ent.b = U.clone(f.pts[f.pts.length - 1]); }
      ent.src = { key: item.key, hash: newHash };
      if (item.meta !== undefined) { ent.src.meta = U.clone(item.meta); }
      view.entities.push(ent);
      byKey[item.key] = ent;
      rep.added++;
      if (item.type !== "outline") {
        let bb = bboxOfOutlines(view);
        if (!bb) { items.forEach(function (o) { (o.pts || []).forEach(function (p) { bb = extend(bb, p); }); }); }
        if (!bb) { bb = [0, 0, 0, 0]; }
        const sc = view.scale > 0 ? view.scale : 20;
        // on the side of the section nearer to the bar, level with it, so the leaders stay short and do not cross the section
        let mx = 0, my = 0;
        f.pts.forEach(function (p) { mx += p[0]; my += p[1]; });
        mx = f.pts.length ? mx / f.pts.length : 0; my = f.pts.length ? my / f.pts.length : 0;
        const left = mx < (bb[0] + bb[2]) / 2;
        const x = left ? bb[0] - NEW_GAP_MM * sc : bb[2] + NEW_GAP_MM * sc;
        const y = freeLabelY(view, U.round(x, 1), my, STACK_MM * sc);
        const lab = RS.model.newEntity("label", { ref: ent.id, at: [U.round(x, 1), U.round(y, 1)], tip: null, align: left ? "right" : "left" });
        lab.src = { key: LABEL_PREFIX + item.key, hash: hashFields("label", { ref: ent.id }) };
        setLeader(lab, leaderFor(item, f, lab.at));
        view.entities.push(lab);
        byKey[lab.src.key] = lab;
        rep.labels++;
      }
    });

    // linked entities the model no longer sends
    const dropIds = {};
    view.entities.forEach(function (e) {
      if (!e.src || isLabelKey(e.src.key) || incoming[e.src.key]) { return; }
      if (hashOf(e) === e.src.hash) { dropIds[e.id] = true; rep.removed++; }
      else {
        e.src.orphan = true;
        rep.orphan++;
        rep.kept.push({ key: e.src.key, what: "no longer in the model" });
      }
    });
    view.entities = view.entities.filter(function (e) { return !dropIds[e.id]; });
    // generated labels whose bar is gone
    const ids = {};
    view.entities.forEach(function (e) { ids[e.id] = true; });
    view.entities = view.entities.filter(function (e) {
      return !(e.type === "label" && e.src && isLabelKey(e.src.key) && !ids[e.ref]);
    });

    const present = [];
    view.entities.forEach(function (e) { if (e.src && typeof e.src.key === "string") { present.push(e.src.key); } });
    link.keys = unique(present);
    link.removed = unique(link.removed.filter(function (k) { return incoming[k]; }));
    link.imported = now;
    return rep;
  }

  // ---------------------------------------------------------------- the engineer's choice on a kept item
  /** Apply the model's pending values to the entity ("Take the model's values"). Returns true when something changed. */
  function acceptModel(entity) {
    if (!entity || !entity.src || !entity.src.pending) { return false; }
    const p = entity.src.pending;
    Object.keys(p).forEach(function (k) { entity[k] = U.clone(p[k]); });
    entity.src.hash = hashFields(entity.type, p);
    delete entity.src.pending;
    delete entity.src.edited;
    return true;
  }

  /** "Keep mine": stop flagging the model's pending values. */
  function keepMine(entity) {
    if (!entity || !entity.src || !entity.src.pending) { return false; }
    entity.src.hash = hashFields(entity.type, entity.src.pending);
    delete entity.src.pending;
    delete entity.src.edited;
    return true;
  }

  RS.merge = {
    importSection: importSection, acceptModel: acceptModel, keepMine: keepMine,
    modelFields: modelFields, hashFields: hashFields, hashOf: hashOf, describe: describe, describePending: describePending,
    FIELDS: FIELDS
  };
})(window.RS);
</script>
<script>
/* --- src/rebar/bars.js --- */
/* rebar/bars.js: reinforcement bar geometry (bend paths, hooks, lengths, dot rows, bars derived from outlines) */
(function (RS) {
  "use strict";

  const G = () => RS.geom;
  const num = (v, dflt) => {
    const x = typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));
    return isFinite(x) ? x : dflt;
  };
  const copyPts = (pts) => pts.map((p) => [p[0], p[1]]);

  // Polygon as a CCW copy (input untouched, any orientation accepted).
  function ccwCopy(pts) {
    const c = copyPts(pts);
    return G().area(c) < 0 ? c.reverse() : c;
  }

  // Intersection of two infinite lines (p + t*u) and (q + s*v); null when parallel.
  function lineHit(p, u, q, v) {
    const den = u[0] * v[1] - u[1] * v[0];
    if (Math.abs(den) < 1e-12) return null;
    const t = ((q[0] - p[0]) * v[1] - (q[1] - p[1]) * v[0]) / den;
    return [p[0] + u[0] * t, p[1] + u[1] * t];
  }

  // Offset (inward) geometry of every edge of a closed outline, in the ORIGINAL vertex order.
  // Edge i runs from pts[i] to pts[(i+1) % n]. Returns { n, dir[i], P[i] } where P[i] is a point on the
  // offset line of edge i and dir[i] its unit direction.
  function edgeLines(pts, dist) {
    const g = G();
    const n = pts.length;
    const sgn = g.area(pts) >= 0 ? 1 : -1;      // CCW: inward = left normal; CW: right normal
    const dir = [];
    const P = [];
    for (let i = 0; i < n; i++) {
      const a = pts[i];
      const b = pts[(i + 1) % n];
      const u = g.unit(g.sub(b, a));
      const nrm = g.mul(g.perp(u), sgn);
      dir.push(u);
      P.push(g.add(a, g.mul(nrm, dist)));
    }
    return { n, dir, P };
  }

  // Vertex of the offset polygon at original vertex k (between edge k-1 and edge k).
  function offsetVertex(pts, L, k) {
    const n = L.n;
    const i0 = (k + n - 1) % n;
    const i1 = k % n;
    const hit = lineHit(L.P[i0], L.dir[i0], L.P[i1], L.dir[i1]);
    if (hit) return hit;
    // collinear neighbours: the offset line of edge i1 at its start
    return [L.P[i1][0], L.P[i1][1]];
  }

  const bendRadius = (d) => (RS.config.mandrel(d) + d) / 2;

  const kindOf = (bar) => {
    const k = String((bar && bar.kind) || "straight").trim().toLowerCase();
    if (k === "stirrup" || k === "bjl") return "stirrup";
    if (k === "u" || k === "u-bjl" || k === "u-bar") return "U";
    if (k === "l" || k === "l-bjl" || k === "l-bar") return "L";
    if (k === "free") return "free";
    return "straight";
  };

  function barPath(bar) {
    return G().fillet(bar.pts, bendRadius(num(bar.d, 16)), !!bar.closed);
  }

  const hookLen = (bar) => Math.max(10 * num(bar.d, 16), 70);

  // Closing hooks of a closed stirrup: two short legs at the first vertex, pointing into the section
  // (45 degrees to the two edges meeting there, drawn 15 degrees apart so that both stay visible).
  function hookTicks(bar) {
    if (!bar || !bar.closed || !bar.pts || bar.pts.length < 3) return [];
    const g = G();
    const pts = bar.pts;
    const n = pts.length;
    const p0 = pts[0];
    const uOut = g.unit(g.sub(pts[1], p0));
    const uBack = g.unit(g.sub(pts[n - 1], p0));
    let b = g.add(uOut, uBack);
    if (g.len(b) < 1e-9) b = g.perp(uOut);       // straight angle: take the left normal
    b = g.unit(b);
    const probe = g.add(p0, g.mul(b, 1));
    if (!g.pointInPoly(probe, pts)) b = g.mul(b, -1);   // reflex first vertex: bisector must point inward
    // as on the reference drawings: two short parallel ticks inside the closing corner, along its bisector (the ends of
    // the two hooks), starting at the bend; drawn length max(6d, 60) mm (the bar length counts the full hooks, hookLen)
    const cosT = Math.max(-1, Math.min(1, g.dot(uOut, uBack)));
    const half = Math.acos(cosT) / 2;                                   // half the corner angle
    const r = bendRadius(bar.d);
    const toArc = half > 1e-6 ? r * (1 / Math.sin(half) - 1) : 0;      // vertex to the middle of the bend
    const Ld = Math.max(6 * num(bar.d, 10), 60), off = Math.max(1.0 * num(bar.d, 10), 8);
    const side = g.perp(b);
    return [off, -off].map((o) => {
      const s0 = g.add(g.add(p0, g.mul(b, toArc + Math.abs(o))), g.mul(side, o));
      return [s0, g.add(s0, g.mul(b, Ld))];
    });
  }

  function barLength(bar) {
    const g = G();
    let len = g.pathLength(barPath(bar));
    if (bar.closed && bar.hooks) len += 2 * hookLen(bar);
    return Math.ceil(len / 10 - 1e-9) * 10;
  }

  function dotPositions(dots) {
    const g = G();
    if (dots.mode === "points") return copyPts(dots.pts || []);
    const a = dots.a;
    const b = dots.b;
    if (!a || !b) return [];
    if (dots.mode === "spacing") {
      const s = num(dots.s, 0);
      const L = g.dist(a, b);
      if (!(s > 0)) return [[a[0], a[1]]];
      const k = Math.floor(L / s + 1e-9);
      const out = [];
      for (let i = 0; i <= k; i++) out.push(L === 0 ? [a[0], a[1]] : g.lerp(a, b, (i * s) / L));
      return out;
    }
    const n = Math.max(1, Math.round(num(dots.n, 2)));
    if (n === 1) return [[a[0], a[1]]];
    const out = [];
    for (let i = 0; i < n; i++) out.push(g.lerp(a, b, i / (n - 1)));
    return out;
  }

  function stirrupFromOutline(outlinePts, cover, d) {
    return G().offsetPolyline(ccwCopy(outlinePts), cover + d / 2, true);
  }

  // Edge i = outlinePts[i] -> outlinePts[(i+1) % n]; edgeIdx must be consecutive (wrapping allowed).
  function barAlongEdges(outlinePts, edgeIdx, cover, d, opts) {
    const g = G();
    const ext = num(opts && opts.extend, 0);
    if (!edgeIdx || !edgeIdx.length) return [];
    const pts = outlinePts;
    const n = pts.length;
    const L = edgeLines(pts, cover + d / 2);
    const idx = edgeIdx.map((i) => ((i % n) + n) % n);
    const out = [];
    for (let k = 0; k < idx.length; k++) out.push(offsetVertex(pts, L, idx[k]));
    out.push(offsetVertex(pts, L, idx[idx.length - 1] + 1));
    if (ext) {
      out[0] = g.sub(out[0], g.mul(L.dir[idx[0]], ext));
      const last = out.length - 1;
      out[last] = g.add(out[last], g.mul(L.dir[idx[idx.length - 1]], ext));
    }
    return out;
  }

  // Row of dots inside a stirrup (dia. dLink) along one outline edge: the edge offset inward by
  // cover + dLink + d/2, ends where the offset edge meets the offset neighbouring edges.
  function dotsAlongEdge(outlinePts, edgeIdx, cover, dLink, d, n) {
    const pts = outlinePts;
    const cnt = pts.length;
    const i = (((Array.isArray(edgeIdx) ? edgeIdx[0] : edgeIdx) % cnt) + cnt) % cnt;
    const L = edgeLines(pts, cover + dLink + d / 2);
    return { a: offsetVertex(pts, L, i), b: offsetVertex(pts, L, i + 1) };
  }

  RS.bars = {
    bendRadius, barPath, hookTicks, barLength, dotPositions,
    stirrupFromOutline, barAlongEdges, dotsAlongEdge, kindOf
  };
})(window.RS);
</script>
<script>
/* --- src/rebar/labels.js --- */
/* rebar/labels.js: automatic label text for bars and dot rows ("13 Y25", "U-BJL Y20/150") and its parser */
(function (RS) {
  "use strict";

  const FALLBACK_WORDS = {
    da: { stirrup: "BJL", U: "U-BJL", L: "L-BJL", variable: "Var.", length: "L=" },
    en: { stirrup: "Stirrup", U: "U-bar", L: "L-bar", variable: "var.", length: "L=" }
  };
  const FALLBACK_FACES = ["", "OS", "US", "IS", "YS", "BS"];

  const wordsFor = (lang) => {
    const w = RS.config && RS.config.words;
    return (w && (w[lang] || w.da)) || FALLBACK_WORDS[lang] || FALLBACK_WORDS.da;
  };

  // "U-BJL" -> "U-Bjl." ; "BJL" -> "Bjl." (parts of one letter stay upper case)
  function titleWord(word) {
    return word.split("-").map((p) => (p.length > 1 ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase() : p.toUpperCase())).join("-") + ".";
  }

  function kindWord(kind, settings, words) {
    if (kind !== "stirrup" && kind !== "U" && kind !== "L") return "";
    const w = words[kind];
    if (!w) return "";
    if (settings.lang === "da" && settings.kindStyle === "title") return titleWord(w);
    return w;
  }

  function normSettings(settings) {
    const d = (RS.config && RS.config.defaults) || {};
    const s = settings || {};
    return {
      lang: s.lang || d.lang || "da",
      prefix: s.prefix !== undefined && s.prefix !== "" ? s.prefix : d.prefix || "Y",
      kindStyle: s.kindStyle || d.kindStyle || "upper"

  }

  // Text built directly from a bar or dots entity. Imported dots ("points" mode, with src) with a spacing s > 0 give "Y16/150 OS" (no count).
  function textOf(entity, settings) {
    if (!entity) return "";
    const st = normSettings(settings);
    const words = wordsFor(st.lang);
    const isDots = entity.type === "dots";
    let n = "";
    let s = "";
    let kind = "straight";
    if (isDots) {
      if (entity.mode === "points") {
        // points imported from the SOFiSTiK model (they carry src) with a spacing read as a distributed bar: "Y16/150 OS";
        // points placed by hand count their points ("3 Y20"), whatever spacing the dots tool left in them
        const sp = parseFloat(String(entity.s).replace(",", "."));
        if (entity.src && sp > 0) s = String(entity.s);
        else n = String((entity.pts || []).length);
      }
      else if (entity.mode === "spacing") s = isEmpty(entity.s) ? "" : String(entity.s);
      else n = isEmpty(entity.n) ? "" : String(entity.n);
    } else {
      n = isEmpty(entity.n) ? "" : String(entity.n);
      s = isEmpty(entity.s) ? "" : String(entity.s);
      kind = RS.bars ? RS.bars.kindOf(entity) : entity.kind || "straight";
    }
    let t = "";
    if (n) t += n + " ";
    const kw = kindWord(kind, st, words);
    if (kw) t += kw + " ";
    t += st.prefix + entity.d;
    if (s) t += "/" + s;
    if (!isEmpty(entity.face)) t += " " + entity.face;
    const L = entity.L;
    if (!isEmpty(L)) {
      let lt = "";
      if (L === "auto") lt = RS.bars ? String(RS.bars.barLength(entity)) : "";
      else if (L === "var") lt = words.variable;
      else lt = String(L);
      if (lt) t += ", " + (words.length || "L=") + lt;
    }
    return t;
  }

  function text(label, doc) {
    if (!label) return "";
    if (!isEmpty(label.text)) return label.text;
    if (isEmpty(label.ref)) return "";
    const hit = RS.model && RS.model.find ? RS.model.find(doc, label.ref) : null;
    if (!hit || !hit.entity) return "";
    return textOf(hit.entity, doc && doc.settings);
  }

  // Inverse of textOf. Returns { n, kind, d, s, face, L } or null.
  function parse(str, settings) {
    if (typeof str !== "string") return null;
    const st = normSettings(settings);
    const faces = ((RS.config && RS.config.faces) || FALLBACK_FACES).filter((f) => f);

    // kind words of every language, mapped to kinds
    const map = {};
    const all = (RS.config && RS.config.words) || FALLBACK_WORDS;
    Object.keys(all).forEach((lang) => {
      ["stirrup", "U", "L"].forEach((k) => {
        const w = all[lang][k];
        if (w) map[w.toLowerCase().replace(/\.$/, "")] = k;
      });
    });
    map["bjl"] = "stirrup"; map["u-bjl"] = "U"; map["l-bjl"] = "L";
    const kindAlt = Object.keys(map).sort((a, b) => b.length - a.length).map(rx).join("|");

    const prefixes = [st.prefix, "Ø", "Y"].filter((p, i, a) => p && a.indexOf(p) === i).map(rx).join("|");
    const re = new RegExp(
      "^\\s*(?:(\\d+(?:\\s*[x\\u00d7*]\\s*\\d+)?)\\s*)?" +             // 1 n
      "(?:(" + kindAlt + ")\\.?\\s*)?" +                               // 2 kind word
      "(?:" + prefixes + ")\\s*(\\d+(?:[.,]\\d+)?)" +                  // 3 d
      "(?:\\s*\\/\\s*(\\d+(?:[.,]\\d+)?))?" +                          // 4 s
      "(?:\\s+(" + faces.map(rx).join("|") + ")(?![A-Za-z]))?" +       // 5 face
      "(?:\\s*,\\s*L\\s*=\\s*(.*?))?\\s*$", "i");                      // 6 L
    const m = re.exec(str);
    if (!m) return null;
    const n = m[1] ? m[1].replace(/\s+/g, "").replace(/[×*]/g, "x").toLowerCase() : "";
    const kind = m[2] ? map[m[2].toLowerCase()] : "straight";
    let L = "";
    if (m[6] !== undefined && m[6] !== "") L = /^var\.?$/i.test(m[6].trim()) ? "var" : m[6].trim();
    return {
      n,
      kind,
      d: parseFloat(m[3].replace(",", ".")),
      s: m[4] ? m[4].replace(",", ".") : "",
      face: m[5] ? m[5].toUpperCase() : "",
      L

  }

  RS.labels = { text, textOf, parse };
})(window.RS);

/* --- src/draw/symbols.js --- */
/* draw/symbols.js: small drawing symbols (arrowhead, tick, section-cut marker, joint mark) as display-list primitives, all in paper mm (y down) */
(function (RS) {
  "use strict";

  function fin(x) { return typeof x === "number" && isFinite(x); }

    add: (a, b) => [a[0] + b[0], a[1] + b[1]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
    mul: (a, k) => [a[0] * k, a[1] * k],
    len: (a) => Math.hypot(a[0], a[1]),
    dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]),
    unit: function (a) { const l = Math.hypot(a[0], a[1]); return l > 1e-12 ? [a[0] / l, a[1] / l] : [1, 0]; },
    rot: function (a, rad) {
      const c = Math.cos(rad), s = Math.sin(rad);
      return [a[0] * c - a[1] * s, a[0] * s + a[1] * c];
    },
    lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]
  };

  // ---- primitive constructors ----
  function line(a, b, w, dash, color) {
    return { k: "line", a: [a[0], a[1]], b: [b[0], b[1]], w: w, dash: dash || null, color: color || "#000" };
  }
  function poly(pts, closed, w, dash, color, fill) {
    return { k: "poly", pts: pts.map((p) => [p[0], p[1]]), closed: !!closed, w: w, dash: dash || null, color: color || "#000", fill: fill || null };
  }
  function circle(c, r, w, color, fill) {
    return { k: "circle", c: [c[0], c[1]], r: r, w: w, color: color || "#000", fill: fill || null };
  }
  function text(at, str, h, align, valign, rot, underline, color) {
    return {
      k: "text", at: [at[0], at[1]], text: String(str), h: h, align: align || "left", valign: valign || "base",

  }

  /**
   * Section-cut marker between paper points pa and pb: a heavy piece of `piece` mm at each end, an arrow
   * perpendicular to a->b at each end (on the right of a->b as seen in the model, i.e. y-up; flip reverses) and the
   * name beyond each arrow. opts: { pen, h, piece, arrowLen, arrowWid, stem }.
   */
  function cutMarker(pa, pb, name, flip, opts) {
    const o = opts || {};
    const cfg = RS.config || {};
    const pen = o.pen || (cfg.pens && cfg.pens.heavy) || 0.7;
    const h = o.h || (cfg.textHeights && cfg.textHeights.cut) || 5;
    const piece = o.piece || 8, aLen = o.arrowLen || 4, aWid = o.arrowWid || 1.5, stem = o.stem || 8;
    if (!okp(pa) || !okp(pb)) { return []; }
    const d = V.unit(V.sub(pb, pa));
    // model y-up right normal (dy,-dx) mapped to paper (y down) is (-py, px)
    let n = [-d[1], d[0]];
    if (flip) { n = [-n[0], -n[1]]; }
    const out = [];
    [[pa, d], [pb, V.mul(d, -1)]].forEach(function (e) {
      const p = e[0], inward = e[1];
      out.push(line(p, V.add(p, V.mul(inward, piece)), pen, null, "#000"));
      const tip = V.add(p, V.mul(n, stem + aLen * 0.25));
      out.push(line(p, V.sub(tip, V.mul(n, aLen * 0.8)), pen * 0.6, null, "#000"));
      out.push(arrowhead(tip, n, aLen, aWid));
      out.push(text(V.add(tip, V.mul(n, h * 0.5 + 1.5)), name, h, "center", "middle", 0, false, "#000"));
    });
    return out;
  }

  /**
   * Construction-joint mark "//": two parallel slashes `len` mm long, 1 mm apart (measured along the joint line
   * direction `dir`), at 60 degrees to dir, centred on `at`. pen thin.
   */
  function jointMark(at, dir, len, w) {
    if (!okp(at)) { return []; }
    const d = V.unit(dir);
    let s = V.rot(d, -Math.PI / 3);
    if (s[0] < -1e-9 || (Math.abs(s[0]) <= 1e-9 && s[1] > 0)) { s = [-s[0], -s[1]]; }
    const L = len > 0 ? len : 6;
    const pw = w === undefined ? ((RS.config && RS.config.pens && RS.config.pens.thin) || 0.13) : w;
    return [-0.5, 0.5].map((k) => tick(V.add(at, V.mul(d, k)), s, L, pw));
  }

  RS.symbols = {
    arrowhead, tick, tick45, tickDir45, cutMarker, jointMark,
    vec: V, okp, fin, line, poly, circle, text
  };
})(window.RS);

/* draw/dims.js: dimension (extension lines, dimension line with 45 degree ticks, text) as display-list primitives */
(function (RS) {
  "use strict";
  const S = RS.symbols, V = S.vec;

  /**
   * dim: { a, b, off, text }  (model mm);  T: view transform (RS.render.viewTransform);  cfg: RS.config.
   * Returns primitives in paper mm. No id/vid/role (render adds them).
   */
  function prims(dim, T, cfg) {
    cfg = cfg || RS.config;
    if (!dim || !S.okp(dim.a) || !S.okp(dim.b)) { return []; }
    const pen = cfg.pens.dim, h = cfg.textHeights.dim;
    const pa = T.toPaper(dim.a), pb = T.toPaper(dim.b);
    const chord = V.sub(pb, pa);
    const L = V.len(chord);
    if (!(L > 1e-9)) { return []; }
    const u = V.unit(chord);
    // left of a->b in the model (y up) is (u[1], -u[0]) on paper (y down)
    const nl = [u[1], -u[0]];
    const offModel = S.fin(+dim.off) ? +dim.off : 0;
    const off = offModel / T.s;
    const da = V.add(pa, V.mul(nl, off)), db = V.add(pb, V.mul(nl, off));
    const sg = off < 0 ? -1 : 1;
    const gap = 1, over = 1.5;
    const out = [];

    if (Math.abs(off) > gap + 1e-9) {
      out.push(S.line(V.add(pa, V.mul(nl, sg * gap)), V.add(da, V.mul(nl, sg * over)), pen, null, "#000"));
      out.push(S.line(V.add(pb, V.mul(nl, sg * gap)), V.add(db, V.mul(nl, sg * over)), pen, null, "#000"));
    }
    out.push(S.line(da, db, pen, null, "#000"));
    out.push(S.tick45(da, u, 2, pen));
    out.push(S.tick45(db, u, 2, pen));

    // text: the measured length in model mm unless overridden
    const mlen = Math.hypot(dim.b[0] - dim.a[0], dim.b[1] - dim.a[1]);
    const str = (dim.text !== undefined && dim.text !== null && String(dim.text) !== "") ? String(dim.text) : String(Math.round(mlen));
    // visible angle (ccw on paper), kept readable: never upside down
    let ang = Math.atan2(-u[1], u[0]) * 180 / Math.PI;
    const eps = 1e-6;
    if (ang > 90 + eps) { ang -= 180; } else if (ang <= -90 + eps) { ang += 180; }
    const ar = ang * Math.PI / 180;
    const upn = [-Math.sin(ar), -Math.cos(ar)];            // direction "up" for the rotated text, paper coordinates
    const mid = V.lerp(da, db, 0.5);
    out.push(S.text(V.add(mid, V.mul(upn, 0.8)), str, h, "center", "base", ang, false, "#000"));
    return out;
  }

  RS.dims = { prims };
})(window.RS);
</script>

/* --- src/draw/render.js --- */
/* draw/render.js: turns a document sheet into the display list (line/poly/circle/text primitives in paper mm, y down) */
(function (RS) {
  "use strict";
  const S = RS.symbols, V = S.vec;
  const SEL = "#1565c0", HOV = "#42a5f5", BLACK = "#000";

  // ---------------------------------------------------------------- helpers
  const fin = S.fin, okp = S.okp;
  function goodPts(a) { return Array.isArray(a) ? a.filter(okp) : []; }
  function cfg() { return RS.config; }
  function pen(name, fallback) {
    const v = cfg().pens[name];
    return fin(v) ? v : fallback;
  }
  function dashOf(name) {
    const d = cfg().dashes[name];
    return Array.isArray(d) ? d.slice() : null;
  }
  function estW(str, h) { return 0.6 * h * String(str).length; }

  function viewTransform(view) {
    const sc = view && fin(+view.scale) && +view.scale > 0 ? +view.scale : 1;
    const x = view && fin(+view.x) ? +view.x : 0;
    const y = view && fin(+view.y) ? +view.y : 0;

      s: sc,
      toPaper: (p) => [x + p[0] / sc, y - p[1] / sc],
      toModel: (q) => [(q[0] - x) * sc, (y - q[1]) * sc]
