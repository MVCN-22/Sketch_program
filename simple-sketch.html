  }
  const IDENT = { s: 1, toPaper: (p) => [p[0], p[1]], toModel: (q) => [q[0], q[1]] };

  function wordsOf(doc) {
    const lang = (doc && doc.settings && doc.settings.lang) || cfg().defaults.lang;
    return cfg().words[lang] || cfg().words.da;
  }

  function viewTitle(view, doc) {
    if (!view) { return ""; }
    if (view.title) { return String(view.title); }

      else if (p.k === "circle") { add(p.c[0] - p.r, p.c[1] - p.r); add(p.c[0] + p.r, p.c[1] + p.r); }

  B.label = function (e, T, x) {
    if (!okp(e.at)) { return []; }
    const c = cfg(), h = c.textHeights.label;
    const at = T.toPaper(e.at);
    let txt = "";
    try { txt = RS.labels.text(e, x.doc); } catch (err) { txt = e.text || ""; }
    txt = txt === undefined || txt === null ? "" : String(txt);

    if (e.dist && okp(e.dist.a) && okp(e.dist.b)) { pa = T.toPaper(e.dist.a); pb = T.toPaper(e.dist.b); }

    if (tp) { near = V.dist(sA, tp) <= V.dist(sB, tp) ? sA : sB; far = near === sA ? sB : sA; }

    if (tp && V.dist(near, tp) > 1e-6) {
      const dir = V.unit(V.sub(tp, near));
      let hit = null;
      if (pa && pb) { hit = segHit(near, tp, pa, pb); }

  // intersection of segment a-b with segment c-d -> { p, t (along a-b) } | null (small tolerance)
  function segHit(a, b, c, d) {

  B.text = function (e, T) {

    const h = fin(+e.h) && +e.h > 0 ? +e.h : cfg().textHeights.note;
    const at = T.toPaper(e.at);
    const rot = fin(+e.rot) ? +e.rot : 0;
    const a = rot * Math.PI / 180;
    const down = [Math.sin(a), Math.cos(a)];
    const align = e.align === "center" || e.align === "right" ? e.align : "left";
    return String(e.text).split("\n").map((ln, i) =>
      S.text(V.add(at, V.mul(down, i * h * 1.3)), ln, h, align, "base", rot, !!e.underline, BLACK));
  };

  B.cut = function (e, T) {
    if (!okp(e.a) || !okp(e.b)) { return []; }
    const c = cfg();
    return S.cutMarker(T.toPaper(e.a), T.toPaper(e.b), e.name === undefined ? "" : String(e.name), !!e.flip,
      { pen: c.pens.heavy, h: c.textHeights.cut });
  };

  B.joint = function (e, T) {
    if (!okp(e.at)) { return []; }
    let d = okp(e.dir) && (e.dir[0] !== 0 || e.dir[1] !== 0) ? e.dir : [1, 0];
    const pd = V.unit([d[0], -d[1]]);                         // model y up -> paper y down
    const len = fin(+e.len) && +e.len > 0 ? +e.len / T.s : 6;
    return S.jointMark(T.toPaper(e.at), pd, len, pen("thin", 0.13));
  };

  const LAYER = { outline: "OUTLINE", line: "THIN", bar: "BAR", dots: "DOT", label: "LABEL", dim: "DIM", text: "TEXT", cut: "CUT", joint: "THIN" };
  const RANK = { outline: 0, line: 1, joint: 2, bar: 3, dots: 4, dim: 5, cut: 6, text: 7, label: 8 };

  /** Raw (black, unstamped) primitives of one entity. Never throws. */
  function core(e, view, doc) {
    if (!e || typeof B[e.type] !== "function") { return []; }
    try {
      const T = view ? viewTransform(view) : IDENT;
      const out = B[e.type](e, T, { doc: doc, view: view }) || [];
      return out.filter(validPrim);
    } catch (err) {
      return [];
    }
  }

  // ---------------------------------------------------------------- handles
  function handlePts(e) {
    const hp = [];                                            // [key, index, modelPoint]
    function add(key, idx, p) { if (okp(p)) { hp.push([key, idx, p]); } }
    switch (e.type) {
      case "outline":
        if (Array.isArray(e.pts)) { e.pts.forEach((p, i) => add("pts", i, p)); }
        if (Array.isArray(e.holes)) { e.holes.forEach((r, j) => Array.isArray(r) && r.forEach((p, i) => add("holes." + j, i, p))); }
        break;
      case "line": case "bar":
        if (Array.isArray(e.pts)) { e.pts.forEach((p, i) => add("pts", i, p)); }
        break;
      case "dots":
        if (e.mode === "points") { if (Array.isArray(e.pts)) { e.pts.forEach((p, i) => add("pts", i, p)); } }
        else { add("a", -1, e.a); add("b", -1, e.b); }
        break;
      case "label":
        add("at", -1, e.at); add("tip", -1, e.tip);
        if (e.dist) { add("dist.a", -1, e.dist.a); add("dist.b", -1, e.dist.b); }
        break;
      case "dim": add("a", -1, e.a); add("b", -1, e.b); break;
      case "text": case "joint": add("at", -1, e.at); break;
      case "cut": add("a", -1, e.a); add("b", -1, e.b); break;
      default: break;
    }
    return hp;
  }
  function handlePrims(e, view, T) {
    const out = [];
    const hs = 1;                                             // half size: 2 mm square
    handlePts(e).forEach(function (h) {
      const c = T.toPaper(h[2]);
      const p = S.poly([[c[0] - hs, c[1] - hs], [c[0] + hs, c[1] - hs], [c[0] + hs, c[1] + hs], [c[0] - hs, c[1] + hs]],
        true, 0.18, null, SEL, "#ffffff");
      p.hk = h[0]; p.hi = h[1];
      out.push(p);
    });
    if (e.type === "dim" && okp(e.a) && okp(e.b)) {            // handle on the dimension line (offset)
      const pa = T.toPaper(e.a), pb = T.toPaper(e.b), u = V.unit(V.sub(pb, pa));
      const c = V.add(V.lerp(pa, pb, 0.5), V.mul([u[1], -u[0]], (+e.off || 0) / T.s));
      const p = S.poly([[c[0] - hs, c[1] - hs], [c[0] + hs, c[1] - hs], [c[0] + hs, c[1] + hs], [c[0] - hs, c[1] + hs]],
        true, 0.18, null, SEL, "#ffffff");
      p.hk = "off"; p.hi = -1;
      out.push(p);
    }
    return out;
  }

  // ---------------------------------------------------------------- stamping
  function validPrim(p) {
    if (!p) { return false; }
    switch (p.k) {
      case "line": return okp(p.a) && okp(p.b);
      case "poly": return Array.isArray(p.pts) && p.pts.length >= 2 && p.pts.every(okp);
      case "circle": return okp(p.c) && fin(p.r);
      case "text": return okp(p.at) && fin(p.h) && fin(p.rot);
      default: return false;
    }
  }
  function stamp(prims, e, view, role, color, defLayer) {
    prims.forEach(function (p) {
      if (e && e.id !== undefined) { p.id = e.id; }
      if (view && view.id !== undefined) { p.vid = view.id; }
      p.role = role;
      if (!p.layer) { p.layer = defLayer; }
      p.color = color;
      if (p.fill) { p.fill = color; }
    });

  }
  function colorFor(e, opts) {
    if (opts.forExport) { return BLACK; }
    if (opts.selSet && opts.selSet[e.id]) { return SEL; }
    if (opts.hover !== undefined && opts.hover !== null && opts.hover === e.id) { return HOV; }
    return BLACK;
  }
  function normOpts(opts) {
    const o = Object.assign({}, opts || {});
    o.selSet = {};
    (Array.isArray(o.sel) ? o.sel : []).forEach((id) => { o.selSet[id] = true; });
    return o;
  }
  /** Stamp raw prims of entity e; adds handles when selected (not for export). Returns { prims, handles }. */
  function finish(raw, e, view, opts) {
    const color = colorFor(e, opts);
    const prims = stamp(raw, e, view, "entity", color, LAYER[e.type] || "THIN");
    let handles = [];
    if (!opts.forExport && opts.selSet[e.id]) {

  /** Primitives of one entity (incl. handles when selected). view may be null for paper-space items. */
  function entityPrims(ent, view, doc, opts) {

  function pseudoDoc(view) {

  }
  function entsBBox(view, doc) {
    let bb = null;

  }
  function emptyBox(view) {

  }
  /** Bounding box [x0,y0,x1,y1] in paper mm of the view's entities (incl. label texts); 40 x 30 box when empty. */
  function viewBBox(view, doc) {
    const bb = entsBBox(view, doc || pseudoDoc(view));

  function sheetPrim(p) { p.role = "sheet"; p.layer = "SHEET"; p.color = BLACK; if (p.fill) { p.fill = BLACK; } return p; }

  function wrapLine(str, maxChars) {
    const words = String(str).split(/\s+/);
    const lines = [];
    let cur = "";

      else { cur = cur ? cur + " " + w : w; }

    if (cur !== "" || !lines.length) { lines.push(cur); }
    return lines;
  }

  function titleBlock(sheet, words, x0, y0) {
    const c = cfg(), out = [];
    const tw = words.title || {};
    const vals = sheet.title || {};
    const rows = [
      { h: 12, cells: [["client", 60], ["project", 120]] },
      { h: 22, cells: [["title", 120, true], ["number", 60, true]] },
      { h: 16, cells: [["rev", 20], ["scale", 30], ["date", 40], ["drawn", 30], ["checked", 30], ["approved", 30]] }
    ];
    out.push(rectPoly(x0, y0, x0 + 180, y0 + 50, c.pens.frame));
    let y = y0;
    rows.forEach(function (row, ri) {
      if (ri > 0) { out.push(S.line([x0, y], [x0 + 180, y], c.pens.dim, null, BLACK)); }
      let x = x0;
      row.cells.forEach(function (cell, ci) {
        const key = cell[0], cw = cell[1], big = !!cell[2];
        if (ci > 0) { out.push(S.line([x, y], [x, y + row.h], c.pens.dim, null, BLACK)); }
        out.push(S.text([x + 1.5, y + 1.2], tw[key] !== undefined ? tw[key] : key, 1.8, "left", "top", 0, false, BLACK));
        const val = vals[key] === undefined || vals[key] === null ? "" : String(vals[key]);
        if (val) {

          h = Math.max(1.2, Math.min(h, (cw - 3) / (0.6 * val.length)));
          const by = big ? y + row.h - 5 : y + row.h - 2.5;
          out.push(S.text([x + 2, by], val, h, "left", "base", 0, false, BLACK));

        x += cw;
      });
      y += row.h;
    });
    return out;
  }

  function notesColumn(sheet, words, x0, bottom, topLimit) {
    const c = cfg(), h = c.textHeights.note, step = 4.5;
    const maxChars = Math.floor(176 / (0.6 * h));
    const notes = sheet.notes || {};
    const items = [];                                         // { text, head }
    [["note", words.note], ["refs", words.refs], ["symbols", words.symbols]].forEach(function (sec) {
      const lines = (Array.isArray(notes[sec[0]]) ? notes[sec[0]] : []).filter((l) => l !== undefined && l !== null && String(l) !== "");
      if (!lines.length) { return; }
      if (items.length) { items.push({ text: "", head: false }); }
      items.push({ text: sec[1], head: true });
      lines.forEach((l) => wrapLine(l, maxChars).forEach((w) => items.push({ text: w, head: false })));
    });
    const total = items.length * step;
    let top = bottom - total;
    if (top < topLimit) { top = topLimit; }
    const out = [];
    items.forEach(function (it, i) {
      if (it.text === "") { return; }
      out.push(S.text([x0 + (it.head ? 0 : 2), top + (i + 1) * step - 1.2], it.text, h, "left", "base", 0, it.head, BLACK));
    });
    return out;
  }

  function sheetFurniture(doc, sheet) {
    const c = cfg();
    const pp = c.papers[sheet.paper] || c.papers[c.defaults.paper] || c.papers.A1;
    const W = pp[0], H = pp[1];
    const words = wordsOf(doc);
    const out = [];
    out.push(rectPoly(0, 0, W, H, c.pens.thin));
    out.push(rectPoly(10, 10, W - 10, H - 10, c.pens.frame));
    const tx = W - 10 - 180, ty = H - 10 - 50;
    titleBlock(sheet, words, tx, ty).forEach((p) => out.push(p));
    notesColumn(sheet, words, tx, ty - 6, 14).forEach((p) => out.push(p));
    return out.map(sheetPrim);
  }

  /** Paper boxes [x0,y0,x1,y1] (mm) of the title block and the notes column of a sheet (the notes box only when there are notes). */
  function furnitureBoxes(sheet, doc) {
    const c = cfg();
    if (!sheet) { return []; }
    const pp = c.papers[sheet.paper] || c.papers[c.defaults.paper] || c.papers.A1;
    const tx = pp[0] - 10 - 180, ty = pp[1] - 10 - 50;
    const out = [[tx, ty, tx + 180, ty + 50]];
    const bb = primBBox(notesColumn(sheet, wordsOf(doc), tx, ty - 6, 14));
    if (bb) { out.push([tx, Math.min(bb[1], ty - 6) - 1, tx + 180, ty - 6]); }
    return out;
  }

  // ---------------------------------------------------------------- the sheet
  function sheetPrims(doc, sheetIndex, opts) {
    const o = normOpts(opts);
    const sheet = doc && Array.isArray(doc.sheets) ? doc.sheets[sheetIndex] : null;
    if (!sheet) { return []; }
    const out = sheetFurniture(doc, sheet);
    const handles = [];

    (Array.isArray(sheet.views) ? sheet.views : []).forEach(function (view) {
      if (!view) { return; }
      const ents = (Array.isArray(view.entities) ? view.entities : []).map((e, i) => [e, i])
        .filter((q) => q[0] && q[0].type)
        .sort((a, b) => ((RANK[a[0].type] === undefined ? 5 : RANK[a[0].type]) - (RANK[b[0].type] === undefined ? 5 : RANK[b[0].type])) || (a[1] - b[1]))
        .map((q) => q[0]);
      let bb = null;
      ents.forEach(function (e) {
        const raw = core(e, view, doc);
        bb = mergeBB(bb, primBBox(raw));
        const f = finish(raw, e, view, o);
        f.prims.forEach((p) => out.push(p));
        f.handles.forEach((p) => handles.push(p));
      });
      // view title
      const x0 = bb ? bb[0] : (fin(+view.x) ? +view.x : 0);
      const by = bb ? bb[3] + 8 : (fin(+view.y) ? +view.y : 0) + 10;
      const t = S.text([x0, by], viewTitle(view, doc), cfg().textHeights.viewTitle, "left", "base", 0, true, BLACK);
      if (validPrim(t)) { t.id = undefined; delete t.id; t.vid = view.id; t.role = "viewtitle"; t.layer = "TEXT"; out.push(t); }
      // view frame
      if (o.showViewFrames && !o.forExport && (o.activeView === undefined || o.activeView === null || o.activeView === view.id)) {
        let fb = bb || emptyBox(view);
        if (o.activeView !== undefined && o.activeView !== null) { fb = [fb[0] - 5, fb[1] - 5, fb[2] + 5, fb[3] + 5]; }   // the active view: frame with a 5 mm margin
        const fr = S.poly([[fb[0], fb[1]], [fb[2], fb[1]], [fb[2], fb[3]], [fb[0], fb[3]]], true, cfg().pens.thin, dashOf("dashed"), "#888888", null);
        fr.vid = view.id; fr.role = "frame"; fr.layer = "THIN";
        if (validPrim(fr)) { out.push(fr); }
      }
    });

    // paper-space items
    (Array.isArray(sheet.items) ? sheet.items : []).forEach(function (e) {
      if (!e || (e.type !== "text" && e.type !== "line")) { return; }
      const f = finish(core(e, null, doc), e, null, o);
      f.prims.forEach((p) => out.push(p));
      f.handles.forEach((p) => handles.push(p));
    });

    // draft entity of an active tool
    if (o.draft && o.draft.entity) {
      const dv = (sheet.views || []).filter((v) => v && v.id === o.draft.viewId)[0] || null;
      if (dv || o.draft.viewId === undefined || o.draft.viewId === null) {
        const raw = core(o.draft.entity, dv, doc);
        stamp(raw, o.draft.entity, dv, "draft", SEL, LAYER[o.draft.entity.type] || "THIN");
        raw.forEach((p) => out.push(p));
      }
    }
    return out.concat(handles).filter(validPrim);
  }

  RS.render = { sheetPrims, viewTransform, viewTitle, viewBBox, entityPrims, primBBox, furnitureBoxes };
})(window.RS);

    set(176, [400, 584, 333, 333, 333, 556, 537, 278, 333, 333, 365, 556, 834, 834, 834, 611]);          // 176..191
    set(192, [667, 667, 667, 667, 667, 667, 1000, 722, 667, 667, 667, 667, 278, 278, 278, 278]);         // 192..207
    set(208, [722, 722, 778, 778, 778, 778, 778, 584, 778, 722, 722, 722, 722, 667, 667, 611]);          // 208..223
    set(224, [556, 556, 556, 556, 556, 556, 889, 500, 556, 556, 556, 556, 278, 278, 278, 278]);          // 224..239
    set(240, [556, 556, 556, 556, 556, 556, 556, 584, 611, 556, 556, 556, 556, 500, 556, 500]);          // 240..255
  })();

  // Unicode code point -> WinAnsi (cp1252) byte; unknown -> 63 ("?")
  const CP1252_HIGH = {
    0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87,
    0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91,
    0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98,
    0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F,
    0x2212: 0x2D, 0x00A0: 0xA0
  };

  function winAnsiCode(cp) {
    if (cp >= 32 && cp <= 126) return cp;
    if (cp >= 0xA0 && cp <= 0xFF) return cp;
    if (CP1252_HIGH[cp] !== undefined) return CP1252_HIGH[cp];
    if (cp === 9 || cp === 10 || cp === 13) return 32;
    return 63;
  }

  // JS string -> array of WinAnsi byte values
  function winAnsiBytes(str) {
    const out = [];
    for (const ch of String(str)) out.push(winAnsiCode(ch.codePointAt(0)));
    return out;
  }

  // Helvetica width estimate in mm for text with cap height h (mm)
  function textWidth(text, h) {
    const codes = winAnsiBytes(text === null || text === undefined ? "" : text);
    let sum = 0;
    for (let i = 0; i < codes.length; i++) sum += W[codes[i]];
    return sum / 1000 * (h / CAP);
  }

  // ------------------------------------------------------- text placement
  // Common geometry of a text prim: baseline start/end (paper mm), direction vectors, underline.
  function placeText(p) {
    const h = p.h > 0 ? p.h : 2.5;
    const w = textWidth(p.text, h);
    const r = (p.rot || 0) * Math.PI / 180;
    const c = Math.cos(r), s = Math.sin(r);
    const dir = [c, -s];            // reading direction on paper (y down)
    const down = [s, c];            // towards the bottom of the glyphs on paper
    const af = p.align === "center" ? 0.5 : p.align === "right" ? 1 : 0;
    const vf = p.valign === "middle" ? 0.5 : p.valign === "top" ? 1 : 0;
    const at = p.at || [0, 0];
    const x0 = at[0] + down[0] * h * vf - dir[0] * w * af;
    const y0 = at[1] + down[1] * h * vf - dir[1] * w * af;
    return { h, w, r, dir, down, start: [x0, y0], end: [x0 + dir[0] * w, y0 + dir[1] * w], fs: h / CAP };
  }

  function underlineOf(p, g) {
    const o = 0.15 * g.h;
    return {
      a: [g.start[0] + g.down[0] * o, g.start[1] + g.down[1] * o],
      b: [g.end[0] + g.down[0] * o, g.end[1] + g.down[1] * o],
      w: Math.max(0.08, g.h * 0.07)
    };
  }

  function validPts(pts, min) {
    if (!Array.isArray(pts) || pts.length < min) return false;
    for (let i = 0; i < pts.length; i++) {
      if (!pts[i] || !isFinite(pts[i][0]) || !isFinite(pts[i][1])) return false;
    }
    return true;
  }

  function hasDash(d) { return Array.isArray(d) && d.length > 0 && d.some(v => v > 0); }

  // ------------------------------------------------------------------- SVG
  function toSVG(prims, paper, opts) {
    opts = opts || {};
    const pw = paper[0], ph = paper[1];
    const out = [];
    out.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + num(pw) + 'mm" height="' + num(ph) +
             'mm" viewBox="0 0 ' + num(pw) + ' ' + num(ph) + '">');

    function ids(p) {
      let s = "";
      if (p.id !== undefined && p.id !== null && p.id !== "") s += ' data-id="' + xmlEsc(p.id) + '"';
      if (p.vid !== undefined && p.vid !== null && p.vid !== "") s += ' data-vid="' + xmlEsc(p.vid) + '"';
      if (p.role) s += ' data-role="' + xmlEsc(p.role) + '"';
      return s;
    }
    function stroke(p) {
      const col = p.color || "#000";
      let s = ' stroke="' + xmlEsc(col) + '" stroke-width="' + num(p.w > 0 ? p.w : 0.18) +
              '" stroke-linecap="round" stroke-linejoin="round"';
      if (hasDash(p.dash)) s += ' stroke-dasharray="' + p.dash.map(v => num(v)).join(" ") + '"';
      return s;
    }
    const fillAttr = f => ' fill="' + (f ? xmlEsc(f) : "none") + '"';

    for (const p of prims || []) {
      if (!p) continue;
      if (p.k === "line") {
        if (!validPts([p.a, p.b], 2)) continue;
        out.push('<line x1="' + num(p.a[0]) + '" y1="' + num(p.a[1]) + '" x2="' + num(p.b[0]) + '" y2="' +
                 num(p.b[1]) + '"' + stroke(p) + ' fill="none"' + ids(p) + '/>');
      } else if (p.k === "poly") {
        if (!validPts(p.pts, 2)) continue;
        const pts = p.pts.map(q => num(q[0]) + "," + num(q[1])).join(" ");
        out.push('<' + (p.closed ? "polygon" : "polyline") + ' points="' + pts + '"' + stroke(p) +
                 fillAttr(p.fill) + ids(p) + '/>');
      } else if (p.k === "circle") {
        if (!validPts([p.c], 1) || !isFinite(p.r)) continue;
        out.push('<circle cx="' + num(p.c[0]) + '" cy="' + num(p.c[1]) + '" r="' + num(p.r) + '"' + stroke(p) +
                 fillAttr(p.fill) + ids(p) + '/>');
      } else if (p.k === "text") {
        if (!validPts([p.at], 1) || p.text === undefined || p.text === null || p.text === "") continue;
        const g = placeText(p);
        const x = num(p.at[0]), y = num(p.at[1]);
        const anchor = p.align === "center" ? "middle" : p.align === "right" ? "end" : "start";
        const base = p.valign === "middle" ? "central" : p.valign === "top" ? "hanging" : "alphabetic";
        let s = '<text x="' + x + '" y="' + y + '" font-family="' + FONT_STACK + '" font-size="' + num(g.fs) +
                '" text-anchor="' + anchor + '" dominant-baseline="' + base + '" fill="' +
                xmlEsc(p.color || "#000") + '" stroke="none"';
        if (p.rot) s += ' transform="rotate(' + num(-p.rot) + ' ' + x + ' ' + y + ')"';
        s += ids(p) + '>' + xmlEsc(p.text) + '</text>';
        out.push(s);
        if (p.underline) {
          const u = underlineOf(p, g);
          out.push('<line x1="' + num(u.a[0]) + '" y1="' + num(u.a[1]) + '" x2="' + num(u.b[0]) + '" y2="' +
                   num(u.b[1]) + '" stroke="' + xmlEsc(p.color || "#000") + '" stroke-width="' + num(u.w) +
                   '" stroke-linecap="round" fill="none"/>');
        }
      }
    }
    out.push("</svg>");
    return out.join("\n");
  }

  // ------------------------------------------------------------------- PDF
  function toPDF(prims, paper, meta) {
    meta = meta || {};
    const pw = paper[0], ph = paper[1];
    const X = x => num(x * PT, 3);
    const Y = y => num((ph - y) * PT, 3);
    const rgb = a => a.map(v => num(v, 4)).join(" ");

    const c = [];                              // content stream parts (latin1 chars)
    c.push("1 J 1 j");

    function strokeSetup(p) {
      const col = parseColor(p.color, [0, 0, 0]);
      let s = rgb(col) + " RG " + num((p.w > 0 ? p.w : 0.18) * PT, 3) + " w ";
      s += hasDash(p.dash) ? "[" + p.dash.map(v => num(v * PT, 3)).join(" ") + "] 0 d " : "[] 0 d ";
      return s;
    }
    function fillSetup(p) {
      const f = parseColor(p.fill, null);
      return f ? rgb(f) + " rg " : "";
    }
    function paintOp(p, closed) {
      const hasFill = !!parseColor(p.fill, null);
      const hasStroke = p.w > 0 || !hasFill;
      if (hasFill && hasStroke) return closed ? "b" : "B";
      if (hasFill) return "f";
      return closed ? "s" : "S";
    }

    for (const p of prims || []) {
      if (!p || isSkipped(p)) continue;
      if (p.k === "line") {
        if (!validPts([p.a, p.b], 2)) continue;
        c.push("q " + strokeSetup(p) + X(p.a[0]) + " " + Y(p.a[1]) + " m " + X(p.b[0]) + " " + Y(p.b[1]) + " l S Q");
      } else if (p.k === "poly") {
        if (!validPts(p.pts, 2)) continue;
        let s = "q " + strokeSetup(p) + fillSetup(p);
        p.pts.forEach((q, i) => { s += X(q[0]) + " " + Y(q[1]) + (i ? " l " : " m "); });
        s += paintOp(p, !!p.closed) + " Q";
        c.push(s);
      } else if (p.k === "circle") {
        if (!validPts([p.c], 1) || !isFinite(p.r) || p.r <= 0) continue;
        const k = 0.5522847498 * p.r, cx = p.c[0], cy = p.c[1], r = p.r;
        const P = (x, y) => X(x) + " " + Y(y);
        let s = "q " + strokeSetup(p) + fillSetup(p);
        s += P(cx + r, cy) + " m ";
        s += P(cx + r, cy + k) + " " + P(cx + k, cy + r) + " " + P(cx, cy + r) + " c ";
        s += P(cx - k, cy + r) + " " + P(cx - r, cy + k) + " " + P(cx - r, cy) + " c ";
        s += P(cx - r, cy - k) + " " + P(cx - k, cy - r) + " " + P(cx, cy - r) + " c ";
        s += P(cx + k, cy - r) + " " + P(cx + r, cy - k) + " " + P(cx + r, cy) + " c ";
        s += paintOp(p, true) + " Q";
        c.push(s);
      } else if (p.k === "text") {
        if (!validPts([p.at], 1) || p.text === undefined || p.text === null || p.text === "") continue;
        const g = placeText(p);
        const col = parseColor(p.color, [0, 0, 0]);
        const cs = Math.cos(g.r), sn = Math.sin(g.r);
        const bytes = winAnsiBytes(p.text);
        let str = "";
        for (const b of bytes) {
          const ch = String.fromCharCode(b);
          str += (ch === "(" || ch === ")" || ch === "\\") ? "\\" + ch : ch;
        }
        c.push("q " + rgb(col) + " rg BT /F1 " + num(g.fs * PT, 4) + " Tf " +
               num(cs, 5) + " " + num(sn, 5) + " " + num(-sn, 5) + " " + num(cs, 5) + " " +
               X(g.start[0]) + " " + Y(g.start[1]) + " Tm (" + str + ") Tj ET Q");
        if (p.underline) {
          const u = underlineOf(p, g);
          c.push("q " + rgb(col) + " RG " + num(u.w * PT, 3) + " w 0 J [] 0 d " + X(u.a[0]) + " " + Y(u.a[1]) +
                 " m " + X(u.b[0]) + " " + Y(u.b[1]) + " l S Q");
        }
      }
    }
    const content = c.join("\n") + "\n";

    // objects
    const title = meta.title ? String(meta.title) : "Rebar drawing";
    let titleStr = "";
    for (const b of winAnsiBytes(title)) {
      const ch = String.fromCharCode(b);
      titleStr += (ch === "(" || ch === ")" || ch === "\\") ? "\\" + ch : ch;
    }
    const objs = [];
    objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
    objs[2] = "<< /Type /Pages /Kids [3 0 R] /Count 1 >>";
    objs[3] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + num(pw * PT, 2) + " " + num(ph * PT, 2) +
              "] /Resources << /Font << /F1 5 0 R >> /ProcSet [/PDF /Text] >> /Contents 4 0 R >>";
    objs[4] = "<< /Length " + content.length + " >>\nstream\n" + content + "endstream";
    objs[5] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
    objs[6] = "<< /Title (" + titleStr + ") /Producer (Rebar Drawing Studio) >>";

    let pdf = "%PDF-1.4\n%âãÏÓ\n";
    const offsets = [];
    for (let i = 1; i < objs.length; i++) {
      offsets[i] = pdf.length;
      pdf += i + " 0 obj\n" + objs[i] + "\nendobj\n";
    }
    const xrefPos = pdf.length;
    const pad10 = n => ("0000000000" + n).slice(-10);
    pdf += "xref\n0 " + objs.length + "\n";
    pdf += "0000000000 65535 f \n";
    for (let i = 1; i < objs.length; i++) pdf += pad10(offsets[i]) + " 00000 n \n";
    pdf += "trailer\n<< /Size " + objs.length + " /Root 1 0 R /Info 6 0 R >>\nstartxref\n" + xrefPos + "\n%%EOF\n";

    const bytes = new Uint8Array(pdf.length);
    for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
    return bytes;
  }

  // ------------------------------------------------------------------- DXF
  const LAYER_COLORS = { OUTLINE: 7, BAR: 1, DOT: 1, LABEL: 3, DIM: 4, TEXT: 7, CUT: 5, THIN: 8, SHEET: 7 };
  const KIND_LAYER = { line: "THIN", poly: "THIN", circle: "DOT", text: "TEXT" };

  function layerName(s) {
    return String(s).toUpperCase().replace(/[<>\/\\":;?*|=`,\s]/g, "_") || "0";
  }

  function dxfText(s) {
    return String(s).replace(/[\r\n]+/g, " ")
      .replace(/Ø/g, "%%c").replace(/°/g, "%%d").replace(/±/g, "%%p");
  }

  function toDXF(prims, paper) {
    const pw = paper[0], ph = paper[1];
    const used = {};
    const ents = [];
    const g = (code, val) => ents.push(String(code), String(val));
    const d4 = v => num(v, 4);
    const Y = y => ph - y;

    function layerOf(p) {
      let l = p.layer;
      if (!l && (p.role === "sheet" || p.role === "frame")) l = "SHEET";
      l = layerName(l || KIND_LAYER[p.k] || "THIN");
      used[l] = true;
      return l;
    }
    function head(type, p, l) {
      g(0, type);
      g(8, l);
      if (hasDash(p.dash)) g(6, "DASHED");
    }

    for (const p of prims || []) {
      if (!p || isSkipped(p)) continue;
      if (p.k === "line") {
        if (!validPts([p.a, p.b], 2)) continue;
        const l = layerOf(p);
        head("LINE", p, l);
        g(10, d4(p.a[0])); g(20, d4(Y(p.a[1]))); g(30, 0);
        g(11, d4(p.b[0])); g(21, d4(Y(p.b[1]))); g(31, 0);
      } else if (p.k === "poly") {
        if (!validPts(p.pts, 2)) continue;
        const l = layerOf(p);
        const pts = p.pts;
        if (p.fill && !isWhite(p.fill) && pts.length >= 3 && pts.length <= 4) {
          // SOLID: corner order is 1,2,4,3
          const o = pts.length === 3 ? [0, 1, 2, 2] : [0, 1, 3, 2];
          g(0, "SOLID"); g(8, l);
          o.forEach((idx, i) => {
            g(10 + i, d4(pts[idx][0])); g(20 + i, d4(Y(pts[idx][1]))); g(30 + i, 0);
          });
        } else {
          head("POLYLINE", p, l);
          g(66, 1); g(10, 0); g(20, 0); g(30, 0); g(70, p.closed ? 1 : 0);
          for (const q of pts) {
            g(0, "VERTEX"); g(8, l);
            g(10, d4(q[0])); g(20, d4(Y(q[1]))); g(30, 0);
          }
          g(0, "SEQEND"); g(8, l);
        }
      } else if (p.k === "circle") {
        if (!validPts([p.c], 1) || !isFinite(p.r) || p.r <= 0) continue;
        const l = layerOf(p);
        head("CIRCLE", p, l);
        g(10, d4(p.c[0])); g(20, d4(Y(p.c[1]))); g(30, 0); g(40, d4(p.r));
      } else if (p.k === "text") {
        if (!validPts([p.at], 1) || p.text === undefined || p.text === null || p.text === "") continue;
        const l = layerOf(p);
        const h = p.h > 0 ? p.h : 2.5;
        const ha = p.align === "center" ? 1 : p.align === "right" ? 2 : 0;
        const va = p.valign === "middle" ? 2 : p.valign === "top" ? 3 : 0;
        const x = d4(p.at[0]), y = d4(Y(p.at[1]));
        g(0, "TEXT"); g(8, l);
        g(10, x); g(20, y); g(30, 0);
        g(40, d4(h));
        g(1, (p.underline ? "%%u" : "") + dxfText(p.text));
        if (p.rot) g(50, d4(((p.rot % 360) + 360) % 360));
        g(7, "STANDARD");
        if (ha || va) {
          g(72, ha);
          g(11, x); g(21, y); g(31, 0);
          g(73, va);
        }
      }
    }

    const layers = Object.keys(used);
    if (layers.indexOf("0") < 0) layers.unshift("0");
    const out = [];
    const o = (code, val) => out.push(String(code), String(val));
    // HEADER
    o(0, "SECTION"); o(2, "HEADER");
    o(9, "$ACADVER"); o(1, "AC1009");
    o(9, "$INSUNITS"); o(70, 4);
    o(9, "$DWGCODEPAGE"); o(3, "ANSI_1252");
    o(9, "$EXTMIN"); o(10, 0); o(20, 0); o(30, 0);
    o(9, "$EXTMAX"); o(10, d4(pw)); o(20, d4(ph)); o(30, 0);
    o(0, "ENDSEC");
    // TABLES
    o(0, "SECTION"); o(2, "TABLES");
    o(0, "TABLE"); o(2, "LTYPE"); o(70, 2);
    o(0, "LTYPE"); o(2, "CONTINUOUS"); o(70, 0); o(3, "Solid line"); o(72, 65); o(73, 0); o(40, "0.0");
    o(0, "LTYPE"); o(2, "DASHED"); o(70, 0); o(3, "Dashed"); o(72, 65); o(73, 2); o(40, "4.5"); o(49, "3.0"); o(49, "-1.5");
    o(0, "ENDTAB");
    o(0, "TABLE"); o(2, "LAYER"); o(70, layers.length);
    for (const l of layers) {
      o(0, "LAYER"); o(2, l); o(70, 0); o(62, LAYER_COLORS[l] || 7); o(6, "CONTINUOUS");
    }
    o(0, "ENDTAB");
    o(0, "TABLE"); o(2, "STYLE"); o(70, 1);
    o(0, "STYLE"); o(2, "STANDARD"); o(70, 0); o(40, "0.0"); o(41, "1.0"); o(50, "0.0"); o(71, 0); o(42, "2.5");
    o(3, "txt"); o(4, "");
    o(0, "ENDTAB");
    o(0, "ENDSEC");
    // ENTITIES
    o(0, "SECTION"); o(2, "ENTITIES");
    for (let i = 0; i < ents.length; i += 2) out.push(ents[i], ents[i + 1]);
    o(0, "ENDSEC");
    out.push("0", "EOF");
    return out.join("\r\n") + "\r\n";
  }

  // ------------------------------------------------------ download / print
  // DXF text goes out as Windows-1252 bytes (matches $DWGCODEPAGE ANSI_1252), everything else as given.
  function download(name, data, mime) {
    let part = data;
    if (typeof data === "string" && /\.dxf$/i.test(name)) part = Uint8Array.from(winAnsiBytes(data));
    const blob = new Blob([part], { type: mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 10000);
  }

  function printSVG(svgString, paper) {
    const w = paper[0], h = paper[1];
    const html = "<!doctype html><html><head><meta charset=\"utf-8\"><title>Print</title><style>" +
      "@page { size: " + num(w) + "mm " + num(h) + "mm; margin: 0 }" +
      "html, body { margin: 0; padding: 0; background: #fff }" +
      "svg { display: block; width: " + num(w) + "mm; height: " + num(h) + "mm }" +
      "</style></head><body>" + svgString + "</body></html>";
    let done = false;
    const go = function (win) {
      if (done) return;
      done = true;
      try { win.focus(); win.print(); } catch (e) { /* ignore */ }
    };
    const win = window.open("", "_blank");
    if (win && win.document) {
      win.document.open();
      win.document.write(html);
      win.document.close();
      win.addEventListener("load", function () { setTimeout(function () { go(win); }, 50); });
      setTimeout(function () { if (win.document.readyState === "complete") go(win); }, 500);
      return;
    }
    // popup blocked: print through a hidden iframe
    const f = document.createElement("iframe");
    f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(f);
    f.contentDocument.open();
    f.contentDocument.write(html);
    f.contentDocument.close();
    setTimeout(function () {
      go(f.contentWindow);
      setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 60000);
    }, 300);
  }

  RS.io = { toSVG, toPDF, toDXF, download, printSVG, textWidth };
})(window.RS);
</script>
<script>
/* --- src/io/exchange.js --- */
/* io/exchange.js: reads the sections file made by the SOFiSTiK model program ("<model>.rsec.json", format rebar-sections/1) */
(function (RS) {
  "use strict";

  const FORMAT = "rebar-sections/1";
  const isNum = (x) => typeof x === "number" && isFinite(x);
  const isPt = (p) => Array.isArray(p) && p.length >= 2 && isNum(p[0]) && isNum(p[1]);
  const isObj = (o) => o !== null && typeof o === "object" && !Array.isArray(o);

  function cleanPts(list, where, min) {
    if (!Array.isArray(list) || list.length < min || !list.every(isPt)) {
      throw new Error("The sections file is damaged: " + where + " has no valid points.");
    }
    return list.map((p) => [p[0], p[1]]);
  }

  function cleanItem(it, secName) {
    const where = "item " + (isObj(it) && it.key ? it.key : "?") + " in section " + secName;
    if (!isObj(it) || typeof it.key !== "string" || !it.key) { throw new Error("The sections file is damaged: an item in section " + secName + " has no key."); }
    if (["outline", "dots", "bar"].indexOf(it.type) < 0) { return null; }      // unknown item types are ignored
    const out = { key: it.key, type: it.type };
    if (it.type === "outline") {
      out.pts = cleanPts(it.pts, where, 3);
      out.holes = Array.isArray(it.holes) ? it.holes.map((h) => cleanPts(h, where + " (hole)", 3)) : [];
      return out;
    }
    out.pts = cleanPts(it.pts, where, it.type === "bar" ? 2 : 0);
    if (!isNum(it.d) || it.d <= 0) { throw new Error("The sections file is damaged: " + where + " has no valid diameter d."); }
    out.d = it.d;
    out.s = isNum(it.s) && it.s > 0 ? it.s : 0;
    const faces = (RS.config && RS.config.faces) || ["", "OS", "US", "IS", "YS", "BS"];
    out.face = typeof it.face === "string" && faces.indexOf(it.face) >= 0 ? it.face : "";
    if (it.type === "bar") {
      out.closed = !!it.closed;
      if (typeof it.kind === "string") { out.kind = it.kind; }
    }
    if (isObj(it.meta)) { out.meta = JSON.parse(JSON.stringify(it.meta)); }
    return out;
  }

  /** Read the text of a .rsec.json file. Returns { format, source, sections }; throws an Error with a plain message. */
  function parse(text) {
    let data;
    try { data = JSON.parse(String(text).replace(/^﻿/, "")); }
    catch (err) { throw new Error("This file is not valid JSON, so it cannot be a sections file."); }
    if (!isObj(data)) { throw new Error("This is not a sections file from the SOFiSTiK model program."); }
    if (data.app === "rebar-drawing") {
      throw new Error("This is a drawing file, not a sections file. Use Open... for drawings; Import from SOFiSTiK... needs a .rsec.json file.");
    }
    if (typeof data.format !== "string" || data.format.indexOf("rebar-sections/") !== 0) {
      throw new Error("This is not a sections file from the SOFiSTiK model program (the format mark \"rebar-sections/1\" is missing).");
    }
    if (data.format !== FORMAT) {
      throw new Error("This sections file has format \"" + data.format + "\"; this program reads \"" + FORMAT + "\". Update one of the two programs.");
    }
    if (!Array.isArray(data.sections)) { throw new Error("The sections file is damaged: it has no list of sections."); }
    const src = isObj(data.source) ? data.source : {};
    const seen = {};
    const sections = data.sections.map(function (sec, i) {
      if (!isObj(sec) || typeof sec.key !== "string" || !sec.key) { throw new Error("The sections file is damaged: section " + (i + 1) + " has no key."); }
      if (seen[sec.key]) { throw new Error("The sections file is damaged: section key " + sec.key + " is used twice."); }
      seen[sec.key] = true;
      const name = typeof sec.name === "string" && sec.name ? sec.name : String(i + 1);
      const items = (Array.isArray(sec.items) ? sec.items : []).map(function (it) { return cleanItem(it, name); }).filter(Boolean);
      const keys = {};
      items.forEach(function (it) {
        if (keys[it.key]) { throw new Error("The sections file is damaged: item key " + it.key + " is used twice in section " + name + "."); }
        keys[it.key] = true;
      });
      return {
        key: sec.key, name: name, kind: sec.kind === "plan" ? "plan" : "section",
        scale: isNum(sec.scale) && sec.scale > 0 ? sec.scale : 20,
        items: items
      };
    });
    return {
      format: data.format,
      source: {
        program: typeof src.program === "string" ? src.program : "",
        model: typeof src.model === "string" ? src.model : "",
        project: typeof src.project === "string" ? src.project : "",
        exported: typeof src.exported === "string" ? src.exported : "",
        anchorage: !!src.anchorage
      },
      sections: sections
    };
  }

  /** "A-A" for a section named "A". */
  function sectionTitle(sec) {
    const n = sec && sec.name !== undefined ? String(sec.name) : "";
    return n + "-" + n;
  }

  RS.exchange = { FORMAT: FORMAT, parse: parse, sectionTitle: sectionTitle };
})(window.RS);
</script>
<script>
/* --- src/ui/templates.js --- */
/* ui/templates.js: the starting drawings offered by "New..." (blank, beam, slab edge, wall on footing, corner section) */
(function (RS) {
  "use strict";

  const M = () => RS.model;
  const B = () => RS.bars;

  // ------------------------------------------------------------------ helpers
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
  function mul(a, k) { return [a[0] * k, a[1] * k]; }
  function unit(a) { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; }
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

  /** New one-sheet document with placeholder title block and notes. */
  function baseDoc(viewProps, titleText, scaleText) {
    const doc = M().newDocument();
    const sheet = doc.sheets[0];
    sheet.title = {
      client: "Client", project: "Project", title: titleText || "Drawing title", number: "000", rev: "0",
      scale: scaleText || "1:" + (viewProps && viewProps.scale ? viewProps.scale : 20),
      date: "YYYY-MM-DD", drawn: "XX", checked: "XX", approved: "XX"
    };
    sheet.notes = {
      note: ["Unævnte mål er i mm."],
      refs: ["Generalnote for beton, se tegning nr. ..."],
      symbols: []
    };
    const view = sheet.views[0];
    Object.keys(viewProps || {}).forEach((k) => { view[k] = viewProps[k]; });
    return { doc, sheet, view };
  }

  function put(view, type, props) {
    const e = M().newEntity(type, props);
    view.entities.push(e);
    return e;
  }

  function outline(view, pts) { return put(view, "outline", { pts }); }

  function rect(x0, y0, x1, y1) { return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]; }

  /** Closed stirrup around a rectangle (or any outline) at the given cover. */
  function stirrup(view, pts, cover, d, s, hooks) {
    const p = B().stirrupFromOutline(pts, cover, d);        // counter-clockwise, first point bottom-left
    const first = p.length - 1;                              // start at the last point (top-left): hooks sit at the top
    const rotated = p.slice(first).concat(p.slice(0, first));
    return put(view, "bar", { pts: rotated, closed: true, d, kind: "stirrup", s: String(s), hooks: hooks !== false });
  }

  function maxX(pts) { return Math.max.apply(null, pts.map((q) => q[0])); }

  /** Straight / U / L bar along the given outline edges. */
  function edgeBar(view, outlinePts, edges, cover, d, props, opts) {
    return put(view, "bar", Object.assign({
      pts: B().barAlongEdges(outlinePts, edges, cover, d, opts || {}), d, kind: "straight"
    }, props || {}));
  }

  /** Row of cut bars (dots) along an outline edge, inside a link of diameter dLink. */
  function edgeDots(view, outlinePts, edge, cover, dLink, d, props) {
    const ab = B().dotsAlongEdge(outlinePts, edge, cover, dLink, d, 2);
    return put(view, "dots", Object.assign({ a: ab.a, b: ab.b, d }, props || {}));
  }

  /** Label that shows the automatic text of `ref` (text "" = automatic). */
  function label(view, ref, at, tip, align, dist) {
    return put(view, "label", { ref: ref.id, text: "", at, tip, align: align || "left", dist: dist || null });
  }

  /** Distribution line: the segment a-b moved by `off` (model mm) along the unit vector `dir`. */
  function distLine(a, b, dir, off) {
    const o = mul(unit(dir), off);
    return { a: add(a, o), b: add(b, o) };
  }

  function dim(view, a, b, off) { return put(view, "dim", { a, b, off }); }

  /** Paper spacing of stacked labels: n label heights of 6 mm on paper, in model mm. */
  function step(view, n) { return 6 * view.scale * (n === undefined ? 1 : n); }

  // ------------------------------------------------------------------ templates
  function makeBlank() {
    const t = baseDoc({ name: "A-A", kind: "section", scale: 20, x: 150, y: 300 }, "Drawing title", "1:20");
    return t.doc;
  }

  function makeBeam() {
    const t = baseDoc({ name: "A-A", kind: "section", scale: 10, x: 250, y: 330 }, "Beam, section A-A", "1:10");
    const v = t.view;
    const O = rect(0, 0, 400, 700);
    outline(v, O);
    const link = stirrup(v, O, 35, 10, 150, true);
    const bottom = edgeDots(v, O, 0, 35, 10, 20, { mode: "count", n: 4 });
    const top = edgeDots(v, O, 2, 35, 10, 16, { mode: "count", n: 3 });
    const tops = B().dotPositions(top);
    const bots = B().dotPositions(bottom);
    const x = 400 + 24 * v.scale;                      // label column, 24 mm right of the beam on paper
    label(v, top, [x, 700], tops[0], "left");
    label(v, link, [x, 500], [maxX(link.pts), 450], "left");
    label(v, bottom, [x, 10], bots[bots.length - 1], "left");
    dim(v, [0, 0], [400, 0], -step(v, 3));
    dim(v, [0, 0], [0, 700], step(v, 3));
    return t.doc;
  }

  function makeSlabEdge() {
    const t = baseDoc({ name: "B-B", kind: "section", scale: 10, x: 250, y: 330 }, "Slab edge, section B-B", "1:10");
    const v = t.view;
    const sc = v.scale;
    const O = rect(0, 0, 1000, 300);                  // edges: 0 bottom, 1 free edge, 2 top, 3 cut end
    outline(v, O);
    // U-bars round the free edge, legs 600 long
    const u = edgeBar(v, O, [0, 1, 2], 35, 12, { kind: "U", s: "200" }, { extend: -318 });
    // main bars inside the legs of the U-bars
    const top = edgeBar(v, O, [2], 47, 16, { kind: "straight", s: "200", face: "OS" });
    const bot = edgeBar(v, O, [0], 47, 16, { kind: "straight", s: "200", face: "US" });
    // transverse (distribution) bars as dots, between the main bars
    const mid = put(v, "dots", { mode: "spacing", s: 250, a: [900, 150], b: [60, 150], d: 12 });
    const midPos = B().dotPositions(mid);
    const xl = -15 * sc;                              // left label column (text ends 15 mm left of the slab)
    label(v, top, [xl, 300 + 12 * sc], [200, top.pts[0][1]], "right");
    label(v, bot, [xl, -8 * sc], [200, bot.pts[0][1]], "right");
    const xr = 1000 + 25 * sc;                        // right label column
    label(v, u, [xr, 230], [u.pts[1][0], 200], "left");
    label(v, mid, [xr, 40], midPos[2], "left", distLine(mid.a, mid.b, [0, -1], 3.5 * sc));
    dim(v, [0, 0], [1000, 0], -10 * sc);
    dim(v, [0, 0], [0, 300], 10 * sc);
    return t.doc;
  }

  function makeWallFooting() {
    const t = baseDoc({ name: "C-C", kind: "section", scale: 20, x: 240, y: 520 }, "Wall on footing, section C-C", "1:20");
    const v = t.view;
    // edges: 0 footing bottom, 1 footing end, 2 footing top (right), 3 wall right face, 4 wall top,
    //        5 wall left face, 6 footing top (left), 7 footing end
    const O = [[0, 0], [1200, 0], [1200, 400], [750, 400], [750, 2000], [450, 2000], [450, 400], [0, 400]];
    outline(v, O);
    // bottom and top bars of the footing
    const fb = edgeBar(v, O, [0], 35, 16, { kind: "straight", s: "150", face: "US" });
    const ftr = edgeBar(v, O, [2], 35, 16, { kind: "straight", s: "150", face: "OS" });
    const ftl = edgeBar(v, O, [6], 35, 16, { kind: "straight", s: "150", face: "OS" });
    // L-bars (starter bars): foot lies on the bottom bars, leg runs up the right face of the wall
    const foot = B().barAlongEdges(O, [0], 51, 16);   // foot level (above the bottom bars)
    const leg = B().barAlongEdges(O, [3], 35, 16);
    const lbar = put(v, "bar", {
      pts: [[foot[1][0], foot[1][1]], [leg[0][0], foot[1][1]], [leg[0][0], 1500]],
      d: 16, kind: "L", s: "150"
    });
    // vertical bars of the wall, left face
    const wl = edgeBar(v, O, [5], 35, 16, { kind: "straight", s: "200", face: "YS" });
    // horizontal wall bars (dots) along the right face, inside the vertical bars
    const wd = edgeDots(v, O, 3, 35, 16, 12, { mode: "spacing", s: 200 });
    wd.a = [wd.a[0], 500];
    // transverse bars of the footing (dots) above the bottom bars
    const fd = edgeDots(v, O, 0, 35, 32, 12, { mode: "spacing", s: 200 });
    const wdPos = B().dotPositions(wd);
    const fdPos = B().dotPositions(fd);
    const sc = v.scale;
    const xr = 1200 + 10 * sc;                         // right label column
    label(v, wd, [xr, 1240], wdPos[4], "left", distLine(wd.a, wd.b, [1, 0], 2.2 * sc));
    label(v, lbar, [xr, 1120], [lbar.pts[1][0], 1000], "left");
    label(v, ftr, [xr, 700], [1000, ftr.pts[0][1]], "left");
    label(v, fb, [xr, -190], [800, fb.pts[0][1]], "left");
    label(v, fd, [xr, -70], fdPos[3], "left");
    const xl = 150;                                    // left labels sit above the footing
    label(v, wl, [xl, 1500], [wl.pts[0][0], 1500], "right");
    label(v, ftl, [xl, 700], [200, ftl.pts[0][1]], "right");
    put(v, "joint", { at: [450, 400], dir: [1, 0] });
    dim(v, [0, 0], [1200, 0], -step(v, 3));
    dim(v, [0, 0], [0, 400], step(v, 3));
    dim(v, [450, 2000], [750, 2000], step(v, 3));
    return t.doc;
  }

  function makeCorner() {
    const t = baseDoc({ name: "D-D", kind: "section", scale: 10, x: 235, y: 315 }, "Corner section D-D", "1:10");
    const v = t.view;
    // block 1100 x 500 + 300 step + slab 350 thick leaving to the right
    // edges: 0 bottom, 1 right face, 2 slab underside, 3 slab end, 4 top, 5 step wall, 6 step top, 7 left face
    const O = [[0, 0], [1100, 0], [1100, 450], [1900, 450], [1900, 800], [400, 800], [400, 500], [0, 500]];
    outline(v, O);
    const sc = v.scale;
    // two closed stirrups
    const sa = stirrup(v, rect(0, 0, 1100, 500), 35, 12, 150, true);
    const sb = stirrup(v, rect(400, 380, 1060, 740), 35, 10, 200, true);
    // U-bars round the slab end
    const u = edgeBar(v, O, [2, 3, 4], 35, 12, { kind: "U", s: "200" });
    // rows of cut bars inside the stirrup line
    const top = edgeDots(v, O, 4, 35, 12, 25, { mode: "count", n: 16 });
    const bot = edgeDots(v, O, 0, 35, 12, 25, { mode: "count", n: 13 });
    const topPos = B().dotPositions(top);
    const botPos = B().dotPositions(bot);
    // labels
    label(v, top, [1560, 800 + 12 * sc], topPos[4], "left", distLine(top.a, top.b, [0, 1], 3.3 * sc));
    label(v, bot, [800, -10 * sc], botPos[8], "left", distLine(bot.a, bot.b, [0, -1], 3.3 * sc));
    label(v, sa, [1300, 330], [maxX(sa.pts), 250], "left");
    label(v, u, [1660, 200], [1590, u.pts[0][1]], "left");
    label(v, sb, [150, 650], [Math.min.apply(null, sb.pts.map((q) => q[0])), 650], "right");
    // construction joint on the right face of the block
    put(v, "joint", { at: [1100, 110], dir: [0, 1] });
    // dimensions
    dim(v, [0, 0], [1100, 0], -25 * sc);
    dim(v, [0, 0], [1900, 0], -38 * sc);
    dim(v, [0, 0], [0, 500], 15 * sc);
    dim(v, [1900, 450], [1900, 800], -15 * sc);
    return t.doc;
  }

  RS.templates = {
    list: [
      { id: "blank", name: "Blank sheet", description: "An empty A1 sheet with one empty view (1:20).", make: makeBlank },
      { id: "beam", name: "Beam 400 x 700", description: "Rectangular beam section with closed stirrup Y10/150, 4 Y20 bottom and 3 Y16 top, labels and dimensions (1:10).", make: makeBeam },
      { id: "slab-edge", name: "Slab edge", description: "300 mm slab edge with U-bars Y12/200, top and bottom bars Y16/200 and transverse bars with distribution line (1:10).", make: makeSlabEdge },
      { id: "wall-footing", name: "Wall on footing", description: "Wall 300 on footing 1200 x 400 with L-bars, footing bars, wall bars, construction joint and dimensions (1:20).", make: makeWallFooting },
      { id: "corner-section", name: "Corner section (support)", description: "Stepped block 1100 x 800 with a 350 mm slab leaving it, two stirrups, U-bars, rows 16 Y25 and 13 Y25 with distribution lines (1:10).", make: makeCorner }
    ]
  };
})(window.RS);
</script>
<script>
/* --- src/ui/canvas.js --- */
/* ui/canvas.js: the interactive sheet canvas (SVG): pan/zoom, hit testing, snapping, selection and all drawing tools */
(function (RS) {
  "use strict";

  const G = RS.geom, U = RS.util;

  // ------------------------------------------------------------------ tool list (order = tool strip order)
  const TOOLS = [
    { id: "select", name: "Select", key: "V", hint: "Click to select (Shift adds), drag to move, drag a square handle to edit a point, Delete removes. Alt+click on a selected bar/outline segment adds a point, double-click a handle removes it." },
    { id: "outline", name: "Outline", key: "O", hint: "Click the corners of the concrete outline; Enter, double-click or the first point closes it." },
    { id: "rect", name: "Rectangle", key: "R", hint: "Click two opposite corners of a rectangular concrete outline." },
    { id: "bar", name: "Bar", key: "B", hint: "Click the points of a bar (diameter and kind from the options); Enter or double-click ends it." },
    { id: "stirrup", name: "Stirrup", key: "S", hint: "Click inside an outline to place a closed stirrup at the concrete cover." },
    { id: "edgebar", name: "Edge bar", key: "E", hint: "Click an outline edge for a bar along it at the cover; Shift+click the next edges for an L- or U-bar, Enter ends." },
    { id: "dots", name: "Dots", key: "D", hint: "Click the first and then the last dot of a row of cut bars (count from the options)." },
    { id: "edgedots", name: "Edge dots", key: "G", hint: "Click an outline edge for a dot row inside the stirrup line (count from the options)." },
    { id: "label", name: "Label", key: "L", hint: "Click a bar or dot row, then click where the label text goes." },
    { id: "dim", name: "Dimension", key: "M", hint: "Click the two points to measure, then click the position of the dimension line." },
    { id: "text", name: "Text", key: "T", hint: "Click where the text goes, type it and press Enter." },
    { id: "cut", name: "Section cut", key: "C", hint: "Click the two ends of a section cut line; the letter counts up A, B, C..." },
    { id: "joint", name: "Joint", key: "J", hint: "Click a point on a concrete edge to place a construction joint mark along that edge." },
    { id: "view", name: "New view", key: "W", hint: "Click a point on the sheet to create a new view there (scale from the options)." },
    { id: "pan", name: "Pan", key: "H", hint: "Drag to move the sheet. The middle or right mouse button and Space + drag also pan; the wheel zooms." }
  ];
  const KEY_TOOL = {};
  TOOLS.forEach(function (t) { KEY_TOOL[t.key.toLowerCase()] = t.id; });
  const SNAP_TOOLS = { outline: 1, rect: 1, bar: 1, dots: 1, dim: 1, text: 1, cut: 1, joint: 1, label: 1 };

  // options edited by the options bar (ui/app.js); cover comes from doc.settings.cover
  const OPT_DEFAULTS = { d: 16, kind: "straight", n: 4, s: 150, face: "", dLink: 10, scale: 20 };
  RS.toolOpts = RS.toolOpts || {};
  Object.keys(OPT_DEFAULTS).forEach(function (k) { if (RS.toolOpts[k] === undefined) { RS.toolOpts[k] = OPT_DEFAULTS[k]; } });

  const MIN_Z = 0.1, MAX_Z = 50;
  const SEL_COLOR = "#1565c0";

  // ------------------------------------------------------------------ module state
  let host = null, svg = null, world = null, paperShadow = null, paperRect = null, contentG = null, overlayG = null;
  let W = 0, H = 0;
  const T = { z: 1, ox: 0, oy: 0 };            // paper -> element px: px = o + z * mm
  let needFit = true;
  let rafId = 0;
  let hitPrims = [], hitDirty = true;
  let bboxCache = null;
  let hoverId = null;
  let overTitle = false;                       // the pointer is on a view title (move cursor)
  let cur = null;                              // cursor info of the last mouse position
  let lastEvt = null;
  let drawing = null;                          // state of the drawing tool in progress
  let drag = null;                             // select-tool drag (move or handle)
  let panning = null;
  let spaceDown = false;
  let downSeen = null;
  let transient = "";
  let transientTimer = 0;
  let editor = null;                           // inline text editor
  let chain = null;                            // edge bar chain {barId, outlineId, edges}
  const listeners = [];                        // [target, type, fn, opts] for teardown
  let unsubs = [];
  let resizeObs = null;

  // ------------------------------------------------------------------ small helpers
  function isPt(p) { return Array.isArray(p) && p.length >= 2 && isFinite(p[0]) && isFinite(p[1]); }
  function pos(v, dflt) { const n = +v; return isFinite(n) && n > 0 ? n : dflt; }
  function cp(p) { return [p[0], p[1]]; }
  function r2(p) { return [U.round(p[0], 2), U.round(p[1], 2)]; }
  function near(a, b, tol) { return G.dist(a, b) <= (tol === undefined ? 1e-6 : tol); }
  function doc() { return RS.store.doc(); }
  function sheet() { const d = doc(); return d ? RS.model.activeSheet(d) : null; }
  function viewList() { const sh = sheet(); return sh && Array.isArray(sh.views) ? sh.views.filter(Boolean) : []; }
  function viewObj(id) { const d = doc(); return d && id ? RS.model.viewById(d, id) : null; }
  function paperSize() {
    const sh = sheet(), pp = RS.config.papers;
    return (sh && pp[sh.paper]) || pp[RS.config.defaults.paper] || pp.A1;
  }
  function coverVal() { const d = doc(); const c = d && d.settings ? +d.settings.cover : NaN; return isFinite(c) && c >= 0 ? c : 35; }
  function faceOf(f) { return RS.config.faces.indexOf(f) >= 0 ? f : ""; }
  function entList(v) { return v && Array.isArray(v.entities) ? v.entities.filter(function (e) { return e && e.type; }) : []; }
  function toModel(v, paper) { return RS.render.viewTransform(v).toModel(paper); }
  function toPaperPt(v, model) { return RS.render.viewTransform(v).toPaper(model); }
  function listen(target, type, fn, opts) {
    target.addEventListener(type, fn, opts);
    listeners.push([target, type, fn, opts]);
  }
  /**
   * Pointer + mouse events with de-duplication: a real browser sends both for one mouse action (same position and
   * time stamp); the mouse twin is dropped. A script may send either kind alone.
   */
  function bindPtr(target, base, fn) {
    let last = null;
    listen(target, "pointer" + base, function (e) {
      last = { x: e.clientX, y: e.clientY, t: e.timeStamp };
      fn(e);
    }, true);
    listen(target, "mouse" + base, function (e) {
      if (last && last.x === e.clientX && last.y === e.clientY && Math.abs(e.timeStamp - last.t) < 40) { last = null; return; }
      fn(e);
    }, true);
  }

  // ------------------------------------------------------------------ view transform
  function measure() {
    if (!host) { return; }
    const r = host.getBoundingClientRect();
    W = r.width; H = r.height;
  }
  function toScreen(q) { return [T.ox + q[0] * T.z, T.oy + q[1] * T.z]; }
  function screenToPaper(px, py) {
    if (Array.isArray(px)) { py = px[1]; px = px[0]; }
    return [(px - T.ox) / T.z, (py - T.oy) / T.z];
  }
  function paperToScreen(q) { return toScreen(q); }
  function paperToClient(q) {
    const r = host ? host.getBoundingClientRect() : { left: 0, top: 0 };
    const s = toScreen(q);
    return [r.left + s[0], r.top + s[1]];
  }
  function eventPos(e) {
    const r = host.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  /** Set the paper -> element transform directly: px = o + z * mm (z in px per paper mm). */
  function setTransform(z, ox, oy) {
    T.z = U.clamp(+z || T.z, MIN_Z, MAX_Z);
    if (isFinite(ox)) { T.ox = +ox; }
    if (isFinite(oy)) { T.oy = +oy; }
    needFit = false;
    schedule();
  }

  function fit() {
    if (!host) { return; }
    measure();
    if (W < 20 || H < 20) { needFit = true; return; }
    const pp = paperSize(), m = 24;
    const z = U.clamp(Math.min((W - 2 * m) / pp[0], (H - 2 * m) / pp[1]), MIN_Z, MAX_Z);
    T.z = z; T.ox = (W - pp[0] * z) / 2; T.oy = (H - pp[1] * z) / 2;
    needFit = false;
    schedule();
  }

  /* zoom to the drawing: all views of the active sheet with a margin (the whole sheet when it has nothing drawn) */
  function fitDrawing() {
    if (!host) { return; }
    measure();
    if (W < 20 || H < 20) { needFit = true; return; }
    const d = RS.store.doc(), sh = d && d.sheets && d.sheets[d.active];
    let bb = null;
    for (const v of (sh && sh.views) || []) {
      if (!v || !(v.entities || []).length) { continue; }
      let b = null;
      try { b = RS.render.viewBBox(v, d); } catch (e) { b = null; }
      if (!b || !b.every(isFinite)) { continue; }
      bb = bb ? [Math.min(bb[0], b[0]), Math.min(bb[1], b[1]), Math.max(bb[2], b[2]), Math.max(bb[3], b[3])] : b.slice();
    }
    if (!bb) { fit(); return; }
    const m = 60, w = Math.max(bb[2] - bb[0], 20), h = Math.max(bb[3] - bb[1] + 12, 20);   // + room for the view titles
    const z = U.clamp(Math.min((W - 2 * m) / w, (H - 2 * m) / h), MIN_Z, MAX_Z);
    T.z = z; T.ox = W / 2 - (bb[0] + w / 2) * z; T.oy = H / 2 - (bb[1] + h / 2) * z;
    needFit = false;
    schedule();
  }

  function zoomBy(f, at) {
    if (!host || !isFinite(f) || f <= 0) { return; }
    let ax = W / 2, ay = H / 2;
    if (Array.isArray(at)) { ax = at[0]; ay = at[1]; }
    else if (at && typeof at === "object" && isFinite(at.x)) { ax = at.x; ay = at.y; }
    const nz = U.clamp(T.z * f, MIN_Z, MAX_Z), k = nz / T.z;
    T.ox = ax - (ax - T.ox) * k;
    T.oy = ay - (ay - T.oy) * k;
    T.z = nz;
    schedule();
  }

  // ------------------------------------------------------------------ rendering
  function schedule() {
    if (rafId || !svg) { return; }
    rafId = requestAnimationFrame(function () { rafId = 0; draw(); });
  }

  function redraw() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    draw();
  }

  function inner(svgText) {
    return String(svgText).replace(/^\s*<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
  }

  function draw() {
    if (!svg) { return; }
    measure();
    if (needFit && W >= 20 && H >= 20) { fit(); }
    const d = doc();
    const pp = paperSize();
    let prims = [];
    if (d) {
      try {
        prims = RS.render.sheetPrims(d, d.active, {
          sel: RS.store.sel(), hover: hoverId, draft: buildDraft(), showViewFrames: true, activeView: RS.store.activeView()
        }) || [];
      } catch (err) { prims = []; if (typeof console !== "undefined") { console.error(err); } }
    }
    hitPrims = prims; hitDirty = false;
    let body = "";
    // on screen every line is at least about one pixel wide (true widths are kept in the exports)
    const minW = 0.9 / (T.z || 1), screenPrims = prims.map((p) => (p && typeof p.w === "number" && p.w < minW ? Object.assign({}, p, { w: minW }) : p));
    try { body = inner(RS.io.toSVG(screenPrims, pp, { forScreen: true })); } catch (err) { body = ""; if (typeof console !== "undefined") { console.error(err); } }
    paperShadow.setAttribute("width", pp[0]); paperShadow.setAttribute("height", pp[1]);
    paperRect.setAttribute("width", pp[0]); paperRect.setAttribute("height", pp[1]);
    contentG.innerHTML = body;
    world.setAttribute("transform", "translate(" + U.round(T.ox, 3) + " " + U.round(T.oy, 3) + ") scale(" + T.z + ")");
    drawOverlay();
  }

  function drawOverlay() {
    let s = "";
    if (cur && cur.show && cur.snap && cur.snapPaper) {
      const q = toScreen(cur.snapPaper), x = q[0], y = q[1], r = 5;
      const st = ' fill="none" stroke="#e65100" stroke-width="1.6"';
      switch (cur.snap) {
        case "vertex": s = '<circle cx="' + x + '" cy="' + y + '" r="' + r + '"' + st + "/>"; break;
        case "midpoint":
          s = '<polygon points="' + x + "," + (y - r) + " " + (x + r) + "," + (y + r * 0.8) + " " + (x - r) + "," + (y + r * 0.8) + '"' + st + "/>"; break;
        case "intersection":
          s = '<path d="M' + (x - r) + " " + (y - r) + "L" + (x + r) + " " + (y + r) + "M" + (x + r) + " " + (y - r) + "L" + (x - r) + " " + (y + r) + '"' + st + "/>"; break;
        case "edge":
          s = '<rect x="' + (x - r * 0.8) + '" y="' + (y - r * 0.8) + '" width="' + (r * 1.6) + '" height="' + (r * 1.6) + '"' + st + "/>"; break;
        default:
          s = '<path d="M' + (x - 3) + " " + y + "L" + (x + 3) + " " + y + "M" + x + " " + (y - 3) + "L" + x + " " + (y + 3) +
            '" fill="none" stroke="#e65100" stroke-opacity="0.55" stroke-width="1"/>';
      }
    }
    overlayG.innerHTML = s;
  }

  // ------------------------------------------------------------------ views under the cursor
  function viewBoxes() {
    if (!bboxCache) {
      const d = doc();
      bboxCache = viewList().map(function (v) {
        let bb = null;
        try { bb = RS.render.viewBBox(v, d); } catch (err) { bb = null; }
        return { v: v, bb: bb };
      });
    }
    return bboxCache;
  }

  /** The view whose frame contains the paper point q (smallest wins), or null. */
  function viewAt(q) {
    if (!isPt(q)) { return null; }
    const m = 3;
    let best = null, ba = Infinity;
    viewBoxes().forEach(function (o) {
      const b = o.bb;
      if (!b || !isFinite(b[0] + b[1] + b[2] + b[3])) { return; }
      if (q[0] >= b[0] - m && q[0] <= b[2] + m && q[1] >= b[1] - m && q[1] <= b[3] + 12) {
        const a = (b[2] - b[0] + 2 * m) * (b[3] - b[1] + 12 + m);
        if (a < ba) { best = o.v; ba = a; }
      }
    });
    return best;
  }

  function targetView(paper) {
    if (drawing && drawing.viewId) { const v = viewObj(drawing.viewId); if (v) { return v; } }
    if (drag && drag.viewId) { const v = viewObj(drag.viewId); if (v) { return v; } }
    return viewAt(paper) || RS.store.activeViewObject();
  }

  // ------------------------------------------------------------------ hit testing (geometric, on the display list)
  function distSegs(q, pts, closed) {
    let best = Infinity;
    const n = pts.length, segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const r = G.closestOnSeg(q, pts[i], pts[(i + 1) % n]);
      if (r.d < best) { best = r.d; }
    }
    return best;
  }

  function textQuad(p) {
    const h = p.h > 0 ? p.h : 2.5;
    let w = h * 0.6 * String(p.text).length;
    try { w = RS.io.textWidth(p.text, h); } catch (err) { /* keep estimate */ }
    let u0 = 0, u1 = w;
    if (p.align === "center") { u0 = -w / 2; u1 = w / 2; } else if (p.align === "right") { u0 = -w; u1 = 0; }
    let v0 = -h, v1 = 0;
    if (p.valign === "middle") { v0 = -h / 2; v1 = h / 2; } else if (p.valign === "top") { v0 = 0; v1 = h; }
    const a = (p.rot || 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return [[u0, v0], [u1, v0], [u1, v1], [u0, v1]].map(function (q) {
      return [p.at[0] + q[0] * c + q[1] * s, p.at[1] - q[0] * s + q[1] * c];
    });
  }

  function distPrim(p, q) {
    switch (p.k) {
      case "line": return G.closestOnSeg(q, p.a, p.b).d;
      case "poly": {
        const pts = p.pts;
        if (!pts || pts.length < 2) { return Infinity; }
        if (p.fill && p.closed && pts.length >= 3 && G.pointInPoly(q, pts)) { return 0; }
        return distSegs(q, pts, !!p.closed);
      }
      case "circle": {
        const d = G.dist(q, p.c);
        return p.fill ? Math.max(0, d - p.r) : Math.abs(d - p.r);
      }
      case "text": {
        if (!isPt(p.at) || p.text === undefined || p.text === "") { return Infinity; }
        const quad = textQuad(p);
        if (G.pointInPoly(q, quad)) { return 0; }
        return distSegs(q, quad, true);
      }
      default: return Infinity;
    }
  }

  function getHitPrims() {
    if (hitDirty) {
      const d = doc();
      try { hitPrims = d ? RS.render.sheetPrims(d, d.active, { sel: RS.store.sel(), showViewFrames: true, activeView: RS.store.activeView() }) || [] : []; }
      catch (err) { hitPrims = []; }
      hitDirty = false;
    }
    return hitPrims;
  }

  /**
   * Geometric hit test at paper point q. Handles win over entities. Returns
   * { kind: "handle", id, vid, hk, hi } | { kind: "entity", id, vid, d } | { kind: "viewtitle", vid } | null.
   * opt: { filter(entity) -> bool, tolPx }
   */
  function hitTest(q, opt) {
    opt = opt || {};
    if (!isPt(q)) { return null; }
    const tol = (opt.tolPx || 6) / T.z;
    const d = doc();
    const memo = {};
    function ok(id) {
      if (!opt.filter) { return true; }
      if (memo[id] === undefined) {
        const f = d ? RS.model.find(d, id) : null;
        memo[id] = !!(f && opt.filter(f.entity, f));
      }
      return memo[id];
    }
    let bh = null, be = null, bv = null;
    getHitPrims().forEach(function (p) {
      if (!p) { return; }
      const role = p.role;
      if (role === "handle") {
        if (opt.filter && !ok(p.id)) { return; }
        const dd = distPrim(p, q);
        if (dd <= tol && (!bh || dd < bh.d)) { bh = { kind: "handle", id: p.id, vid: p.vid, hk: p.hk, hi: p.hi, d: dd }; }
      } else if (role === "entity" && p.id !== undefined) {
        if (!ok(p.id)) { return; }
        const dd = distPrim(p, q);
        if (dd <= tol && (!be || dd <= be.d + 1e-9)) { be = { kind: "entity", id: p.id, vid: p.vid, d: dd }; }
      } else if (role === "viewtitle") {
        const dd = distPrim(p, q);
        if (dd <= tol && (!bv || dd < bv.d)) { bv = { kind: "viewtitle", vid: p.vid, d: dd }; }
      }
    });
    if (opt.filter) { return be; }
    return bh || be || bv;
  }

  function pickEntity(q) {
    const h = hitTest(q);
    return h && h.id !== undefined ? h.id : null;
  }

  // ------------------------------------------------------------------ snapping
  function snapPoint(v, raw, excludeId) {
    const sc = pos(v.scale, 1);
    const Rm = (RS.config.snap && RS.config.snap.px ? RS.config.snap.px : 10) / T.z * sc;   // radius in model mm
    const toPx = function (dm) { return dm / sc * T.z; };
    const verts = [], segs = [];
    function addPts(pts, closed, inter) {
      if (!Array.isArray(pts)) { return; }
      const good = pts.filter(isPt);
      good.forEach(function (p) { verts.push(p); });
      const n = good.length, cnt = closed ? n : n - 1;
      for (let i = 0; i < cnt; i++) { if (n > 1) { segs.push({ a: good[i], b: good[(i + 1) % n], inter: inter }); } }
    }
    entList(v).forEach(function (e) {
      if (e.id === excludeId) { return; }
      switch (e.type) {
        case "outline": addPts(e.pts, true, true); (Array.isArray(e.holes) ? e.holes : []).forEach(function (h) { addPts(h, true, true); }); break;
        case "line": case "bar": addPts(e.pts, !!e.closed, true); break;
        case "dots":
          try { (RS.bars.dotPositions(e) || []).forEach(function (p) { if (isPt(p)) { verts.push(p); } }); } catch (err) { /* ignore */ }
          break;
        case "dim": case "cut": if (isPt(e.a)) { verts.push(e.a); } if (isPt(e.b)) { verts.push(e.b); } break;
        case "joint": case "text": if (isPt(e.at)) { verts.push(e.at); } break;
        default: break;
      }
    });
    if (drawing && drawing.viewId === v.id && Array.isArray(drawing.pts)) { addPts(drawing.pts, false, false); }

    let best = null;
    function consider(p, kind, dm, bias) {
      if (dm > Rm) { return; }
      const score = toPx(dm) + bias;
      if (!best || score < best.score) { best = { p: p, kind: kind, score: score }; }
    }
    verts.forEach(function (p) { consider(p, "vertex", G.dist(p, raw), 0); });
    const nearSegs = [];
    segs.forEach(function (s) {
      const r = G.closestOnSeg(raw, s.a, s.b);
      if (r.d <= Rm) {
        consider(r2(r.p), "edge", r.d, 5);
        if (s.inter) { nearSegs.push(s); }
      }
      const mid = G.lerp(s.a, s.b, 0.5);
      consider(r2(mid), "midpoint", G.dist(mid, raw), 2);
    });
    if (nearSegs.length > 1 && nearSegs.length <= 80) {
      for (let i = 0; i < nearSegs.length; i++) {
        for (let j = i + 1; j < nearSegs.length; j++) {
          const h = G.segIntersect(nearSegs[i].a, nearSegs[i].b, nearSegs[j].a, nearSegs[j].b);
          if (h) { consider(r2(h.p), "intersection", G.dist(h.p, raw), 0); }
        }
      }
    }
    if (best) { return { p: best.p, kind: best.kind }; }
    const g = sc >= 50 ? 10 : 5;
    return { p: [Math.round(raw[0] / g) * g + 0, Math.round(raw[1] / g) * g + 0], kind: "grid" };
  }

  function refPoint() {
    if (!drawing) { return null; }
    const t = RS.store.tool();
    if ((t === "outline" || t === "bar") && drawing.pts && drawing.pts.length) { return drawing.pts[drawing.pts.length - 1]; }
    if ((t === "dots" || t === "dim" || t === "cut") && drawing.a) { return drawing.a; }
    if (t === "label" && drawing.tip) { return drawing.tip; }
    return null;
  }

  function ortho(p, ref) {
    return Math.abs(p[0] - ref[0]) >= Math.abs(p[1] - ref[1]) ? [p[0], ref[1]] : [ref[0], p[1]];
  }

  function snapActive(tool) {
    if (!SNAP_TOOLS[tool]) { return false; }
    if (tool === "label") { return !!(drawing && drawing.ref); }
    return true;
  }

  /** Compute the cursor info (paper, model in the target view, snapped point) for a mouse event. */
  function updateCursor(e) {
    const pos0 = eventPos(e);
    const paper = screenToPaper(pos0[0], pos0[1]);
    lastEvt = { clientX: e.clientX, clientY: e.clientY, shiftKey: !!e.shiftKey };
    const tool = RS.store.tool();
    const c = { px: pos0, paper: paper, viewId: null, model: null, rawModel: null, snap: "", snapPaper: null, show: false };
    const v = targetView(paper);
    if (v) {
      c.viewId = v.id;
      const raw = toModel(v, paper);
      c.rawModel = raw;
      const handleDrag = drag && drag.type === "handle";
      if (snapActive(tool) || handleDrag) {
        const s = snapPoint(v, raw, handleDrag ? drag.id : null);
        let p = s.p;
        const ref = handleDrag ? null : refPoint();
        if (e.shiftKey && ref) { p = ortho(p, ref); }
        c.model = cp(p); c.snap = s.kind; c.snapPaper = toPaperPt(v, p); c.show = true;
      } else {
        c.model = [U.round(raw[0], 1), U.round(raw[1], 1)];
      }
    }
    cur = c;
    return c;
  }

  // ------------------------------------------------------------------ entity editing helpers
  function translateEntity(e, dx, dy) {
    const f = function (p) { return isPt(p) ? [U.round(p[0] + dx, 3), U.round(p[1] + dy, 3)] : p; };
    if (Array.isArray(e.pts)) { e.pts = e.pts.map(f); }
    if (Array.isArray(e.holes)) { e.holes = e.holes.map(function (r) { return Array.isArray(r) ? r.map(f) : r; }); }
    ["a", "b", "at", "tip"].forEach(function (k) { if (e[k]) { e[k] = f(e[k]); } });
    if (e.dist && typeof e.dist === "object") {
      if (e.dist.a) { e.dist.a = f(e.dist.a); }
      if (e.dist.b) { e.dist.b = f(e.dist.b); }
    }
  }

  function applyHandle(e, hk, hi, p) {
    const q = [U.round(p[0], 3), U.round(p[1], 3)];
    if (hk === "pts") { if (Array.isArray(e.pts) && hi >= 0 && hi < e.pts.length) { e.pts[hi] = q; } }
    else if (hk.indexOf("holes.") === 0) {
      const j = parseInt(hk.slice(6), 10);
      if (Array.isArray(e.holes) && Array.isArray(e.holes[j]) && hi >= 0 && hi < e.holes[j].length) { e.holes[j][hi] = q; }
    } else if (hk === "dist.a" || hk === "dist.b") { if (e.dist) { e.dist[hk.slice(5)] = q; } }
    else if (hk === "off") {
      if (isPt(e.a) && isPt(e.b)) {
        const u = G.unit(G.sub(e.b, e.a));
        e.off = U.round(G.dot(G.sub(p, e.a), G.perp(u)), 2);
      }
    } else if (hk === "a" || hk === "b" || hk === "at" || hk === "tip") { e[hk] = q; }
  }

  function deltaForEntity(f, dpaper) {
    if (f.view) { const sc = pos(f.view.scale, 1); return [dpaper[0] * sc, -dpaper[1] * sc]; }
    return [dpaper[0], dpaper[1]];
  }

  function commitEntity(viewId, ent, label) {
    RS.store.edit(function (d) {
      const v = RS.model.viewById(d, viewId);
      if (!v) { throw new Error("The view no longer exists."); }
      v.entities.push(ent);
    }, label);
    RS.store.setSel([ent.id]);
  }

  function newEnt(type, props) { return RS.model.newEntity(type, props); }

  function deleteSelected() {
    const ids = RS.store.sel();
    if (!ids.length) { return; }
    RS.store.edit(function (d) {
      const gone = {};
      ids.forEach(function (id) {
        const f = RS.model.find(d, id);
        if (f) { f.list.splice(f.index, 1); gone[id] = true; }
      });
      d.sheets.forEach(function (sh) {
        (sh.views || []).forEach(function (v) {
          v.entities = (v.entities || []).filter(function (e) { return !(e && e.type === "label" && e.ref && gone[e.ref]); });
        });
      });
    }, "Delete");
    RS.store.setSel([]);
  }

  function nudge(dx, dy) {
    const ids = RS.store.sel();
    if (!ids.length) { return; }
    RS.store.edit(function (d) {
      ids.forEach(function (id) {
        const f = RS.model.find(d, id);
        if (!f) { return; }
        if (f.view) { translateEntity(f.entity, dx, dy); } else { translateEntity(f.entity, dx, -dy); }
      });
    }, "Nudge");
  }

  // ------------------------------------------------------------------ drawing helpers
  function nextCutName(sh) {
    const used = {};
    ((sh && sh.views) || []).forEach(function (v) { entList(v).forEach(function (e) { if (e.type === "cut") { used[String(e.name)] = true; } }); });
    for (let i = 0; i < 26; i++) { const n = String.fromCharCode(65 + i); if (!used[n]) { return n; } }
    let k = 1;
    while (used["Z" + k]) { k++; }
    return "Z" + k;
  }

  function nextViewName(sh) {
    const used = {};
    ((sh && sh.views) || []).forEach(function (v) { if (v) { used[String(v.name)] = true; } });
    for (let i = 0; i < 26; i++) { const L = String.fromCharCode(65 + i), n = L + "-" + L; if (!used[n]) { return n; } }
    let k = 1;
    while (used["V" + k]) { k++; }
    return "V" + k;
  }

  /** Nearest outline edge to a model point: { o, i, d } (distance in model mm) or null. */
  function nearestEdge(v, pt) {
    let best = null;
    entList(v).forEach(function (e) {
      if (e.type !== "outline" || !Array.isArray(e.pts) || e.pts.length < 3 || !e.pts.every(isPt)) { return; }
      const n = e.pts.length;
      for (let i = 0; i < n; i++) {
        const r = G.closestOnSeg(pt, e.pts[i], e.pts[(i + 1) % n]);
        if (!best || r.d < best.d) { best = { o: e, i: i, d: r.d }; }
      }
    });
    return best;
  }

  function edgePick(c, tolPx) {
    const v = viewObj(c.viewId);
    if (!v || !c.rawModel) { return null; }
    const e = nearestEdge(v, c.rawModel);
    const tol = (tolPx || 14) / T.z * pos(v.scale, 1);
    return e && e.d <= tol ? e : null;
  }

  function sOpt() { const s = RS.toolOpts.s; return pos(s, 0) ? String(Math.round(+s * 100) / 100) : ""; }

  function barProps(pts) {
    const o = RS.toolOpts;
    const kinds = ["straight", "stirrup", "U", "L", "free"];
    const kind = kinds.indexOf(o.kind) >= 0 ? o.kind : "straight";
    const closed = kind === "stirrup" && pts.length >= 3;
    return { pts: pts, closed: closed, hooks: closed, d: pos(o.d, 16), kind: kind, n: "", s: sOpt(), face: faceOf(o.face) };
  }

  function edgeBarEntity(outline, edges, id) {
    const o = RS.toolOpts, d = pos(o.d, 16);
    const pts = RS.bars.barAlongEdges(outline.pts, edges, coverVal(), d, { extend: 0 });
    const kind = edges.length === 1 ? "straight" : (edges.length === 2 ? "L" : "U");
    const props = { pts: pts.map(r2), d: d, kind: kind, n: "", s: sOpt(), face: faceOf(o.face) };
    if (id) { props.id = id; }
    return newEnt("bar", props);
  }

  function edgeDotsEntity(outline, edge, id) {
    const o = RS.toolOpts, d = pos(o.d, 16), n = Math.max(1, Math.round(pos(o.n, 2)));
    const ab = RS.bars.dotsAlongEdge(outline.pts, [edge], coverVal(), pos(o.dLink, 10), d, n);
    const props = { mode: "count", a: r2(ab.a), b: r2(ab.b), n: n, d: d, face: faceOf(o.face) };
    if (id) { props.id = id; }
    return newEnt("dots", props);
  }

  function stirrupEntity(outline, id) {
    const o = RS.toolOpts, d = pos(o.dLink, 10);
    const pts = RS.bars.stirrupFromOutline(outline.pts, coverVal(), d).map(r2);
    const props = { pts: pts, closed: true, hooks: true, d: d, kind: "stirrup", n: "", s: sOpt(), face: "" };
    if (id) { props.id = id; }
    return newEnt("bar", props);
  }

  function outlineUnder(v, pt) {
    let best = null, ba = Infinity;
    entList(v).forEach(function (e) {
      if (e.type !== "outline" || !Array.isArray(e.pts) || e.pts.length < 3 || !e.pts.every(isPt)) { return; }
      if (!G.pointInPoly(pt, e.pts)) { return; }
      const a = Math.abs(G.area(e.pts));
      if (a < ba) { best = e; ba = a; }
    });
    return best;
  }

  function dedupe(pts) {
    const out = [];
    pts.forEach(function (p) { if (!out.length || !near(out[out.length - 1], p, 1e-6)) { out.push(p); } });
    if (out.length > 1 && near(out[0], out[out.length - 1], 1e-6)) { out.pop(); }
    return out;
  }

  function dotsLabelTip(e, model) {
    if (e.type === "bar") {
      if (!Array.isArray(e.pts) || e.pts.length < 2) { return null; }
      const r = G.closestOnPath(model, e.pts.filter(isPt), !!e.closed);
      return r ? r2(r.p) : null;
    }
    let best = null, bd = Infinity;
    let ps = [];
    try { ps = RS.bars.dotPositions(e) || []; } catch (err) { ps = []; }
    ps.forEach(function (p) { if (isPt(p) && G.dist(p, model) < bd) { bd = G.dist(p, model); best = p; } });
    return best ? cp(best) : null;
  }

  function warn(msg) {
    transient = msg;
    if (transientTimer) { clearTimeout(transientTimer); }
    transientTimer = setTimeout(function () { transient = ""; transientTimer = 0; emitStatus(); }, 4000);
    emitStatus();
  }

  // ------------------------------------------------------------------ drawing tools: click handlers and drafts
  const IMPL = {};

  function finishOutline() {
    if (!drawing || !drawing.pts) { return; }
    const pts = dedupe(drawing.pts);
    const vid = drawing.viewId;
    if (pts.length < 3) { warn("An outline needs at least 3 points."); return; }
    drawing = null;
    commitEntity(vid, newEnt("outline", { pts: pts }), "Add outline");
  }

  IMPL.outline = {
    click: function (c) {
      if (!c.model) { return; }
      const d = drawing || (drawing = { viewId: c.viewId, pts: [] });
      const pts = d.pts;
      if (pts.length >= 3 && near(pts[0], c.model)) { finishOutline(); return; }
