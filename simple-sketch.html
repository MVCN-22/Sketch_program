    const sec = section("view", "Active view: " + v.name,
      fld("Name", s("text", "name")),
      fld("Kind", s("select", "kind", { options: [["section", "section"], ["detail", "detail"], ["plan", "plan"], ["elevation", "elevation"], ["free", "free"]] })),
      fld("Scale 1:", s("num", "scale", { min: 0.01 })),
      row("Title override", titleCtl),
      fld("X [mm]", s("num", "x", { label: "Move view" })),
      fld("Y [mm]", s("num", "y", { label: "Move view" })),
      h("div", { class: "actions" }, addBtn, delBtn));
    const sum = sec.querySelector("summary");
    syncers.push(function () { const q = tg(doc()); if (q) { sum.textContent = "Active view: " + q.name; } });
    runHooks(sec, { view: v, doc: doc() });
    return sec;
  }

  function sheetForm(sheet) {
    const d = doc();
    const kids = [];
    // tabs
    const tabs = h("div", { class: "tabs" });
    d.sheets.forEach(function (sh, i) {
      const b = h("button", {
        type: "button", class: "tab" + (i === d.active ? " on" : ""), text: sh.name || ("Sheet " + (i + 1)),
        "data-sheet": String(i),
        on: { click: function () { if (i !== doc().active) { edit(function (dd) { dd.active = i; }, "Switch sheet"); } } }
      });
      tabs.appendChild(b);
      syncers.push(function () { const q = doc().sheets[i]; if (q) { b.textContent = q.name || ("Sheet " + (i + 1)); } });
    });
    tabs.appendChild(h("button", {
      type: "button", class: "tab add", text: "+", title: "Add sheet",
      on: { click: guard(function () {
        edit(function (dd) {
          const sh = RS.model.newSheet(dd.sheets[dd.active].paper, "Sheet " + (dd.sheets.length + 1));
          sh.views.push(RS.model.newView({ name: "A-A", scale: RS.config.defaults.scale }));
          dd.sheets.push(sh);
          dd.active = dd.sheets.length - 1;
        }, "Add sheet");
      }) }
    }));
    kids.push(tabs);

    const s = function (type, tgt, path, extra) { return Object.assign({ type: type, target: tgt, path: path, label: "Edit sheet" }, extra || {}); };
    kids.push(fld("Sheet name", s("text", T.sheet(), "name")));
    kids.push(fld("Paper", s("select", T.sheet(), "paper", { options: Object.keys(RS.config.papers).map((k) => [k, k + " (" + RS.config.papers[k][0] + " x " + RS.config.papers[k][1] + ")"]) })));
    const del = button("Remove this sheet", function () {
      edit(function (dd) {
        dd.sheets.splice(dd.active, 1);
        if (dd.active >= dd.sheets.length) { dd.active = dd.sheets.length - 1; }
      }, "Remove sheet");
    }, "danger");
    if (d.sheets.length <= 1) { del.disabled = true; del.title = "A document keeps at least one sheet"; }
    const arr = button("Arrange views", function () {
      edit(function (dd) { RS.layout.arrange(RS.model.activeSheet(dd), dd); }, "Arrange views");
    });
    arr.title = "Place all views of this sheet in free space, left to right and top to bottom";
    kids.push(h("div", { class: "actions" }, arr, del));
    const sec = section("sheet", "Sheet: " + (sheet.name || ""), ...kids);
    const sum = sec.querySelector("summary");
    syncers.push(function () { const q = RS.model.activeSheet(doc()); if (q) { sum.textContent = "Sheet: " + (q.name || ""); } });
    return sec;
  }

  function titleForm() {
    const words = (RS.config.words[doc().settings.lang] || RS.config.words.da).title;
    const kids = [];
    ["client", "project", "title", "number", "rev", "scale", "date", "drawn", "checked", "approved"].forEach(function (k) {
      kids.push(fld(words[k] || k, { type: "text", target: T.title(), path: k, label: "Edit title block" }));
    });
    return section("title", "Title block", ...kids);
  }

  function notesForm() {
    const words = RS.config.words[doc().settings.lang] || RS.config.words.da;
    const kids = [];
    [["note", words.note], ["refs", words.refs], ["symbols", words.symbols]].forEach(function (p) {
      kids.push(h("label", { class: "block", text: p[1] + " (one line per row)" }));
      kids.push(control({ type: "lines", target: T.notes(), path: p[0], rows: p[0] === "note" ? 4 : 3, label: "Edit notes" }));
    });
    return section("notes", "Notes column", ...kids);
  }

  function docForm() {
    const s = function (type, path, extra) { return Object.assign({ type: type, target: T.settings(), path: path, label: "Edit document settings" }, extra || {}); };
    return section("doc", "Document settings",
      fld("Language", s("select", "lang", { options: [["da", "Dansk (da)"], ["en", "English (en)"]] })),
      fld("Bar prefix", s("text", "prefix", { ph: "Y" })),
      fld("Cover (mm)", s("num", "cover", { min: 0 })),
      fld("Kind style", s("select", "kindStyle", { options: [["upper", "BJL / U-BJL / L-BJL"], ["title", "Bjl. / U-Bjl. / L-Bjl."] ] })));
  }

  function multiForm(ids) {
    const d = doc();
    const counts = {};
    ids.forEach(function (id) {
      const f = RS.model.find(d, id);
      if (f) { counts[f.entity.type] = (counts[f.entity.type] || 0) + 1; }
    });
    const list = Object.keys(counts).map((k) => counts[k] + " x " + (TYPE_NAMES[k] || k).toLowerCase()).join(", ");
    return h("div", { class: "form" },
      h("div", { class: "entity-head" }, h("strong", { text: ids.length + " items selected" })),
      h("p", { class: "muted", text: list }),
      h("div", { class: "actions" }, button("Delete " + ids.length + " items", function () { deleteIds(ids); }, "danger")));
  }

  // ------------------------------------------------------------------ rendering
  function structureKey() {
    const d = doc();
    if (!d) { return "none"; }
    const sel = RS.store.sel();
    const parts = ["sel=" + sel.join(","), "sheet=" + d.active + "/" + d.sheets.length, "lang=" + d.settings.lang];
    const sh = RS.model.activeSheet(d);
    const av = RS.store.activeView();
    parts.push("view=" + av + "/" + (sh ? sh.views.length : 0));
    sel.forEach(function (id) {
      const f = RS.model.find(d, id);
      if (!f) { parts.push("gone"); return; }
      const e = f.entity;
      let k = e.type;
      if (e.pts) { k += ":p" + e.pts.length; }
      if (e.holes) { k += ":h" + e.holes.map((r) => r.length).join("-"); }
      if (e.type === "dots") { k += ":" + e.mode; }
      if (e.type === "label") {
        k += ":" + (e.tip ? "t" : "") + (e.dist ? "d" : "");
        if (f.view) {
          k += ":" + f.view.entities.filter((q) => q.type === "bar" || q.type === "dots").map((q) => q.id).join(",");
        }
      }
      parts.push(k);
    });
    return parts.join(";");
  }

  function focusInside() {
    const a = document.activeElement;
    if (!root || !a || !root.contains(a)) { return false; }
    const t = a.tagName;
    return t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  }

  function build() {
    syncers = [];
    root.innerHTML = "";
    const d = doc();
    if (!d) { return; }
    const sel = RS.store.sel();
    if (sel.length === 1) {
      root.appendChild(h("div", { class: "panel-title", text: "Properties" }));
      root.appendChild(entityForm(sel[0]));
      return;
    }
    if (sel.length > 1) {
      root.appendChild(h("div", { class: "panel-title", text: "Properties" }));
      root.appendChild(multiForm(sel));
      return;
    }
    root.appendChild(h("div", { class: "panel-title", text: "Nothing selected" }));
    root.appendChild(h("p", { class: "muted pad", text: "Click an object on the sheet to edit it. Below: the active view, the sheet and the document." }));
    const view = RS.store.activeViewObject();
    if (view) { root.appendChild(viewForm(view)); }
    const sheet = RS.model.activeSheet(d);
    if (sheet) {
      root.appendChild(sheetForm(sheet));
      root.appendChild(titleForm());
      root.appendChild(notesForm());
    }
    root.appendChild(docForm());
  }

  function refresh() {
    if (!root || !RS.store.doc()) { return; }
    const key = structureKey();
    if (key === lastKey) {
      syncers.forEach(function (f) { try { f(); } catch (err) { /* ignore */ } });
      return;
    }
    // structure changed: rebuild (keeping the scroll position); a focused text input only survives when the key is equal
    const top = root.scrollTop;
    lastKey = key;
    build();
    root.scrollTop = top;
  }

  function init(el) {
    root = el;
    unsubs.forEach(function (f) { f(); });
    unsubs = [];
    lastKey = null;
    ["change", "select", "view"].forEach(function (ev) {
      unsubs.push(RS.store.on(ev, function () {
        try {
          if (ev !== "change" && focusInside()) { document.activeElement.blur(); }
          refresh();
        } catch (err) { if (typeof console !== "undefined") { console.error(err); } }
      }));
    });
    refresh();
  }

  RS.panels = { init: init, refresh: refresh };
})(window.RS);
</script>
<script>
/* --- src/ui/import.js --- */
/* ui/import.js: "Import from SOFiSTiK...": file picker, section list dialog, report dialog, and the panel hook for linked items */
(function (RS) {
  "use strict";

  const U = RS.util;

  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        const v = attrs[k];
        if (v === undefined || v === null || v === false) { return; }
        if (k === "class") { el.className = v; }
        else if (k === "text") { el.textContent = v; }
        else if (k === "on") { Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); }); }
        else { el.setAttribute(k, v === true ? "" : v); }
      });
    }
    for (let i = 2; i < arguments.length; i++) {
      const c = arguments[i];
      if (c === null || c === undefined || c === false) { continue; }
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }

  function toast(msg) { if (RS.app && RS.app.toast) { RS.app.toast(msg); } }
  function message(err) { return err && err.message ? err.message : String(err); }

  // ---------------------------------------------------------------- finding and naming views
  /** The view linked to the same model and section: { sheet, view } | null. */
  function findLinked(doc, model, sectionKey) {
    for (let s = 0; s < doc.sheets.length; s++) {
      const views = doc.sheets[s].views || [];
      for (let i = 0; i < views.length; i++) {
        const l = views[i].link;
        if (l && l.source === "sofistik" && l.model === model && l.section === sectionKey) { return { sheet: doc.sheets[s], view: views[i] }; }
      }
    }
    return null;
  }

  /** "A-A" for section A; when that name is taken on the sheet, the next free letter ("B-B", "C-C", ...). */
  function freeName(sheet, sec, extraTaken) {
    const taken = {};
    (sheet.views || []).forEach(function (v) { taken[v.name] = true; });
    (extraTaken || []).forEach(function (n) { taken[n] = true; });
    const first = RS.exchange.sectionTitle(sec);
    if (!taken[first]) { return first; }
    const name = String(sec.name);
    const start = name.length === 1 && /[A-Za-z]/.test(name) ? name.toUpperCase().charCodeAt(0) - 65 + 1 : 0;
    for (let i = 0; i < 26; i++) {
      const L = String.fromCharCode(65 + (start + i) % 26);
      const cand = L + "-" + L;
      if (!taken[cand]) { return cand; }
    }
    let n = 2;
    while (taken[first + " (" + n + ")"]) { n++; }
    return first + " (" + n + ")";
  }

  function itemsBBox(sec) {
    let bb = null;
    sec.items.forEach(function (it) {
      it.pts.forEach(function (p) {
        bb = bb ? [Math.min(bb[0], p[0]), Math.min(bb[1], p[1]), Math.max(bb[2], p[0]), Math.max(bb[3], p[1])] : [p[0], p[1], p[0], p[1]];
      });
    });
    return bb || [0, 0, 100, 100];
  }

  /** Put a new view on free paper: with RS.layout when it is there, otherwise under the last view of the sheet. */
  function placeNew(view, sheet, doc, sec) {
    if (RS.layout && typeof RS.layout.placeView === "function") {
      RS.layout.placeView(view, sheet, doc);
      return;
    }
    const bb = itemsBBox(sec);
    const sc = view.scale;
    const wP = (bb[2] - bb[0]) / sc + 60, hP = (bb[3] - bb[1]) / sc + 12;     // paper size incl. label column and title
    let px = 30, py = 30;
    if (RS.layout && typeof RS.layout.freeSpot === "function") {
      const sp = RS.layout.freeSpot(sheet, wP, hP, doc);
      px = sp[0]; py = sp[1];
    } else {
      let bottom = null, left = null;
      (sheet.views || []).forEach(function (v) {
        if (v === view) { return; }
        let b = null;
        try { b = RS.render.viewBBox(v, doc); } catch (e) { b = null; }
        if (b && b.every(isFinite)) {
          bottom = bottom === null ? b[3] : Math.max(bottom, b[3]);
          left = left === null ? b[0] : Math.min(left, b[0]);
        }
      });
      if (bottom !== null) { px = left; py = bottom + 15; }
    }
    view.x = U.round(px - bb[0] / sc, 1);
    view.y = U.round(py + 10 + bb[3] / sc, 1);
  }

  // ---------------------------------------------------------------- the import itself
  /**
   * Import the chosen sections in ONE undo step. picks: [{ section (from RS.exchange.parse), view (id of the view to
   * update, or null for a new one on the active sheet) }]. Returns the reports (one per section).
   */
  function apply(data, picks) {
    const reports = [];
    let lastId = null;
    RS.store.edit(function (doc) {
      const sheet = RS.model.activeSheet(doc);
      const madeNames = [];
      picks.forEach(function (pk) {
        const sec = pk.section;
        let view = pk.view ? RS.model.viewById(doc, pk.view) : null;
        const isNew = !view;
        if (isNew) {
          view = RS.model.newView({
            name: freeName(sheet, sec, madeNames), kind: sec.kind === "plan" ? "plan" : "section", scale: sec.scale,
            link: { source: "sofistik", model: data.source.model, section: sec.key, imported: "", keys: [], removed: [] }
          });
          madeNames.push(view.name);
          sheet.views.push(view);
        }
        const rep = RS.merge.importSection(view, sec, { model: data.source.model });
        view.link.name = String(sec.name);                 // the model's section name (the view may be named otherwise)
        rep.isNew = isNew;
        rep.title = view.name;
        reports.push(rep);
        if (isNew) { placeNew(view, sheet, doc, sec); }
        lastId = view.id;
      });
    }, "Import from SOFiSTiK");
    if (lastId) { RS.store.setActiveView(lastId); }
    if (RS.canvas && RS.canvas.fitDrawing) { try { RS.canvas.fitDrawing(); } catch (e) { /* ignore */ } }
    return reports;
  }

  // ---------------------------------------------------------------- dialogs
  function dialogApi() { return RS.app; }

  function reportDialog(reports) {
    const body = [];
    reports.forEach(function (r) {
      const parts = [r.added + " added", r.updated + " updated", r.unchanged + " unchanged"];
      if (r.removed) { parts.push(r.removed + " removed"); }
      if (r.kept.length) { parts.push(r.kept.length + " kept"); }
      if (r.skipped) { parts.push(r.skipped + " not added (deleted by you)"); }
      body.push(h("h3", { text: "View " + r.title + (r.isNew ? " (new)" : "") }));
      body.push(h("p", { text: parts.join(", ") + "." }));
      if (r.kept.length) {
        body.push(h("p", { class: "muted", text: "Kept as you left them (the model has different values; select the item to take or ignore them):" }));
        body.push(h("ul", null, ...r.kept.map(function (k) { return h("li", { text: k.key + ": " + k.what }); })));
      }
    });
    if (!reports.length) { body.push(h("p", { text: "Nothing was imported." })); }
    dialogApi().openDialog("Import report", body, [{ text: "Close", fn: dialogApi().closeDialog }]);
  }

  /** The list of sections of a parsed file, with a checkbox and a target for each. */
  function showDialog(data, fileName) {
    const doc = RS.store.doc();
    const sheet = RS.model.activeSheet(doc);
    const rows = data.sections.map(function (sec) {
      const hit = findLinked(doc, data.source.model, sec.key);
      const cb = h("input", { type: "checkbox", checked: true, "data-sec": sec.key });
      cb.checked = true;
      const target = hit
        ? "update view " + hit.view.name + " on " + hit.sheet.name
        : "new view on " + sheet.name;
      const nBars = sec.items.filter(function (i) { return i.type !== "outline"; }).length;
      return {
        sec: sec, hit: hit, cb: cb,
        tr: h("tr", null,
          h("td", null, cb),
          h("td", { text: RS.exchange.sectionTitle(sec) + (sec.kind === "plan" ? " (plan)" : "") }),
          h("td", { text: nBars + " reinforcement item" + (nBars === 1 ? "" : "s") + ", 1:" + sec.scale }),
          h("td", { class: "muted", text: target }))
      };
    });
    const info = [fileName, data.source.model && "model " + data.source.model, data.source.exported && "exported " + data.source.exported]
      .filter(Boolean).join(", ");
    const body = [
      h("p", { class: "muted", text: info }),
      h("table", { class: "help" }, ...rows.map(function (r) { return r.tr; })),
      h("p", { class: "muted", text: "Updating keeps everything you changed or added. Items you changed are listed in the report." })
    ];
    dialogApi().openDialog("Import from SOFiSTiK", body, [
      { text: "Import", cls: "primary", fn: function () {
        const picks = rows.filter(function (r) { return r.cb.checked; }).map(function (r) { return { section: r.sec, view: r.hit ? r.hit.view.id : null }; });
        if (!picks.length) { toast("No section is ticked."); return; }
        dialogApi().closeDialog();
        reportDialog(apply(data, picks));
      } },
      { text: "Cancel", fn: dialogApi().closeDialog }
    ]);
    return rows;
  }

  // ---------------------------------------------------------------- file picker
  let input = null;

  function readText(file) {
    if (file && typeof file.text === "function") { return file.text(); }
    return new Promise(function (resolve, reject) {
      const fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(new Error("The file could not be read.")); };
      fr.readAsText(file);
    });
  }

  /** Read a File and show the section dialog; a wrong file gives a message (and the promise rejects with the same Error). */
  function openFile(file) {
    return readText(file).then(function (text) {
      const data = RS.exchange.parse(text);
      if (!data.sections.length) { throw new Error("The sections file contains no sections."); }
      showDialog(data, file.name || "");
      return data;
    }).catch(function (err) { toast(message(err)); throw err; });
  }

  /** Open the file picker. */
  function pick() {
    if (!input) {
      input = h("input", { type: "file", accept: ".rsec.json,.json,application/json", class: "hidden" });
      input.addEventListener("change", function () {
        const f = input.files && input.files[0];
        if (f) { openFile(f).catch(function () { /* the message is shown */ }); }
      });
      document.body.appendChild(input);
    }
    input.value = "";
    input.click();
  }

  // ---------------------------------------------------------------- panel hook
  function stamp(iso) { return iso ? String(iso).slice(0, 16).replace("T", " ") : "?"; }

  function describeSrc(e) {
    const m = e.src.meta || {};
    if (e.type === "outline") { return "section outline"; }
    if (e.type === "label") { return "label of " + e.src.key.replace(/^label:/, ""); }
    const parts = [];
    if (Array.isArray(m.els) && m.els.length) { parts.push("SAR " + m.els.join("+")); }
    if (m.faceName) { parts.push(m.faceName); }
    if (m.dir) { parts.push(String(m.dir).replace(/\s*\(.*\)\s*$/, "")); }
    if (m.zone) { parts.push("zone " + m.zone); }
    return parts.length ? parts.join(", ") : e.src.key;
  }

  function mutate(id, fn, label) {
    RS.store.edit(function (d) {
      const hit = RS.model.find(d, id);
      if (hit) { fn(hit.entity); }
    }, label);
  }

  function panelHook(container, ctx) {
    if (!container || !ctx) { return; }
    const e = ctx.entity;
    if (e && e.src) {
      const box = h("div", { class: "linkbox" });
      box.appendChild(h("p", { class: "muted", text: "From SOFiSTiK: " + describeSrc(e) + (e.src.orphan ? " (no longer in the model)" : "") }));
      if (e.src.pending) {
        box.appendChild(h("p", { text: "Changed by you; the model now has " + RS.merge.describePending(e) + "." }));
        box.appendChild(h("div", { class: "btnrow" },
          h("button", { type: "button", text: "Take the model's values", on: { click: function () { mutate(e.id, RS.merge.acceptModel, "Take the model's values"); } } }),
          h("button", { type: "button", text: "Keep mine", on: { click: function () { mutate(e.id, RS.merge.keepMine, "Keep my values"); } } })));
      }
      container.appendChild(box);
    } else if (!e && ctx.view && ctx.view.link) {
      const l = ctx.view.link;
      const box = h("div", { class: "linkbox" });
      const sn = typeof l.name === "string" && l.name !== "" ? l.name : "";
      const secText = sn && RS.exchange.sectionTitle({ name: sn }) !== ctx.view.name
        ? "section " + sn + " (cut " + RS.exchange.sectionTitle({ name: sn }) + " in the model)"
        : "section " + (sn ? RS.exchange.sectionTitle({ name: sn }) : ctx.view.name);
      box.appendChild(h("p", { class: "muted", text: "Linked to " + (l.model || "the model") + ", " + secText + ", imported " + stamp(l.imported) }));
      box.appendChild(h("button", { type: "button", text: "Import again...", on: { click: function () { pick(); } } }));
      container.appendChild(box);
    }
  }

  RS.panelHooks = RS.panelHooks || [];
  RS.panelHooks.push(panelHook);

  RS.importUI = { pick: pick, openFile: openFile, showDialog: showDialog, reportDialog: reportDialog, apply: apply, findLinked: findLinked, freeName: freeName, panelHook: panelHook };
})(window.RS);
</script>
<script>
/* --- src/ui/app.js --- */
/* ui/app.js: application shell: start-up, top bar, tool strip, options bar, status bar, dialogs, keyboard, export */
(function (RS) {
  "use strict";

  let toastTimer = null;
  let toolButtons = {};
  let optFields = {};
  let undoBtn = null, redoBtn = null, sheetLabel = null, fileInput = null;
  let statusEls = {};
  let started = false;

  const $ = (id) => document.getElementById(id);

  // ------------------------------------------------------------------ DOM helper
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        const v = attrs[k];
        if (v === undefined || v === null || v === false) { return; }
        if (k === "class") { el.className = v; }
        else if (k === "text") { el.textContent = v; }
        else if (k === "on") { Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); }); }
        else { el.setAttribute(k, v === true ? "" : v); }
      });
    }
    for (let i = 2; i < arguments.length; i++) {
      const c = arguments[i];
      if (c === null || c === undefined || c === false) { continue; }
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }

  // ------------------------------------------------------------------ toast
  function toast(msg) {
    const el = $("toast");
    if (!el) { return; }
    el.textContent = String(msg);
    el.classList.add("show");
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { el.classList.remove("show"); toastTimer = null; }, 3000);
  }

  function guard(fn) {
    return function () {
      try {
        const r = fn.apply(this, arguments);
        if (r && typeof r.then === "function") { r.catch(function (err) { toast(err && err.message ? err.message : String(err)); }); }
        return r;
      } catch (err) {
        toast(err && err.message ? err.message : String(err));
        return undefined;
      }
    };
  }

  // ------------------------------------------------------------------ dialog
  function closeDialog() {
    const dlg = $("dialog");
    if (!dlg) { return; }
    try { if (dlg.open) { dlg.close(); } } catch (err) { dlg.removeAttribute("open"); }
  }

  function openDialog(title, bodyEls, buttons) {
    const dlg = $("dialog");
    dlg.innerHTML = "";
    const head = h("div", { class: "dlg-head" }, h("h2", { text: title }),
      h("button", { type: "button", class: "dlg-x", title: "Close", text: "x", on: { click: closeDialog } }));
    const body = h("div", { class: "dlg-body" });
    (bodyEls || []).forEach(function (b) { body.appendChild(b); });
    dlg.appendChild(head);
    dlg.appendChild(body);
    if (buttons && buttons.length) {
      const foot = h("div", { class: "dlg-foot" });
      buttons.forEach(function (b) {
        foot.appendChild(h("button", { type: "button", class: b.cls || "", text: b.text, on: { click: guard(b.fn) } }));
      });
      dlg.appendChild(foot);
    }
    if (typeof dlg.showModal === "function") {
      if (!dlg.open) { dlg.showModal(); }
    } else {
      dlg.setAttribute("open", "");
    }
  }

  // ------------------------------------------------------------------ document helpers
  function hasContent(d) {
    return d.sheets.some(function (s) {
      return s.items.length > 0 || s.views.some(function (v) { return v.entities.length > 0; });
    });
  }

  function replaceDoc(newDoc) {
    RS.store.init(newDoc);
    RS.store.setTool("select");
    if (RS.canvas && RS.canvas.fitDrawing) { RS.canvas.fitDrawing(); }
  }

  function beamTemplate() {
    const list = RS.templates.list;
    for (let i = 0; i < list.length; i++) { if (list[i].id === "beam") { return list[i]; } }
    return list[0];
  }

  function chooseTemplate(t) {
    replaceDoc(t.make());
    closeDialog();
    toast("New drawing: " + t.name);
  }

  function newDialog() {
    const cards = RS.templates.list.map(function (t) {
      return h("button", { type: "button", class: "card", on: { click: guard(function () {
        if (hasContent(RS.store.doc())) { confirmReplace(t); } else { chooseTemplate(t); }
      }) } }, h("strong", { text: t.name }), h("span", { text: t.description }));
    });
    openDialog("New drawing", [h("p", { class: "muted", text: "Choose a starting point:" }), h("div", { class: "cards" }, ...cards)],
      [{ text: "Cancel", fn: closeDialog }]);
  }

  function confirmReplace(t) {
    openDialog("Replace the current drawing?", [
      h("p", { text: "The current drawing will be replaced by \"" + t.name + "\". Unsaved work is lost (use Save first to keep it; Undo is not available after replacing)." })
    ], [
      { text: "Replace", cls: "danger", fn: function () { chooseTemplate(t); } },
      { text: "Back", fn: newDialog },
      { text: "Cancel", fn: closeDialog }
    ]);
  }

  function helpDialog() {
    const tools = (RS.canvas && RS.canvas.TOOLS) || [];
    const trs = tools.map(function (t) {
      return h("tr", null, h("td", { class: "k" }, h("kbd", { text: t.key })), h("td", { class: "n", text: t.name }), h("td", { text: t.hint || (RS.canvas.toolHint ? RS.canvas.toolHint(t.id) : "") }));
    });
    const mouse = [
      ["Wheel", "zoom at the cursor"],
      ["Middle or right button drag, or Space + drag", "pan the sheet"],
      ["F", "fit the sheet in the window"],
      ["Click / Shift+click", "select / add to the selection"],
      ["Drag a selected object", "move it; drag a square handle to move one point"],
      ["Delete, arrow keys", "delete the selection, nudge it 1 mm (Shift: 10 mm)"],
      ["Esc", "cancel the running tool, back to Select"],
      ["Ctrl+Z / Ctrl+Y (Ctrl+Shift+Z)", "undo / redo"],
      ["Ctrl+S / Ctrl+O", "save / open a .rdraw.json file"]
    ].map(function (r) { return h("tr", null, h("td", { class: "n wide", text: r[0] }), h("td", { text: r[1] })); });
    const steps = [
      "Pick the Rectangle tool (R) and click two corners: this is the concrete outline. The view is 1:20 by default; change the scale in the panel (nothing selected).",
      "Set the link diameter in the options bar, pick the Stirrup tool (S) and click inside the outline: a closed stirrup appears at the concrete cover.",
      "Choose the bar diameter and count, pick Edge dots (G) and click the bottom (and top) edge of the outline: a row of cut bars appears inside the stirrup.",
      "Pick Label (L), click a bar or dot row, then click where the text should stand: the text (\"BJL Y10/150\", \"4 Y20\") is made automatically. In the panel you can add a distribution line.",
      "Pick Dimension (M), click two points, then the position of the dimension line. Use Section cut (C) and Joint (J) for markers.",
      "Fill in the title block and notes in the panel (nothing selected), then Export PDF, SVG or DXF in the top bar."
    ].map(function (t) { return h("li", { text: t }); });
    openDialog("Help", [
      h("h3", { text: "Tools" }), h("table", { class: "help" }, ...trs),
      h("h3", { text: "Mouse and keyboard" }), h("table", { class: "help" }, ...mouse),
      h("h3", { text: "How to make a section" }), h("ol", null, ...steps)
    ], [{ text: "Close", fn: closeDialog }]);
  }

  // ------------------------------------------------------------------ files and export
  function safeName(text) {
    const s = String(text || "").replace(/[\\\/:*?"<>|\u0000-\u001f]/g, "_").replace(/\s+/g, " ").trim().replace(/^\.+/, "");
    return s || "drawing";
  }

  function exportData() {
    const d = RS.store.doc();
    const sheet = RS.model.activeSheet(d);
    const paper = RS.config.papers[sheet.paper] || RS.config.papers[RS.config.defaults.paper] || RS.config.papers.A1;
    const prims = RS.render.sheetPrims(d, d.active, { forExport: true });
    return { doc: d, sheet: sheet, paper: paper, prims: prims, base: safeName(sheet.title && sheet.title.number) };
  }

  const doPDF = guard(function () {
    const x = exportData();
    const bytes = RS.io.toPDF(x.prims, x.paper, { title: (x.sheet.title && x.sheet.title.title) || x.base });
    RS.io.download(x.base + ".pdf", bytes, "application/pdf");
    toast("PDF exported: " + x.base + ".pdf");
  });
  const doSVG = guard(function () {
    const x = exportData();
    RS.io.download(x.base + ".svg", RS.io.toSVG(x.prims, x.paper), "image/svg+xml");
    toast("SVG exported: " + x.base + ".svg");
  });
  const doDXF = guard(function () {
    const x = exportData();
    RS.io.download(x.base + ".dxf", RS.io.toDXF(x.prims, x.paper), "application/dxf");
    toast("DXF exported: " + x.base + ".dxf");
  });
  const doPrint = guard(function () {
    const x = exportData();
    RS.io.printSVG(RS.io.toSVG(x.prims, x.paper), x.paper);
  });
  const doSave = guard(function () {
    const name = RS.store.saveFile();
    toast("Saved " + name);
  });
  const doOpen = guard(function () { if (fileInput) { fileInput.value = ""; fileInput.click(); } });
  const doUndo = guard(function () { RS.store.undo(); });
  const doRedo = guard(function () { RS.store.redo(); });

  // ------------------------------------------------------------------ top bar
  function buildTopbar() {
    const bar = $("topbar");
    bar.innerHTML = "";
    const btn = function (text, fn, title, cls) {
      return h("button", { type: "button", class: "tb " + (cls || ""), text: text, title: title || "", on: { click: fn } });
    };
    fileInput = h("input", { type: "file", accept: ".json,.rdraw.json,application/json", class: "hidden" });
    fileInput.addEventListener("change", guard(function () {
      const f = fileInput.files && fileInput.files[0];
      if (!f) { return undefined; }
      return RS.store.openFile(f).then(function () {
        RS.store.setTool("select");
        if (RS.canvas && RS.canvas.fitDrawing) { RS.canvas.fitDrawing(); }
        toast("Opened " + f.name);
      }).catch(function (err) { toast(err && err.message ? err.message : String(err)); });
    }));
    undoBtn = btn("Undo", doUndo, "Undo (Ctrl+Z)");
    redoBtn = btn("Redo", doRedo, "Redo (Ctrl+Y)");
    sheetLabel = h("span", { class: "sheetname" });
    bar.appendChild(h("span", { class: "brand", text: "Rebar Drawing Studio" }));
    bar.appendChild(btn("New...", guard(newDialog), "Start a new drawing from a template"));
    bar.appendChild(btn("Open...", doOpen, "Open a .rdraw.json file (Ctrl+O)"));
    bar.appendChild(btn("Save", doSave, "Save as .rdraw.json (Ctrl+S)"));
    bar.appendChild(btn("Import from SOFiSTiK...", guard(function () { RS.importUI.pick(); }), "Import sections (.rsec.json) exported by the SOFiSTiK model program as views; importing again keeps your changes"));
    bar.appendChild(h("span", { class: "sep" }));
    bar.appendChild(undoBtn);
    bar.appendChild(redoBtn);
    bar.appendChild(h("span", { class: "sep" }));
    bar.appendChild(btn("Export PDF", doPDF, "True-scale PDF of the active sheet"));
    bar.appendChild(btn("Export SVG", doSVG));
    bar.appendChild(btn("Export DXF", doDXF));
    bar.appendChild(btn("Print", doPrint, "Print the active sheet"));
    bar.appendChild(h("span", { class: "sep" }));
    bar.appendChild(btn("Help", guard(helpDialog), "Tools, shortcuts and a short walkthrough"));
    bar.appendChild(h("span", { class: "grow" }));
    bar.appendChild(sheetLabel);
    bar.appendChild(fileInput);
  }

  function updateTopbar() {
    if (!undoBtn) { return; }
    undoBtn.disabled = !RS.store.canUndo();
    redoBtn.disabled = !RS.store.canRedo();
    const d = RS.store.doc();
    const s = d ? RS.model.activeSheet(d) : null;
    if (s) {
      const extra = s.title && s.title.title ? " - " + s.title.title : "";
      sheetLabel.textContent = (s.name || "Sheet") + extra + " (" + s.paper + ")";
    }
  }

  // ------------------------------------------------------------------ tool strip
  const GLYPH = {
    select: "↖", outline: "⬠", rect: "▭", bar: "╱", stirrup: "▢", edgebar: "━", dots: "••",
    edgedots: "⋯", label: "A↗", dim: "↔", text: "T", cut: "⇵", joint: "//", view: "▣", pan: "✋"
  };

  function buildTools() {
    const el = $("tools");
    el.innerHTML = "";
    toolButtons = {};
    const tools = RS.canvas && RS.canvas.TOOLS ? RS.canvas.TOOLS : [{ id: "select", name: "Select", key: "V", hint: "" }];
    tools.forEach(function (t) {
      const b = h("button", { type: "button", class: "tool", "data-tool": t.id, title: t.name + " (" + t.key + ")" + (t.hint ? ": " + t.hint : ""),
        on: { click: function () { RS.store.setTool(t.id); } } },
        h("span", { class: "ic", text: GLYPH[t.id] || "●" }), h("span", { class: "nm", text: t.name }), h("kbd", { text: t.key }));
      toolButtons[t.id] = b;
      el.appendChild(b);
    });
    updateTools();
  }

  function updateTools() {
    const cur = RS.store.tool();
    Object.keys(toolButtons).forEach(function (id) { toolButtons[id].classList.toggle("on", id === cur); });
  }

  // ------------------------------------------------------------------ options bar
  // which option fields matter for which tool
  const OPT_FOR = {
    bar: ["d", "kind", "s", "face", "cover"],
    stirrup: ["dLink", "s", "cover"],
    edgebar: ["d", "s", "face", "cover"],
    dots: ["d", "n", "face"],
    edgedots: ["d", "n", "dLink", "face", "cover"],
    view: ["scale"]
  };

  function buildOptbar() {
    const bar = $("optbar");
    bar.innerHTML = "";
    optFields = {};
    const opts = RS.toolOpts;
    if (!opts) { bar.appendChild(h("span", { class: "muted", text: "(options not available)" })); return; }

    const mkSelect = function (key, label, values, numeric, titleText) {
      const sel = h("select", { title: titleText || label });
      values.forEach(function (v) { sel.appendChild(h("option", { value: String(v[0]), text: v[1] })); });
      sel.value = String(opts[key]);
      sel.addEventListener("change", function () { opts[key] = numeric ? parseFloat(sel.value) : sel.value; });
      const wrap = h("label", { class: "opt" }, h("span", { text: label }), sel);
      optFields[key] = { wrap: wrap, sync: function () { sel.value = String(opts[key]); } };
      bar.appendChild(wrap);
    };
    const mkNumber = function (key, label, min, titleText) {
      const inp = h("input", { type: "number", min: String(min), step: "any", title: titleText || label });
      inp.value = String(opts[key]);
      inp.addEventListener("change", function () {
        const v = parseFloat(inp.value);
        if (isFinite(v) && v >= min) { opts[key] = v; } else { inp.value = String(opts[key]); }
      });
      const wrap = h("label", { class: "opt" }, h("span", { text: label }), inp);
      optFields[key] = { wrap: wrap, sync: function () { inp.value = String(opts[key]); } };
      bar.appendChild(wrap);
    };

    const dia = RS.config.diameters.map((d) => [d, String(d)]);
    mkSelect("d", "Diameter Ø", dia, true, "Bar diameter");
    mkSelect("kind", "Kind", [["straight", "straight"], ["stirrup", "stirrup"], ["U", "U-bar"], ["L", "L-bar"], ["free", "free"]], false, "Kind of a new bar");
    mkNumber("n", "Count n", 1, "Number of bars in a dot row");
    mkNumber("s", "Spacing s", 1, "Spacing in mm (shown as /s in the label)");
    mkSelect("face", "Face", RS.config.faces.map((f) => [f, f === "" ? "none" : f]), false, "Face code in the label (OS, US, IS, YS, BS)");
    mkSelect("dLink", "Link Ø", dia, true, "Diameter of the stirrup / link around dot rows");
    mkSelect("scale", "Scale 1:", RS.config.scales.map((x) => [x, String(x)]), true, "Scale of new views");

    // cover lives in the document settings
    const cov = h("input", { type: "number", min: "0", step: "1", title: "Concrete cover in mm (document setting)" });
    const syncCover = function () { const d = RS.store.doc(); if (d && document.activeElement !== cov) { cov.value = String(d.settings.cover); } };
    cov.addEventListener("change", guard(function () {
      const v = parseFloat(cov.value);
      if (!isFinite(v) || v < 0) { syncCover(); return; }
      if (v !== RS.store.doc().settings.cover) { RS.store.edit(function (d) { d.settings.cover = v; }, "Edit cover"); }
    }));
    const covWrap = h("label", { class: "opt" }, h("span", { text: "Cover" }), cov);
    optFields.cover = { wrap: covWrap, sync: syncCover };
    bar.appendChild(covWrap);

    bar.appendChild(h("span", { class: "optnote muted", id: "optnote" }));
    updateOptbar();
  }

  function updateOptbar() {
    const tool = RS.store.tool();
    const show = OPT_FOR[tool] || [];
    Object.keys(optFields).forEach(function (k) {
      optFields[k].wrap.classList.toggle("hidden", show.indexOf(k) < 0);
      optFields[k].sync();
    });
    const note = $("optnote");
    if (note) {
      note.textContent = show.length ? "" : "No options for this tool.";
    }
  }

  // ------------------------------------------------------------------ status bar
  function buildStatus() {
    const bar = $("status");
    bar.innerHTML = "";
    statusEls = {
      xy: h("span", { class: "st xy", text: "x: -  y: -" }),
      view: h("span", { class: "st view", text: "" }),
      snap: h("span", { class: "st snap", text: "" }),
      hint: h("span", { class: "st hint", text: "" })
    };
    bar.appendChild(statusEls.xy);
    bar.appendChild(statusEls.view);
    bar.appendChild(statusEls.snap);
    bar.appendChild(statusEls.hint);
    if (RS.canvas) {
      RS.canvas.onStatus = function (info) {
        if (!info) { return; }
        statusEls.xy.textContent = info.x === null || info.x === undefined ? "x: -  y: -" : "x: " + info.x + "  y: " + info.y;
        statusEls.view.textContent = info.view ? "View " + info.view + (info.scale ? "  1:" + info.scale : "") : "";
        statusEls.snap.textContent = info.snap ? "snap: " + info.snap : "";
        statusEls.hint.textContent = info.hint || "";
      };
    }
  }

  // ------------------------------------------------------------------ keyboard
  function inTextField(t) {
    if (!t || !t.tagName) { return false; }
    const tag = t.tagName;
    if (tag === "TEXTAREA" || tag === "SELECT") { return true; }
    if (tag === "INPUT") {
      const type = (t.getAttribute("type") || "text").toLowerCase();
      return type !== "checkbox" && type !== "radio" && type !== "button" && type !== "file";
    }
    return !!t.isContentEditable;
  }

  function onKey(ev) {
    if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) { return; }
    const k = String(ev.key).toLowerCase();
    const dlgOpen = $("dialog") && $("dialog").open;
    if (k === "s") { ev.preventDefault(); if (!dlgOpen) { doSave(); } return; }
    if (k === "o") { ev.preventDefault(); if (!dlgOpen) { doOpen(); } return; }
    if (inTextField(ev.target) || dlgOpen) { return; }
    if (k === "z" && !ev.shiftKey) { ev.preventDefault(); doUndo(); }
    else if (k === "y" || (k === "z" && ev.shiftKey)) { ev.preventDefault(); doRedo(); }
  }

  // ------------------------------------------------------------------ start
  function start() {
    if (started) { return; }
    started = true;
    let d = null;
    try { d = RS.store.loadAutosave(); } catch (err) { d = null; }
    if (!d) { d = beamTemplate().make(); }
    RS.store.init(d);

    buildTopbar();
    buildTools();
    buildOptbar();
    buildStatus();

    const canvasEl = $("canvas");
    if (RS.canvas && typeof RS.canvas.init === "function") {
      try { RS.canvas.init(canvasEl); } catch (err) { toast("Canvas failed to start: " + (err && err.message ? err.message : err)); }
      // open zoomed to the drawing (F fits the whole sheet)
      try { RS.canvas.fitDrawing(); setTimeout(function () { try { RS.canvas.fitDrawing(); } catch (e) { /* ignore */ } }, 50); } catch (err) { /* ignore */ }
    } else {
      toast("The drawing canvas is not available in this build.");
    }
    try { RS.panels.init($("panel")); } catch (err) { toast("Panel failed to start: " + (err && err.message ? err.message : err)); }
    if (statusEls.hint && RS.canvas && RS.canvas.toolHint) { statusEls.hint.textContent = RS.canvas.toolHint(RS.store.tool()); }

    RS.store.on("change", updateTopbar);
    RS.store.on("tool", function () { updateTools(); updateOptbar(); });
    RS.store.on("change", function () { const f = optFields.cover; if (f) { f.sync(); } });
    updateTopbar();

    document.addEventListener("keydown", onKey);
    window.addEventListener("pagehide", function () { try { RS.store.flushAutosave(); } catch (err) { /* ignore */ } });
    window.addEventListener("error", function (ev) { toast("Error: " + (ev && ev.message ? ev.message : "unknown")); });
  }

  RS.app = { start: start, toast: toast, closeDialog: closeDialog, openDialog: openDialog };
})(window.RS);
</script>
<script>document.addEventListener("DOMContentLoaded",function(){RS.app.start();});</script>
</body>
</html>
